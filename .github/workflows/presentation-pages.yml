# Publishes ONLY the presentation-bundle-lavara/ folder to GitHub Pages
# (the hotel project in the rest of this repository is not published).
# Runs on every push that touches the folder — including "Publish" from the control panel.
# One-time setup: Settings → Pages → Source: GitHub Actions;
# Settings → Environments → github-pages → allow the branch below (or merge it into the default branch).
name: Publish presentation
on:
  push:
    branches: [ccr-87aacda0-76dx1f, claude/session-start-n2vioi, main]
    paths: ['presentation-bundle-lavara/**', '.github/workflows/presentation-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the single-file version from the latest content
        run: |
          pip install --quiet pillow
          python3 presentation-bundle-lavara/tools/build_single.py --esbuild "npx --yes esbuild@0.24.0"
      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a --exclude '.github' --exclude 'data' --exclude 'brand-source' --exclude 'tools' presentation-bundle-lavara/ _site/
          touch _site/.nojekyll
      - name: Join large uploads (videos are uploaded from the control panel in numbered parts)
        run: |
          find _site -name '*.part-[0-9][0-9][0-9]' | sed -E 's/\.part-[0-9]{3}$//' | sort -u | while IFS= read -r f; do
            cat "$f".part-* > "$f" && rm -f "$f".part-* && echo "joined $f ($(stat -c%s "$f") bytes)"
          done
      - name: Cache-bust (every deploy gets fresh CSS/JS, no stale browser copies)
        run: |
          V="${GITHUB_SHA::8}"
          find _site -maxdepth 1 -name '*.html' -exec sed -i -E "s#(href=\"css/[^\"?]+\.css)\"#\1?v=$V\"#g; s#(src=\"(js|assets/vendor)/[^\"?]+\.js)\"#\1?v=$V\"#g" {} +
          echo "$V" > _site/version.txt
          find _site -maxdepth 1 -name '*.html' -exec sed -i -E "s#^<html #<html data-build=\"$V\" #" {} +
          find _site/js -name '*.js' -exec sed -i -E "s#(from ['\"]\.{1,2}/[^'\"?]+\.js)(['\"])#\1?v=$V\2#g; s#(import\(['\"]\.{1,2}/[^'\"?]+\.js)(['\"])#\1?v=$V\2#g" {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
