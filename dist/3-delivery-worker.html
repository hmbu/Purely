<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>طلباتي — My orders</title>
<style>
/* app/css/app.css */
/* ==========================================================================
   Hotel In-Room Store — guest web app
   Single stylesheet. Plain, ordinary, clean: neutral greys, one calm accent
   (muted teal), soft borders, almost no shadow, no gradients, no animation
   beyond short transitions. System fonts only — nothing is loaded remotely.

   RTL is the default (index.html ships dir="rtl"); i18n.js flips
   <html dir> to "ltr" for English. Every direction-dependent rule below uses
   logical properties (inline-start / inline-end / margin-inline / text-align
   start|end), so this one file serves both directions with no [dir=] forks
   except the two places where a glyph must physically mirror.

   Sections
     1  Tokens
     2  Reset and base
     3  App shell and demo bar
     4  Screen, header, category bar
     5  Buttons and tap areas
     6  Product grid, cards, stepper, badges
     7  Bottom bars (cart bar, action bar)
     8  Lines, summaries, totals
     9  Forms, errors, notices
    10  Modals: backdrop, bottom sheet, centred dialog
    11  Timeline
    12  Toast, empty, loading
    13  Utilities
   ========================================================================== */

/* 1 — Tokens =============================================================== */

:root {
  /* Neutrals */
  --c-page:          #e9ebed;   /* the desk around the phone column */
  --c-surface:       #ffffff;
  --c-surface-2:     #f4f5f6;   /* quiet fills: image boxes, summary blocks */
  --c-ink:           #1b1e20;   /* body text, primary fill */
  --c-ink-2:         #555d63;   /* secondary text, ≥ 4.5:1 on white */
  --c-ink-3:         #767e84;   /* not-yet-reached labels, still ≥ 4.5:1 */
  --c-border:        #dde1e4;
  --c-border-strong: #b6bdc2;

  /* One accent, used sparingly: links, active chip, focus ring */
  --c-accent:        #13706a;
  --c-accent-dark:   #0e5852;
  --c-accent-soft:   #e7f0ef;

  /* Danger — always paired with the "!" icon slot and a border, never alone */
  --c-danger:        #8c2f24;
  --c-danger-soft:   #fbf1f0;

  /* Type scale (px, as the spec states its sizes in px) */
  --t-micro:  10px;   /* "My orders" label, the one 10px string in the spec */
  --t-mini:   12px;   /* counters, banner lines 2–3 */
  --t-small:  14px;   /* minimum body size */
  --t-body:   16px;   /* default, and the minimum on form fields (no zoom) */
  --t-lg:     18px;   /* screen and modal titles */
  --t-xl:     20px;
  --t-2xl:    22px;   /* G-06 status headline */
  --t-room:   28px;   /* room number inline in a sentence */
  --t-huge:   64px;   /* M-01 room number */

  /* Spacing */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;

  /* Radius */
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-pill: 999px;

  /* Layout */
  --app-w:     390px;
  --topbar-h:  60px;
  --catbar-h:  52px;
  --bottom-h:  64px;   /* cart bar / action bar, excluding the safe area */
  --safe-b:    env(safe-area-inset-bottom, 0px);

  --shadow: 0 1px 2px rgba(0, 0, 0, .06);
  --ring:   0 0 0 2px var(--c-surface), 0 0 0 4px var(--c-accent);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Arabic",
          "Segoe UI Arabic", "Geeza Pro", Roboto, Tahoma, Arial, sans-serif;
}

/* 2 — Reset and base ======================================================= */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0; font-family: var(--font); font-size: var(--t-body);
  line-height: 1.5; color: var(--c-ink); background: var(--c-page);
}

h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
img { max-width: 100%; display: block; }
a { color: var(--c-accent); }

button, input, select, textarea { font: inherit; color: inherit; margin: 0; }

/* 16px on every typed field so mobile browsers never auto-zoom on focus. */
input, select, textarea { font-size: var(--t-body); }

:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--r-sm); }

/* A component that sets its own `display` (every .error, .notice, .row and
   flex block below) would otherwise beat the browser's [hidden] rule and show
   an empty box — an error with no message is a bare "!" in a circle. The views
   hide a message by setting `hidden`, so that has to be the stronger rule. */
[hidden] { display: none !important; }

body.is-modal-open { overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* 3 — App shell and demo bar =============================================== */

/* The phone column. On a desktop it is centred on a plain grey page. */
.app {
  max-width: var(--app-w); min-height: 100vh; margin-inline: auto;
  background: var(--c-surface); border-inline: 1px solid var(--c-border);
  position: relative;
}

/* Not part of the product: a plain dark strip in small type, above the app. */
.demo-bar {
  background: #23262a; color: #d8dbde; font-size: var(--t-mini);
  line-height: 1.4; padding: var(--s-2) var(--s-3); display: flex;
  flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3);
  border-block-end: 2px dashed #4a4f55;
}
.demo-bar__tag {
  font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: #ffffff; border: 1px solid #6b7278; border-radius: var(--r-sm);
  padding: 1px var(--s-2);
}
.demo-bar label { display: inline-flex; align-items: center; gap: var(--s-1); }
.demo-bar select, .demo-bar button {
  font-size: var(--t-mini); background: #34383d; color: #f0f2f3;
  border: 1px solid #5a6066; border-radius: var(--r-sm);
  padding: 3px var(--s-2);
}
.demo-bar button { cursor: pointer; }

/* 4 — Screen, header, category bar ========================================= */

.screen { display: block; padding-block-end: calc(var(--s-5) + var(--safe-b)); }
/* Room for whichever bar is pinned at the bottom. */
body:has(.cartbar, .actionbar) .screen { padding-block-end: calc(var(--bottom-h) + var(--s-4) + var(--safe-b)); }
/* G-03's bar stacks the totals block and the helper line above the button, so
   it stands taller than the 64px the token assumes and needs its own reserve. */
body:has(.actionbar--tall) .screen { padding-block-end: calc(168px + var(--safe-b)); }

.screen__body { padding: var(--s-4); }

/* --- Sticky header ------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 30; min-height: var(--topbar-h);
  display: grid; grid-template-columns: 56px 1fr 56px; align-items: center;
  gap: var(--s-2); padding: var(--s-2) var(--s-3);
  background: var(--c-surface); border-block-end: 1px solid var(--c-border);
}
.topbar__side { display: flex; align-items: center; }
.topbar__side--end { justify-content: flex-end; }
.topbar__main { text-align: center; min-width: 0; }
.topbar__title {
  font-size: var(--t-lg); font-weight: 700; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar__sub { font-size: var(--t-mini); color: var(--c-ink-2); }

/* Icon button with a label under it (B02 "My orders"): 10px is allowed there. */
.iconbtn {
  background: none; border: 0; padding: var(--s-1); display: inline-flex;
  flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  color: var(--c-ink);
}
.iconbtn__glyph { font-size: 20px; line-height: 1; }
.iconbtn__label { font-size: var(--t-micro); line-height: 1.2; }

/* --- Active-order banner ------------------------------------------------- */
.banner {
  display: block; width: 100%; min-height: 84px; text-align: start;
  background: var(--c-accent-soft); border: 0;
  border-block-end: 1px solid var(--c-border);
  border-inline-start: 4px solid var(--c-accent);
  padding: var(--s-3) var(--s-4); cursor: pointer; color: inherit;
}
/* Three lines, each on its own line: the views mark them up as spans inside
   the one button that is the whole banner, so the display is set here. */
.banner__line1,
.banner__line2,
.banner__line3 { display: block; }
.banner__line1 { font-size: var(--t-small); font-weight: 700; }
.banner__line2,
.banner__line3 { font-size: var(--t-mini); color: var(--c-ink-2); }
.banner__line3 { color: var(--c-accent-dark); font-weight: 600; margin-block-start: 2px; }

/* --- Sticky category bar ------------------------------------------------- */
.catbar {
  position: sticky; top: var(--topbar-h); z-index: 20;
  background: var(--c-surface); border-block-end: 1px solid var(--c-border);
  padding: var(--s-2) var(--s-3);
}
.catbar__row {
  display: flex; gap: var(--s-2); overflow-x: auto; scroll-behavior: smooth;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.catbar__row::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto; min-height: 32px; display: inline-flex; align-items: center;
  padding-inline: var(--s-3); font-size: var(--t-small); white-space: nowrap;
  background: var(--c-surface-2); color: var(--c-ink);
  border: 1px solid var(--c-border); border-radius: var(--r-pill);
  cursor: pointer; transition: background-color .15s ease, color .15s ease;
}
.chip--active { background: var(--c-ink); color: #ffffff; border-color: var(--c-ink); font-weight: 600; }

.section__title {
  font-size: var(--t-body);
  font-weight: 700;
  padding: var(--s-4) var(--s-4) var(--s-2);
  scroll-margin-block-start: calc(var(--topbar-h) + var(--catbar-h));
}

/* 5 — Buttons and tap areas ================================================ */

.btn {
  position: relative; display: inline-flex; align-items: center;
  justify-content: center; gap: var(--s-2); min-height: 48px;
  padding-inline: var(--s-4); font-size: var(--t-body); font-weight: 700;
  text-align: center; text-decoration: none; background: var(--c-surface);
  color: var(--c-ink); border: 1px solid var(--c-border-strong);
  border-radius: var(--r-md); cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
}
.btn--primary { background: var(--c-ink); color: #ffffff; border-color: var(--c-ink); }
.btn--primary:hover { background: #000000; }
/* Outlined secondary. The 2px border is the M-01 §5.3 rule and is safe
   everywhere: a secondary must never read as a display box. */
.btn--ghost {
  background: transparent;
  border: 2px solid var(--c-ink);
  color: var(--c-ink);
}
.btn--ghost:hover { background: var(--c-surface-2); }
/* A bare text action (e.g. "Edit cart"), still 44px tall for the tap area. */
.btn--link {
  min-height: 44px; padding-inline: var(--s-2); background: none; border: 0;
  border-radius: 0; color: var(--c-accent-dark); font-weight: 600;
  text-decoration: underline;
}
.btn--block { display: flex; width: 100%; }
.btn--tall  { min-height: 56px; }
.btn--sm    { min-height: 40px; font-size: var(--t-small); padding-inline: var(--s-3); }

/* Disabled never relies on colour: reduced opacity + greyscale + a dashed
   border + the not-allowed cursor, so it reads in grayscale and for a
   colour-blind guest. */
.btn[disabled],
.btn.is-disabled,
.btn[aria-disabled="true"],
.stepper__btn[disabled] {
  opacity: .5;
  filter: grayscale(1);
  border-style: dashed;
  cursor: not-allowed;
  pointer-events: none;
}

/* Minimum 44 x 44 tap area around controls whose visible shape is smaller.
   The overlay is a pseudo-element of the control itself, so a tap on it is a
   tap on the control; centring is direction-neutral, so no RTL fork needed. */
.tap, .chip, .iconbtn, .btn--sm, .btn--link, .stepper__btn, .card__add {
  position: relative;
}
.tap::after, .chip::after, .iconbtn::after, .btn--sm::after, .btn--link::after, .stepper__btn::after, .card__add::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%); width: 100%; height: 100%;
  min-width: 44px; min-height: 44px; z-index: 1;
}

/* 6 — Product grid, cards, stepper, badges ================================= */

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s-3);
  padding-inline: var(--s-4);
}

.card {
  display: flex; flex-direction: column; gap: var(--s-2);
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: var(--r-md); padding: var(--s-2); text-align: start;
  cursor: pointer; color: inherit;
}
.card__img {
  aspect-ratio: 1 / 1; width: 100%; background: var(--c-surface-2);
  border-radius: var(--r-sm); object-fit: cover; display: flex;
  align-items: center; justify-content: center; font-size: 32px;
  color: var(--c-border-strong); overflow: hidden;
}
.card__name {
  font-size: var(--t-small); line-height: 1.35; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: calc(var(--t-small) * 1.35 * 2);
}
.card__price { font-size: var(--t-small); font-weight: 700; }
.card__action {
  position: relative; z-index: 1; min-height: 40px; display: flex;
  align-items: center; margin-block-start: auto;
}
.card__add {
  width: 100%; min-height: 40px; border: 1px solid var(--c-ink);
  border-radius: var(--r-sm); background: var(--c-surface);
  font-size: var(--t-small); font-weight: 700; cursor: pointer;
}
.card__add:hover { background: var(--c-surface-2); }
/* Dimmed photo of an out-of-stock product: on a card the state lives on the
   card, on G-02 there is no card, so the box carries the modifier itself. */
.card--out .card__img,
.card__img--dim { opacity: .5; }
/* The photo inside a placeholder box. The box is the grey placeholder and
   stays visible on its own; views-shop.js removes the <img> when it fails to
   load, so nothing else has to change. Shared with the 56px line thumbnail. */
.card__img > img,
.line__media > img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
/* G-02 shows the same box at the 4:3 of the detail screen (G-02 §5.2). */
.card__img--wide { aspect-ratio: 4 / 3; }

/* Stepper: two 40x40 controls with the quantity between them. */
.stepper {
  display: grid; grid-template-columns: 40px 1fr 40px; align-items: center;
  width: 100%; min-height: 40px; border: 1px solid var(--c-border-strong);
  border-radius: var(--r-sm); overflow: visible;
}
.stepper__btn {
  width: 40px; height: 40px; display: inline-flex; align-items: center;
  justify-content: center; font-size: var(--t-lg); font-weight: 700;
  line-height: 1; background: none; border: 0; cursor: pointer;
}
.stepper__qty {
  text-align: center;
  font-size: var(--t-small);
  font-weight: 700;
  direction: ltr;
  unicode-bidi: isolate;
}
.stepper__note {
  font-size: var(--t-mini);
  color: var(--c-ink-2);
  text-align: center;
  margin-block-start: var(--s-1);
}

/* Badges: state on a card or a list row, carried by text plus border. */
.badge {
  display: inline-flex; align-items: center; min-height: 24px;
  padding-inline: var(--s-2); font-size: var(--t-mini); font-weight: 600;
  border: 1px solid var(--c-border-strong); border-radius: var(--r-sm);
  background: var(--c-surface-2); color: var(--c-ink-2);
}
.badge--out    { border-style: dashed; color: var(--c-ink); }
.badge--status { background: var(--c-ink); border-color: var(--c-ink); color: #fff; }
.badge--block  { display: flex; width: 100%; min-height: 40px; justify-content: center; font-size: var(--t-small); }

/* 7 — Bottom bars ========================================================== */

/* Both bars are pinned to the bottom of the phone column, not the viewport
   edge, so they stay under the app on a desktop screen. Centring with
   left/translate is direction-neutral. */
.cartbar, .actionbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: var(--app-w); z-index: 40;
  background: var(--c-surface); border-block-start: 1px solid var(--c-border);
  padding: var(--s-2) var(--s-3) calc(var(--s-2) + var(--safe-b));
  box-shadow: 0 -1px 2px rgba(0, 0, 0, .05);
}

.cartbar__btn {
  width: 100%; min-height: 48px; display: grid;
  grid-template-columns: auto 1fr auto; align-items: center; gap: var(--s-3);
  padding-inline: var(--s-4); background: var(--c-ink); color: #ffffff;
  border: 0; border-radius: var(--r-md); cursor: pointer; text-align: start;
}
.cartbar__count { font-size: var(--t-small); }
.cartbar__label { font-size: var(--t-body); font-weight: 700; text-align: center; }
.cartbar__total { font-size: var(--t-body); font-weight: 700; }

.actionbar__row { display: flex; flex-direction: column; gap: var(--s-2); }
.actionbar .btn { width: 100%; }

/* 8 — Lines, summaries, totals ============================================= */

/* One row of an order or cart: quantity, name, price. */
.line {
  display: grid; grid-template-columns: auto 1fr auto; align-items: start;
  gap: var(--s-3); padding-block: var(--s-3);
  border-block-end: 1px solid var(--c-border); font-size: var(--t-small);
}
.line:last-child { border-block-end: 0; }
.line__qty { min-width: 32px; font-weight: 700; direction: ltr; unicode-bidi: isolate; text-align: start; }
.line__name { line-height: 1.4; }
.line__sub  { display: block; font-size: var(--t-mini); color: var(--c-ink-2); }
.line__price { font-weight: 700; white-space: nowrap; }
.line__media {
  width: 56px;
  height: 56px;
  border-radius: var(--r-sm);
  background: var(--c-surface-2);
  flex: 0 0 auto;
  /* Centres the generic glyph and clips a photo to the rounded corners. */
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
/* A row that is one run of text rather than quantity | name | price, but
   still one row of a list with its separator (M-04 C03). */
.line--plain { display: block; }
.line--out .line__name { color: var(--c-ink-2); }
.line--out .line__media { opacity: .5; }

.panel {
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: var(--s-4);
  margin: var(--s-4);
}
.panel__title { font-size: var(--t-body); font-weight: 700; margin-block-end: var(--s-2); }

.total {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s-3); padding-block-start: var(--s-3);
  margin-block-start: var(--s-2);
  border-block-start: 1px solid var(--c-border-strong);
}
.total__label { font-size: var(--t-body); font-weight: 700; }
.total__value { font-size: var(--t-lg); font-weight: 700; }

/* 9 — Forms, errors, notices =============================================== */

.field { display: block; padding: var(--s-4) var(--s-4) 0; }
.field__label { display: block; font-size: var(--t-small); font-weight: 700; margin-block-end: var(--s-2); }
.field__input, .field__area {
  width: 100%; min-height: 56px; padding: var(--s-3) var(--s-4);
  font-size: var(--t-body); background: var(--c-surface); color: var(--c-ink);
  border: 1px solid var(--c-border-strong); border-radius: var(--r-md);
  transition: border-color .15s ease;
}
.field__input:focus,
.field__area:focus { border-color: var(--c-accent); }
.field__input--big { font-size: 24px; font-weight: 700; direction: ltr; unicode-bidi: isolate; text-align: start; }
.field__area { min-height: 96px; resize: vertical; line-height: 1.5; }
.field__hint,
.field__counter { font-size: var(--t-small); color: var(--c-ink-2); margin-block-start: var(--s-1); }
.field__counter { font-size: var(--t-mini); direction: ltr; unicode-bidi: isolate; text-align: end; }
/* A helper line between a field's label and the field itself (G-04-C16). */
.field__hint--above { margin-block: 0 var(--s-2); }
.field__counter--full { font-weight: 700; color: var(--c-ink); }

/* A field with a static suffix inside it (the currency label on F03). */
.field__wrap { position: relative; display: block; }
.field__suffix {
  position: absolute; inset-block: 0; inset-inline-end: var(--s-4);
  display: flex; align-items: center; font-size: var(--t-small);
  color: var(--c-ink-2); pointer-events: none;
}
.field__wrap:has(.field__suffix) .field__input { padding-inline-end: 72px; }

/* Error state: a heavier border AND an icon AND the message. Never colour
   alone — the screen must still read in grayscale. */
.field--error .field__input,
.field--error .field__area {
  border-width: 2px;
  border-color: var(--c-danger);
  background: var(--c-danger-soft);
}
.error, .notice {
  display: flex; align-items: flex-start; gap: var(--s-2);
  font-size: var(--t-small); line-height: 1.45;
  margin-block-start: var(--s-2);
}
.error { color: var(--c-danger); }
.notice {
  color: var(--c-ink);
  background: var(--c-surface-2);
  border: 1px solid var(--c-border-strong);
  border-radius: var(--r-md);
  padding: var(--s-3);
}
.notice--flat { background: none; border: 0; padding: 0; }
/* The shared "!" icon slot. */
.error::before, .notice::before {
  content: "!"; flex: 0 0 auto; width: 20px; height: 20px;
  margin-block-start: 1px; display: inline-flex; align-items: center;
  justify-content: center; font-size: var(--t-mini); font-weight: 700;
  line-height: 1; border: 2px solid currentColor; border-radius: 50%;
}

/* Radio-style choice rows (payment method): 72px tall, selection shown by a
   2px border and a filled mark, not by colour. */
.choice {
  display: flex; align-items: center; gap: var(--s-3); width: 100%;
  min-height: 72px; padding: var(--s-3) var(--s-4); text-align: start;
  background: var(--c-surface); border: 1px solid var(--c-border-strong);
  border-radius: var(--r-md); cursor: pointer; color: inherit;
}
.choice + .choice { margin-block-start: var(--s-2); }
.choice__mark { flex: 0 0 auto; width: 22px; height: 22px; border: 2px solid var(--c-ink); border-radius: 50%; }
.choice__label { font-size: var(--t-body); font-weight: 700; }
.choice__sub   { display: block; font-size: var(--t-small); font-weight: 400; color: var(--c-ink-2); }

.s-soundline { font-size: var(--t-small); margin-block-start: var(--s-2); }
.s-pin-label { display: block; font-size: var(--t-body); font-weight: 700; margin-block: var(--s-6) var(--s-2); cursor: pointer; }
.s-pin {

<script>
/* shared/hotel-db.js */
/* shared/hotel-db.js — window.HotelDB, the hotel's one memory.

   admin app (admin/) are static pages that share the browser's localStorage.

                             products:[{id,nameAr,nameEn,descAr,descEn,price,
                                        category,inStock,qty,removed}] }

                           order a product only when inStock (the manager's
                           switch) is on AND qty > 0 (HotelDB.sellable).
                           Deducted when an order is created, returned in full
                           when that order is cancelled, by anyone.
     roomstore.settings    { hotelNameAr, hotelNameEn, currencyAr, currencyEn,
                             timeZone, roomFormat }

                               notes, payment ('card'|'cash'), amount (null|string),
                               total, status, createdAt (ms), fingerprint }

                             cancelledFrom    last forward status reached before

                             cancelledByGuest true only when the guest cancelled
                             cancelReasonAr   staff's reason, Arabic  ('' if none)
                             cancelReasonEn   staff's reason, English ('' if none)
                             cancelledBy      staffId, or 'guest'
                             cancelledAt      ms

  /* ------------------------------------------------------------------ *
   * roomFormat — the room-number rule the manager sets (A-07 / AM-04).

   *     maxLen:       5,      // integer >= minLen, <= 12 — most characters
   *     allowLetters: false,  // true: Latin letters A–Z / a–z allowed too

   *   }                       //    doubled ("12-B" yes; "-12", "12--B" no).

   * Digits are always allowed. Arabic-Indic digits are converted to 0–9 by
   * the guest's field before the rule sees them (G-04 §7.1).

   * DEFAULT = { minLen:1, maxLen:5, allowLetters:false, separator:'' }:

   * ------------------------------------------------------------------ */

      hotelNameEn: D.hotelNameEn || 'Al Waha Hotel',
      currencyAr: 'ر.س',
      currencyEn: 'SAR',
      timeZone: 'Asia/Riyadh',

  }

  /* Units given to a product that has no quantity yet: every seeded product,

  var DEFAULT_QTY = 20;
  var MAX_QTY = 9999;

  function normaliseQty(p) {
    var n = Math.floor(Number(p.qty));
    if (p.qty == null || p.qty === '' || !isFinite(n)) n = p.inStock !== false ? DEFAULT_QTY : 0;
    p.qty = Math.max(0, Math.min(MAX_QTY, n));

  }

  /* One synchronous read-change-write of the catalog's quantities.

  function moveStock(lines, sign) {
    var c = read(K.catalog);
    if (!c || !c.products) return false;
    var byId = {};
    c.products.forEach(function (p) { normaliseQty(p); byId[p.id] = p; });

  }

  function seedCatalog() {
    var D = window.Data;
    if (!D || !D.products) return null;          // nothing to seed from yet

      categories: (D.categories || []).map(function (c, i) {
        return { id: c.id, nameAr: c.nameAr, nameEn: c.nameEn, order: i };
      }),
      products: D.products.map(function (p) {
        return {
          id: p.id, nameAr: p.nameAr, nameEn: p.nameEn,
          descAr: p.descAr || '', descEn: p.descEn || '',

          qty: p.qty != null ? p.qty : (p.inStock !== false ? DEFAULT_QTY : 0)

  /* Two roles (docs/operations.html, "التوزيع على العمّال"):

                    accepts it and assigns it to a worker in one action.
       worker     — a delivery worker's own phone (worker/): sees only the
                    orders assigned to them, walks them to the room, takes
                    payment.
     session       the desk tablet's signed-in supervisor
     workerSession the worker phone's signed-in worker (a separate device, so
                   a separate session; one per browser in this prototype)
     shift         { memberId: sinceMs } — workers currently signed in, the
                   list the supervisor assigns from */
  var SEED_MEMBERS = [
    { id: 's-sara',   name: 'سارة / Sara',   pin: '1111', role: 'supervisor' },
    { id: 's-khalid', name: 'خالد / Khalid', pin: '2222', role: 'worker' },
    { id: 's-ahmed',  name: 'أحمد / Ahmed',  pin: '3333', role: 'worker' }
  ];

  function seedStaff() {
    return { members: clone(SEED_MEMBERS), session: null, workerSession: null, shift: {} };
  }

  /* A staff record saved before roles existed gets the seeded roles and the
     third member; everything else in it is kept. */
  function normaliseStaff(s) {
    if (!s) return seedStaff();
    var members = s.members || [];
    if (members.some(function (m) { return !m.role; })) members = clone(SEED_MEMBERS);
    s.members = members;
    if (!s.shift || typeof s.shift !== 'object') s.shift = {};
    if (s.workerSession === undefined) s.workerSession = null;
    if (s.session === undefined) s.session = null;
    return s;
  }

  function memberById(id) {
    var list = normaliseStaff(read(K.staff)).members;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function seedAdmin() {
    return {
      email: 'manager@alwaha.example',
      passwordHash: hashPassword('alwaha2026'),
      session: null
    };
  }

  /* ------------------------------------------------------------------ *
   * Storage helpers
   * ------------------------------------------------------------------ */

  function clone(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }

  function read(key) {
    try {
      var raw = localStorage.getItem(key);
      if (raw == null) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { return false; }
    notify(key, 'local');
    return true;
  }

  function ensure(key, seedFn) {
    var v = read(key);
    if (v != null) return v;
    v = seedFn();
    if (v != null) {
      try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
    }
    return v;
  }

  /* Not security — a demo prototype has no secrets (CONTRACT). FNV-1a, hex. */
  function hashPassword(s) {
    var h = 0x811c9dc5;
    s = String(s == null ? '' : s);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;

   * Change notification
   * ------------------------------------------------------------------ */

  var listeners = [];

  function notify(key, source) {
    var list = listeners.slice();
    for (var i = 0; i < list.length; i++) {
      try { list[i]({ key: key, source: source }); } catch (e) {}
    }
  }

  function isOwnedKey(key) {
    if (key == null) return true;                 // localStorage.clear()
    for (var k in K) if (K[k] === key) return true;
    return false;
  }

    window.addEventListener('storage', function (e) {
      if (e.storageArea && e.storageArea !== window.localStorage) return;
      if (!isOwnedKey(e.key)) return;
      notify(e.key, 'remote');
    });

  /* ------------------------------------------------------------------ *
   * Order table (shape owned by store.js — { byKey, byNo, nextNo })
   * ------------------------------------------------------------------ */

  function readTable() {
    var raw = read(K.orders);
    if (raw && raw.byKey) {
      return { byKey: raw.byKey, byNo: raw.byNo || {}, nextNo: raw.nextNo || FIRST_ORDER_NO };
    }
    return { byKey: {}, byNo: {}, nextNo: FIRST_ORDER_NO };
  }

  function writeTable(t) {
    return write(K.orders, { byKey: t.byKey, byNo: t.byNo, nextNo: t.nextNo });
  }

  function findIn(t, orderNo) {
    var key = t.byNo[String(orderNo)];
    return key ? t.byKey[key] || null : null;
  }

  function newestFirst(a, b) {
    if (b.createdAt !== a.createdAt) return (b.createdAt || 0) - (a.createdAt || 0);
    return Number(b.orderNo) - Number(a.orderNo);
  }

  function nextStatus(status) {
    var i = FORWARD.indexOf(status);
    return (i === -1 || i >= FORWARD.length - 1) ? null : FORWARD[i + 1];
  }

  function isFinal(status) { return status === 'Delivered' || status === 'Cancelled'; }

  /* Every staff/hotel change goes through here: reload, change one record,
     write back — in one synchronous step so no other code runs in between. */
  function changeOrder(orderNo, mutate) {
    var t = readTable();
    var order = findIn(t, orderNo);
    if (!order) return { ok: false, error: 'notFound', order: null };
    var err = mutate(order);
    if (err) return { ok: false, error: err, order: clone(order) };
    writeTable(t);
    return { ok: true, error: null, order: clone(order) };
  }

  function logRow(order, status, meta) {
    var at = (meta && meta.at) || Date.now();
    if (!order.log) order.log = [];
    order.log.push({ status: status, at: at, staffId: (meta && meta.staffId) || null });

  }

  /* ------------------------------------------------------------------ *
   * roomRule
   * ------------------------------------------------------------------ */

  function normaliseRoomFormat(f) {
    f = f || {};
    var d = DEFAULT_ROOM_FORMAT;
    var min = Math.floor(Number(f.minLen));
    var max = Math.floor(Number(f.maxLen));
    if (!(min >= 1 && min <= ROOM_LEN_CAP)) min = d.minLen;
    if (!(max >= 1 && max <= ROOM_LEN_CAP)) max = d.maxLen;
    if (max < min) max = min;
    return {
      minLen: min,
      maxLen: max,
      allowLetters: f.allowLetters === true,
      separator: SEPARATORS.indexOf(f.separator) !== -1 ? f.separator : '',
      requireDigit: f.requireDigit !== false

  }

  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\\/-]/g, '\\$&'); }

     `pattern` tests the CHARACTERS only (which characters, and where the
     separator may sit); length is checked separately against minLen/maxLen,
     so the guest keeps G-04 §7.1's priority order: empty → wrong characters
     → too long (→ too short, only reachable when minLen > 1).
     `isDefault` is true when the rule is exactly the default, in which case
     the guest shows its own three reviewed messages (G-04 §7.1) unchanged.
     `messages` are for a NON-default rule only — PROVISIONAL copy until the
     admin spec (A-07 / AM-04) rules it. */
  function roomRule(format) {
    var f;
    if (format) {
      f = normaliseRoomFormat(format);
    } else {
      var s = settings();
      f = normaliseRoomFormat(s && s.roomFormat);
    }
    var cls = f.allowLetters ? '0-9A-Za-z' : '0-9';
    var sep = f.separator ? escapeRe(f.separator) : '';
    var pattern = sep

      : new RegExp('^[' + cls + ']+$');

                    f.maxLen === DEFAULT_ROOM_FORMAT.maxLen &&
                    !f.allowLetters && !f.separator;

    var rangeAr = f.minLen === f.maxLen ? String(f.maxLen) : 'من ' + f.minLen + ' إلى ' + f.maxLen;
    var rangeEn = f.minLen === f.maxLen ? String(f.maxLen) : f.minLen + ' to ' + f.maxLen;
    var whatAr = f.allowLetters ? 'أرقام وحروف إنجليزية' : 'أرقام';
    var whatEn = f.allowLetters ? 'digits and letters A–Z' : 'digits';
    var sepAr = f.separator ? '، ويمكن استخدام «' + f.separator + '» بينها' : '';
    var sepEn = f.separator ? ', "' + f.separator + '" allowed between them' : '';

    return {
      pattern: pattern,
      minLen: f.minLen,
      maxLen: f.maxLen,
      allowLetters: f.allowLetters,
      separator: f.separator,
      requireDigit: f.requireDigit,
      isDefault: isDefault,
      /* One acceptance test for everyone. The guest's G-04 and admin's AM-04
         both call this, so the live test can never pass a value the guest
         would then refuse. Returns '' when valid, else 'empty' | 'chars' |
         'long' | 'short' | 'nodigit'. */

        if (!v) return 'empty';
        if (!pattern.test(v)) return 'chars';
        if (v.length > f.maxLen) return 'long';
        if (v.length < f.minLen) return 'short';
        if (f.requireDigit && !/[0-9]/.test(v)) return 'nodigit';
        return '';
      },
      label: {
        ar: whatAr + ' فقط، ' + rangeAr + ' خانات' + sepAr,
        en: whatEn + ' only, ' + rangeEn + ' characters' + sepEn
      },
      messages: {
        chars: { ar: 'استخدم ' + whatAr + ' فقط' + sepAr,
                 en: 'Use ' + whatEn + ' only' + sepEn },
        long:  { ar: 'رقم الغرفة طويل جدًا: ' + f.maxLen + ' خانات كحد أقصى',
                 en: 'Room number is too long: ' + f.maxLen + ' characters at most' },
        short: { ar: 'رقم الغرفة قصير جدًا: ' + f.minLen + ' خانات على الأقل',

        nodigit: { ar: 'رقم الغرفة يجب أن يحتوي على رقم واحد على الأقل',
                   en: 'The room number must contain at least one digit' }
      }
    };
  }

   * Public API
   * ------------------------------------------------------------------ */

  function catalog() {
    var c = read(K.catalog);

    var cats = (c.categories || []).slice().sort(function (a, b) {
      return (a.order || 0) - (b.order || 0);

    return { categories: clone(cats), products: clone(c.products || []).map(normaliseQty) };
  }

    return clone(ensure(K.settings, seedSettings));
  }

    STATUSES: STATUSES.slice(),
    FORWARD: FORWARD.slice(),
    DEFAULT_ROOM_FORMAT: clone(DEFAULT_ROOM_FORMAT),

    /* ---- catalog ---- */
    catalog: catalog,
    MAX_QTY: MAX_QTY,
    sellable: sellable,

    /* Called by the guest's Server.submitOrder before it creates an order.
       All-or-nothing: when any line asks for more units than are sellable,
       nothing is deducted and { ok:false, ids:[productId…] } names the short
       lines, so the order is rejected as out of stock (M-04). */

      var c = catalog(), byId = {}, short = [];
      c.products.forEach(function (p) { byId[p.id] = p; });
      (lines || []).forEach(function (l) {
        var p = byId[l.productId];
        if (!sellable(p) || p.qty < (Number(l.qty) || 0)) short.push(l.productId);
      });
      if (short.length) return { ok: false, ids: short };
      return { ok: moveStock(lines, -1), ids: [] };
    },

    /* Puts a cancelled order's units back on the shelf. */
    returnStock: function (lines) { return moveStock(lines, +1); },
    saveCatalog: function (c) {
      return write(K.catalog, {
        categories: (c && c.categories) || [],
        products: (c && c.products) || []
      });
    },

    /* ---- settings ---- */
    settings: settings,
    saveSettings: function (s) {
      var cur = settings() || seedSettings();
      for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) cur[k] = s[k];
      cur.roomFormat = normaliseRoomFormat(cur.roomFormat);
      return write(K.settings, cur);
    },
    roomRule: roomRule,

    /* ---- orders ---- */
    orders: function () {
      var t = readTable(), out = [];
      for (var key in t.byKey) {
        if (Object.prototype.hasOwnProperty.call(t.byKey, key) && t.byKey[key]) out.push(t.byKey[key]);
      }
      out.sort(newestFirst);
      return clone(out);
    },

    getOrder: function (orderNo) {
      return clone(findIn(readTable(), orderNo));
    },

    nextStatus: nextStatus,

    /* Moves an order ONE step forward (New → Accepted → OnTheWay → Delivered),
       or cancels it when status is 'Cancelled' (delegates to cancel() with no
       reason). meta = { staffId, at }.
       Returns { ok, error, order }; error is one of
         'notFound'  — no such order
         'stale'     — the order is no longer at the step before `status`

                       fresh order is returned so the caller can redraw
         'invalid'   — not a canonical status */
    setStatus: function (orderNo, status, meta) {
      if (status === 'Cancelled') {
        return HotelDB.cancel(orderNo, '', '', meta && meta.staffId, meta && meta.at);
      }
      if (FORWARD.indexOf(status) < 1) return { ok: false, error: 'invalid', order: HotelDB.getOrder(orderNo) };
      return changeOrder(orderNo, function (order) {
        if (nextStatus(order.status) !== status) return 'stale';
        order.status = status;
        logRow(order, status, meta);
        return null;
      });
    },

    /* A hotel/staff cancellation, allowed from any non-final status.
       cancelledByGuest stays false, so the guest's G-06 reads "The hotel
       cancelled this order" (with the reason when one is given).
       Returns { ok, error, order }; error 'notFound' or 'stale' (already
       Delivered or Cancelled). */
    cancel: function (orderNo, reasonAr, reasonEn, staffId, at) {
      var meta = { staffId: staffId || null, at: at || Date.now() };
      var res = changeOrder(orderNo, function (order) {
        if (isFinal(order.status)) return 'stale';
        order.cancelledFrom = order.status;
        order.cancelledByGuest = false;
        order.cancelReasonAr = String(reasonAr == null ? '' : reasonAr).trim();
        order.cancelReasonEn = String(reasonEn == null ? '' : reasonEn).trim();
        order.cancelledBy = meta.staffId;
        order.cancelledAt = meta.at;
        order.status = 'Cancelled';
        logRow(order, 'Cancelled', meta);
        return null;
      });
      if (res.ok) HotelDB.returnStock(res.order.lines);
      return res;
    },

    /* ---- staff and admin records (CONTRACT key table) ---- */
    staff: function () { return clone(normaliseStaff(ensure(K.staff, seedStaff))); },

    /* ---- assignment (docs/operations.html, "التوزيع على العمّال") ---- */

    /* Every worker, with whether they are signed in on a worker phone now. */
    workers: function () {
      var s = normaliseStaff(read(K.staff));
      return s.members.filter(function (m) { return m.role === 'worker'; }).map(function (m) {
        var since = s.shift[m.id];
        return { id: m.id, name: m.name, onShift: !!since, since: since || null };
      });
    },
    member: function (id) { return clone(memberById(id)); },

    startShift: function (memberId) {
      var s = normaliseStaff(read(K.staff));
      s.shift[memberId] = Date.now();
      return write(K.staff, s);
    },
    endShift: function (memberId) {
      var s = normaliseStaff(read(K.staff));
      delete s.shift[memberId];
      return write(K.staff, s);
    },

    /* Accept and assign are ONE action: there is no accepted order without a
       worker responsible for it. New → Accepted, and assignedTo is set.
       meta = { staffId (the supervisor), at }.
       Returns { ok, error, order }; error 'notFound' | 'stale' (no longer
       New — the guest cancelled first, or another tab accepted) | 'invalid'
       (no such member). */
    acceptAndAssign: function (orderNo, workerId, meta) {
      if (!memberById(workerId)) return { ok: false, error: 'invalid', order: HotelDB.getOrder(orderNo) };
      var at = (meta && meta.at) || Date.now();
      return changeOrder(orderNo, function (order) {
        if (order.status !== 'New') return 'stale';
        order.status = 'Accepted';
        order.acceptedBy = (meta && meta.staffId) || null;
        order.assignedTo = workerId;
        if (!order.assignLog) order.assignLog = [];
        order.assignLog.push({ from: null, to: workerId, at: at, by: order.acceptedBy });
        logRow(order, 'Accepted', { staffId: order.acceptedBy, at: at });
        return null;
      });
    },

    /* Moves an Accepted or OnTheWay order to another worker (or assigns one
       to an order that was accepted without one). The order leaves the first
       worker's phone and appears on the second's at once. */
    assign: function (orderNo, workerId, meta) {
      if (!memberById(workerId)) return { ok: false, error: 'invalid', order: HotelDB.getOrder(orderNo) };
      var at = (meta && meta.at) || Date.now();
      return changeOrder(orderNo, function (order) {
        if (order.status !== 'Accepted' && order.status !== 'OnTheWay') return 'stale';
        if (order.assignedTo === workerId) return null;
        if (!order.assignLog) order.assignLog = [];
        order.assignLog.push({ from: order.assignedTo || null, to: workerId, at: at, by: (meta && meta.staffId) || null });
        order.assignedTo = workerId;
        order.updatedAt = at;
        return null;
      });
    },
    saveStaff: function (s) { return write(K.staff, s); },
    admin: function () { return clone(ensure(K.admin, seedAdmin)); },
    saveAdmin: function (a) { return write(K.admin, a); },
    hashPassword: hashPassword,

    /* fn({ key, source: 'local' | 'remote' }). Returns an unsubscribe fn. */
    onChange: function (fn) {
      if (typeof fn !== 'function') return function () {};
      listeners.push(fn);
      return function () {
        var i = listeners.indexOf(fn);
        if (i !== -1) listeners.splice(i, 1);
      };
    },

    /* ---- for app/js/store.js's fake server only ----
       The guest's Server creates orders and records guest cancellations with
       the client-order-key contract (G-04 §7.7), which lives in store.js.
       It reads and writes the raw table through these two, so the key and
       the shape stay owned here. Always a fresh read. */
    _readTable: function () { return readTable(); },
    _writeTable: function (t) { return writeTable(t); }
  };

  /* First run: seed what is missing, never overwrite what exists. */
  ensure(K.settings, seedSettings);
  ensure(K.catalog, seedCatalog);
  ensure(K.staff, seedStaff);
  ensure(K.admin, seedAdmin);

  window.HotelDB = HotelDB;
})();

</script>
<script>
/* app/js/i18n.js */
/* i18n — Arabic is the default on first open regardless of browser language,
   and the choice is saved on the device. Locked decision 7; map §4 decision 12. */
(function () {
  'use strict';

  var DICT = {};
  var LANG_KEY = 'roomstore.lang';

  function savedLang() {
    try { return localStorage.getItem(LANG_KEY); } catch (e) { return null; }
  }

  var I18N = {
    lang: savedLang() === 'en' ? 'en' : 'ar',

    register: function (entries) {
      for (var key in entries) {
        if (Object.prototype.hasOwnProperty.call(entries, key)) DICT[key] = entries[key];
      }
    },

    setLang: function (lang) {
      I18N.lang = lang === 'en' ? 'en' : 'ar';
      try { localStorage.setItem(LANG_KEY, I18N.lang); } catch (e) {}
      document.documentElement.lang = I18N.lang;
      document.documentElement.dir = I18N.lang === 'ar' ? 'rtl' : 'ltr';
      if (window.App && App.rerender) App.rerender();
    },

    other: function () { return I18N.lang === 'ar' ? 'en' : 'ar'; },

    /* The label of the OTHER language, written in that language, never a flag.
       G-01 §4 B01. */
    otherLabel: function () { return I18N.lang === 'ar' ? 'English' : 'العربية'; },

    apply: function () {
      document.documentElement.lang = I18N.lang;
      document.documentElement.dir = I18N.lang === 'ar' ? 'rtl' : 'ltr';
    }
  };

  function t(key, vars) {
    var entry = DICT[key];
    if (!entry) return key;                    // missing string is visible, not silent
    var s = entry[I18N.lang] != null ? entry[I18N.lang] : entry.ar;
    if (vars) {
      s = s.replace(/\{(\w+)\}/g, function (m, name) {
        return vars[name] != null ? vars[name] : m;
      });
    }
    return s;
  }

  /* Money. Currency after the amount in Arabic, before it in English,
     always two decimals, half up. Western digits in both. G-01 §7.2. */
  function money(value) {
    var n = Math.round((Number(value) + Number.EPSILON) * 100) / 100;
    var s = n.toFixed(2);
    /* The label comes from the hotel's settings (admin A-07), so a manager
       who changes it reaches the guest and staff apps too. Falls back to
       ر.س / SAR, the values every approved screen was written against. */
    var cur = null;
    try { cur = window.HotelDB ? HotelDB.settings() : null; } catch (e) { cur = null; }
    var ar = (cur && cur.currencyAr) || 'ر.س';
    var en = (cur && cur.currencyEn) || 'SAR';
    return I18N.lang === 'ar' ? s + ' ' + ar : en + ' ' + s;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  window.I18N = I18N;
  window.t = t;
  window.money = money;
  window.esc = esc;
  window.Views = {};
  window.Modals = {};
})();

</script>
<script>
/* worker/js/core.js */
/* worker/js/core.js — shared pieces of the delivery worker's phone (المندوب).
   Design: docs/operations.html ("الأدوار", "رحلة الطلب", "التوزيع على العمّال",
   "الدفع عند الباب") and the split design note (roles, workerSession, rules 1–9).
   Data: window.HotelDB only (shared/CONTRACT.md). Plain ES5, no libraries.

   Why these helpers are copied from staff/js/core.js instead of including it:
   the desk file keeps the desk's `session` (this app must use `workerSession`
   and never touch `session`), shares the desk's device keys
   (roomstore.staffapp.lang/sound/auth — one browser runs both apps in the
   demo, so the two phones would switch language together), and accepts any
   member's PIN. Everything here is worker-only and keyed
   roomstore.workerapp.*.

   Holds: shared strings, formatting, the worker "server" (HotelDB behind
   promises, with the demo's no-connection switch), the worker session and
   shift, the chime, and the Feed — the one list of "my orders" every screen
   reads, which also decides the chime and the gone-order notices. */
(function () {
  'use strict';

  I18N.register({
    /* The five canonical labels, G-01 §5.2 — the same words everywhere. */
    'w.status.New':       { ar: 'جديد', en: 'New' },
    'w.status.Accepted':  { ar: 'تم القبول وجارٍ التحضير', en: 'Accepted & preparing' },
    'w.status.OnTheWay':  { ar: 'في الطريق', en: 'On the way' },
    'w.status.Delivered': { ar: 'تم التوصيل', en: 'Delivered' },
    'w.status.Cancelled': { ar: 'ملغى', en: 'Cancelled' },

    /* Item count, G-01 §7.3 (same buckets as the desk). */
    'w.count.1':    { ar: 'منتج واحد', en: '1 item' },
    'w.count.2':    { ar: 'منتجان', en: '2 items' },
    'w.count.few':  { ar: '{n} منتجات', en: '{n} items' },
    'w.count.many': { ar: '{n} منتجًا', en: '{n} items' },

    /* Durations, S-01 §7.2 — "… ago". */
    'w.dur.lt1':  { ar: 'منذ أقل من دقيقة', en: 'less than a minute ago' },
    'w.dur.1':    { ar: 'منذ دقيقة', en: '1 min ago' },
    'w.dur.2':    { ar: 'منذ دقيقتين', en: '2 min ago' },
    'w.dur.few':  { ar: 'منذ {n} دقائق', en: '{n} min ago' },
    'w.dur.many': { ar: 'منذ {n} دقيقة', en: '{n} min ago' },
    'w.dur.h':    { ar: 'منذ {h} و{m} دقيقة', en: '{h} h {m} min ago' },
    'w.hour.1':    { ar: 'ساعة', en: '1' },
    'w.hour.2':    { ar: 'ساعتين', en: '2' },
    'w.hour.few':  { ar: '{n} ساعات', en: '{n}' },
    'w.hour.many': { ar: '{n} ساعة', en: '{n}' },

    /* Payment method words. */
    'w.pay.card': { ar: 'بطاقة', en: 'Card' },
    'w.pay.cash': { ar: 'نقدًا', en: 'Cash' },

    /* Shared copy */
    'w.room':       { ar: 'غرفة', en: 'Room' },
    'w.orderno':    { ar: 'طلب رقم {no}', en: 'Order {no}' },
    'w.sending':    { ar: 'جارٍ الإرسال…', en: 'Sending…' },
    'w.back':       { ar: 'رجوع', en: 'Back' },
    'w.after':      { ar: 'الحالة بعد الضغط: {label}', en: 'Status after tapping: {label}' },
    'w.lang.other': { ar: 'English', en: 'العربية' },
    /* The action-failure sentence of S-02-C15 / WM-01-C07, word for word. */
    'w.actionfail': { ar: 'لم يصل التحديث إلى النظام — حاول مرة أخرى', en: 'The update did not reach the system — try again' },

    /* Gone-order notices (W-01-C05): why an order left this phone. */
    'w.gone.reassigned': { ar: 'تم تحويل هذا الطلب لعامل آخر', en: 'This order was reassigned to another worker' },
    'w.gone.cancelled':  { ar: 'ألغى المكتب هذا الطلب', en: 'The desk cancelled this order' },
    'w.gone.deskDelivered': { ar: 'سجّل المكتب توصيل هذا الطلب نيابةً عنك', en: 'The desk recorded this order as delivered for you' },
    'w.gone.notMine':    { ar: 'هذا الطلب ليس محوّلًا لك', en: 'This order is not assigned to you' },
    'w.gone.notFound':   { ar: 'لم نعثر على هذا الطلب', en: 'We could not find this order' },
    'w.gone.which':      { ar: 'طلب رقم {no} · غرفة {room}', en: 'Order {no} · Room {room}' },
    'w.gone.reason':     { ar: 'السبب: {reason}', en: 'Reason: {reason}' },
    'w.gone.dont':       { ar: 'لا تتوجّه به إلى الغرفة. إن كان معك فأعده إلى الرف.', en: 'Do not take it to the room. If you have it with you, return it to the shelf.' },

    /* Demo strip and demo PIN hint — NOT product copy. */
    'w.demo.tag':    { ar: 'وضع العرض · Demo', en: 'Demo · وضع العرض' },
    'w.demo.server': { ar: 'حالة النظام', en: 'System' },
    'w.demo.ok':     { ar: 'يعمل', en: 'working' },
    'w.demo.down':   { ar: 'لا اتصال', en: 'no connection' },
    'w.demo.reset':  { ar: 'تصفير جلسة المندوب', en: 'Reset worker session' },
    'w.demo.pins':   { ar: 'رموز تجريبية للعرض فقط:', en: 'Demo PINs, for the prototype only:' }
  });

  /* ------------------------------------------------------------------ *
   * Small utilities (same rules as the desk's core.js)
   * ------------------------------------------------------------------ */
  var MIN = 60 * 1000;

  function bucket(n) {
    if (n === 1) return '1';
    if (n === 2) return '2';
    if (n >= 3 && n <= 10) return 'few';
    return 'many';
  }

  function itemQty(order) {
    var n = 0, lines = (order && order.lines) || [];
    for (var i = 0; i < lines.length; i++) n += Number(lines[i].qty) || 0;
    return n;
  }

  function countWord(n) { return t('w.count.' + bucket(n), { n: n }); }

  function duration(ms) {
    var mins = Math.floor(Math.max(0, ms) / MIN);
    if (mins < 1) return t('w.dur.lt1');
    if (mins === 1) return t('w.dur.1');
    if (mins === 2) return t('w.dur.2');
    if (mins <= 10) return t('w.dur.few', { n: mins });
    if (mins <= 59) return t('w.dur.many', { n: mins });
    var h = Math.floor(mins / 60), m = mins % 60;
    return t('w.dur.h', { h: t('w.hour.' + bucket(h), { n: h }), m: m });
  }

  /* HH:MM, 24-hour, Western digits in both languages. */
  function clock(ms) {
    var d = new Date(ms);
    var hh = d.getHours(), mm = d.getMinutes();
    return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }

  function westernDigits(s) {
    return String(s == null ? '' : s).replace(/[٠-٩]/g, function (c) {
      return String(c.charCodeAt(0) - 0x0660);
    }).replace(/[۰-۹]/g, function (c) {
      return String(c.charCodeAt(0) - 0x06F0);
    });
  }

  function cents(v) { return Math.round((Number(v) + Number.EPSILON) * 100); }

  /* The four payment cases (S-01 §7.3, S-02 §5.5, SM-02 §5.3). */
  function payCase(order) {
    if (!order || order.payment !== 'cash') return { kind: 'card' };
    var raw = order.amount;
    if (raw == null || String(raw).replace(/\s/g, '') === '') return { kind: 'cashNone' };
    var amt = parseFloat(westernDigits(raw).replace(/,/g, '.'));
    if (!isFinite(amt)) return { kind: 'cashNone' };
    var a = cents(amt), tot = cents(order.total);
    if (a > tot) return { kind: 'cashMore', amount: a / 100, change: (a - tot) / 100 };
    if (a === tot) return { kind: 'cashEqual', amount: a / 100 };
    return { kind: 'cashNone' };
  }

  function hasNotes(order) {
    return !!(order && order.notes && String(order.notes).replace(/\s/g, '') !== '');
  }

  function lineName(line) {
    if (I18N.lang === 'en') return line.nameEn || line.nameAr || '';
    return line.nameAr || line.nameEn || '';
  }

  function spaced(s) { return String(s == null ? '' : s).split('').join(' '); }

  function isActive(s) { return s === 'Accepted' || s === 'OnTheWay'; }

  /* The most recent 04:00 local time — the hotel day (staff map §4 decision 9). */
  function hotelDayStart(now) {
    var d = new Date(now);
    d.setHours(4, 0, 0, 0);
    if (d.getTime() > now) d.setDate(d.getDate() - 1);
    return d.getTime();
  }

  /* When the order was last assigned to `me` (the latest assignLog row). */
  function assignedAt(order, me) {
    var log = (order && order.assignLog) || [];
    for (var i = log.length - 1; i >= 0; i--) if (log[i].to === me) return log[i].at || 0;
    return (order && (order.updatedAt || order.createdAt)) || 0;
  }

  /* The log row that wrote a status (the latest one). */
  function logFor(order, status) {
    var log = (order && order.log) || [];
    for (var i = log.length - 1; i >= 0; i--) if (log[i].status === status) return log[i];
    return null;
  }

  function wasEverMine(order, me) {
    var log = (order && order.assignLog) || [];
    for (var i = 0; i < log.length; i++) if (log[i].to === me) return true;
    return false;
  }

  /* Where an order stands for this worker:
       'active'        assigned to me, Accepted or On the way
       'deliveredByMe' Delivered, assigned to me, and I recorded it
       'deskDelivered' Delivered, assigned to me, the desk recorded it for me
       'cancelled'     cancelled (by the desk) while assigned to me
       'reassigned'    was mine, now assigned to someone else
       'notMine'       never assigned to me
       'notFound'      no such order */
  function classify(order, me) {
    if (!order) return 'notFound';
    if (order.assignedTo !== me) return wasEverMine(order, me) ? 'reassigned' : 'notMine';
    if (order.status === 'Cancelled') return 'cancelled';
    if (order.status === 'Delivered') {
      var row = logFor(order, 'Delivered');
      return row && row.staffId === me ? 'deliveredByMe' : 'deskDelivered';
    }
    if (isActive(order.status)) return 'active';
    return 'notMine';
  }

  /* The desk's cancellation reason in the interface language, else the other. */
  function storedReason(o) {
    var ar = String(o.cancelReasonAr || ''), en = String(o.cancelReasonEn || '');
    var r = I18N.lang === 'en' ? (en || ar) : (ar || en);
    return r.length > 120 ? r.slice(0, 120) + '…' : r;
  }

  /* ------------------------------------------------------------------ *
   * Device-held settings, under this app's own keys.
   * ------------------------------------------------------------------ */
  var LS = {
    lang: 'roomstore.workerapp.lang',
    auth: 'roomstore.workerapp.auth',
    demo: 'roomstore.workerapp.demo',
    seen: 'roomstore.workerapp.seen'
  };
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var Lang = {
    init: function () {
      I18N.lang = lsGet(LS.lang) === 'en' ? 'en' : 'ar';   /* Arabic on first open */
      I18N.apply();
    },
    toggle: function () {
      I18N.lang = I18N.lang === 'ar' ? 'en' : 'ar';
      lsSet(LS.lang, I18N.lang);
      I18N.apply();
      if (window.App && App.rerender) App.rerender();
    }
  };

  /* "Since the list was last seen" (W-01-C15): the moment this worker last
     left W-01 (opened an order, hid the page, ended the shift). */
  var Seen = {
    all: function () {
      try { return JSON.parse(lsGet(LS.seen) || '{}') || {}; } catch (e) { return {}; }
    },
    at: function (me) { return Number(Seen.all()[me]) || 0; },
    mark: function (me, at) {
      if (!me) return;
      var s = Seen.all();
      s[me] = at || Date.now();
      lsSet(LS.seen, JSON.stringify(s));
    }
  };

  /* ------------------------------------------------------------------ *
   * Chime — the desk's Web Audio chime, unchanged: two soft notes, 2 s.
   * A browser plays sound only after a touch or key press on the page;
   * typing the PIN on W-03 is that gesture.
   * ------------------------------------------------------------------ */
  var Chime = {
    ctx: null,
    armed: false,
    refused: false,
    plays: 0,          /* chimes actually scheduled (read by the demo test) */
    lastAt: 0,

    arm: function () {
      Chime.refused = false;
      try {
        if (!Chime.ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          Chime.ctx = new AC();
        }
        if (Chime.ctx.state === 'suspended' && Chime.ctx.resume) Chime.ctx.resume();
        Chime.armed = true;
      } catch (e) {}
    },

    ready: function () { return Chime.armed && !Chime.refused; },

    play: function () {
      if (!Chime.armed || !Chime.ctx) {
        Chime.refused = true;
        if (window.App && App.rerender) App.rerender();
        return false;
      }
      try {
        var ctx = Chime.ctx;
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
        var t0 = ctx.currentTime + 0.02;
        tone(ctx, 880, t0, 1.0);
        tone(ctx, 660, t0 + 0.5, 1.5);
        Chime.plays++;
        Chime.lastAt = Date.now();
        return true;
      } catch (e) {
        Chime.refused = true;
        if (window.App && App.rerender) App.rerender();
        return false;
      }
    }
  };

  function tone(ctx, freq, start, len) {
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + len);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + len + 0.05);
  }

  /* ------------------------------------------------------------------ *
   * Session: roomstore.staff.workerSession { memberId, since } and the
   * shift map. NEVER roomstore.staff.session — that is the desk tablet's.
   * A session is live only while its member is a worker AND is on shift,
   * so an end of shift from another tab signs this phone out too.
   * ------------------------------------------------------------------ */
  var Session = {
    current: function () {
      var s = HotelDB.staff();
      var ws = s && s.workerSession;
      if (!ws || !ws.memberId) return null;
      var m = HotelDB.member(ws.memberId);
      if (!m || m.role !== 'worker') return null;
      if (!s.shift || !s.shift[ws.memberId]) return null;
      return { memberId: ws.memberId, since: ws.since || 0, name: m.name };
    },
    me: function () { var c = Session.current(); return c ? c.memberId : null; },
    start: function (memberId) {
      HotelDB.startShift(memberId);
      var s = HotelDB.staff();                     /* fresh read: keeps the desk's session */
      s.workerSession = { memberId: memberId, since: Date.now() };
      HotelDB.saveStaff(s);
    },
    end: function () {
      var s = HotelDB.staff();
      var ws = s.workerSession;
      if (ws && ws.memberId) HotelDB.endShift(ws.memberId);
      s = HotelDB.staff();                         /* fresh read after endShift */
      s.workerSession = null;
      HotelDB.saveStaff(s);
    }
  };

  /* ------------------------------------------------------------------ *
   * The worker "server": HotelDB behind promises with a timeout, so the
   * in-flight and failure states exist. The demo strip can cut it.
   * ------------------------------------------------------------------ */
  var TIMEOUT = 15000;

  var Server = {
    latencyMs: 150,
    failMode: lsGet(LS.demo) === 'noConnection' ? 'noConnection' : 'none',

    setFailMode: function (m) {
      Server.failMode = m === 'noConnection' ? 'noConnection' : 'none';
      lsSet(LS.demo, Server.failMode);
    },

    call: function (produce) {
      return new Promise(function (resolve, reject) {
        var done = false;
        var timer = setTimeout(function () {
          if (done) return;
          done = true;
          reject({ type: 'timeout' });
        }, TIMEOUT);
        setTimeout(function () {
          if (done) return;
          if (Server.failMode === 'noConnection') {
            done = true; clearTimeout(timer); reject({ type: 'noConnection' }); return;
          }
          try {
            var v = produce();
            done = true; clearTimeout(timer); resolve(v);
          } catch (e) {
            done = true; clearTimeout(timer); reject({ type: 'serverError' });
          }
        }, Server.latencyMs);
      });
    },

    /* My orders: the active ones (oldest first), the ones delivered this
       hotel day, and what became of every order that was active last time. */
    mine: function (me, prevNos) {
      return Server.call(function () {
        var all = HotelDB.orders(), active = [], delivered = [], day = hotelDayStart(Date.now());
        var byNo = {};
        for (var i = 0; i < all.length; i++) {
          var o = all[i];
          byNo[String(o.orderNo)] = o;
          if (o.assignedTo !== me) continue;
          if (isActive(o.status)) active.push(o);
          else if (o.status === 'Delivered') {
            var row = logFor(o, 'Delivered');
            var at = row ? row.at : (o.updatedAt || 0);
            if (at >= day) delivered.push({ order: o, at: at });
          }
        }
        active.sort(function (a, b) {
          if (a.createdAt !== b.createdAt) return (a.createdAt || 0) - (b.createdAt || 0);
          return Number(a.orderNo) - Number(b.orderNo);
        });
        delivered.sort(function (a, b) { return b.at - a.at; });
        var gone = {};
        (prevNos || []).forEach(function (no) {
          var o = byNo[String(no)] || null;
          var kind = classify(o, me);
          if (kind !== 'active') gone[no] = { kind: kind, order: o };
        });
        return { active: active, delivered: delivered, gone: gone };
      });
    },

    order: function (orderNo) {
      return Server.call(function () { return HotelDB.getOrder(orderNo); });
    },

    /* A forward step by this worker. Refused as 'notMine' when the desk
       reassigned the order away a moment ago: HotelDB.setStatus does not
       know about workers, so the phone checks first, in the same step. */
    move: function (orderNo, status, me) {
      return Server.call(function () {
        var o = HotelDB.getOrder(orderNo);
        if (!o) return { ok: false, error: 'notFound', order: null };
        if (o.assignedTo !== me) return { ok: false, error: 'notMine', order: o };
        return HotelDB.setStatus(orderNo, status, { staffId: me, at: Date.now() });
      });
    },

    /* W-03 — outcomes: ok | supervisor | wrong | locked. 5 wrong in a row
       lock the field for one minute (S-03 §5.2 rule, the worker's own count). */
    signIn: function (pin) {
      return Server.call(function () {
        var auth = {};
        try { auth = JSON.parse(lsGet(LS.auth) || '{}') || {}; } catch (e) { auth = {}; }
        var now = Date.now();
        if (auth.lockedUntil && now < auth.lockedUntil) return { kind: 'locked' };
        var members = (HotelDB.staff().members) || [], hit = null;
        for (var i = 0; i < members.length; i++) if (String(members[i].pin) === pin) hit = members[i];
        if (hit && hit.role === 'worker') {
          lsSet(LS.auth, JSON.stringify({ wrong: 0, lockedUntil: 0 }));
          return { kind: 'ok', member: { id: hit.id, name: hit.name } };
        }
        if (hit) {                                   /* a supervisor: not a wrong PIN */
          lsSet(LS.auth, JSON.stringify({ wrong: 0, lockedUntil: 0 }));
          return { kind: 'supervisor' };
        }
        var wrong = (auth.wrong || 0) + 1;
        if (wrong >= 5) {
          lsSet(LS.auth, JSON.stringify({ wrong: 0, lockedUntil: now + 60 * 1000 }));
          return { kind: 'locked' };
        }
        lsSet(LS.auth, JSON.stringify({ wrong: wrong, lockedUntil: 0 }));
        return { kind: 'wrong' };
      });
    }
  };

  /* ------------------------------------------------------------------ *
   * Feed — the one "my orders" list. Refreshed on every HotelDB change,
   * every 15 s, and on becoming visible. Each successful response:
   *   - chimes once when an order appears that was not in the previous
   *     response (a new assignment or a reassignment to me); the first
   *     response after load or sign-in is the baseline and never chimes;
   *   - queues a notice for every order that left my active list for a
   *     reason other than my own delivery (W-01-C05);
   *   - tells the current screen.
   * ------------------------------------------------------------------ */
  var POLL_MS = 15000;

  var Feed = {
    me: null,
    loaded: false,      /* at least one successful response for `me` */
    failed: false,      /* the latest attempt failed */
    active: [],
    delivered: [],
    lastGone: {},       /* orderNo → { kind, order } from the latest response */
    prev: null,         /* orderNo set of the previous response; null = baseline */
    notices: [],        /* [{ no, room, kind, reason }] newest first */
    inFlight: false,
    again: false,
    gen: 0,
    timer: null,
    listeners: [],

    reset: function (me) {
      Feed.me = me || null;
      Feed.loaded = false; Feed.failed = false;
      Feed.active = []; Feed.delivered = []; Feed.lastGone = {};
      Feed.prev = null; Feed.notices = [];
      Feed.inFlight = false; Feed.again = false; Feed.gen++;
      clearTimeout(Feed.timer);
    },

    find: function (no) {
      for (var i = 0; i < Feed.active.length; i++) if (String(Feed.active[i].orderNo) === String(no)) return Feed.active[i];
      return null;
    },

    onUpdate: function (fn) { Feed.listeners.push(fn); },

    addNotice: function (kind, order, no) {
      if (kind === 'active' || kind === 'deliveredByMe') return;
      var key = String(order ? order.orderNo : no);
      for (var i = 0; i < Feed.notices.length; i++) if (Feed.notices[i].no === key) {
        Feed.notices.splice(i, 1);                /* one notice per order: the latest reason */
        break;
      }
      Feed.notices.unshift({
        no: key,
        room: order ? String(order.roomNumber) : '',
        kind: kind,
        order: order || null
      });
      if (window.App && App.announce) App.announce(t('w.gone.' + kind));
    },

    dismiss: function (no) {
      Feed.notices = Feed.notices.filter(function (n) { return n.no !== String(no); });
    },

    refresh: function () {
      if (!Feed.me) return;
      if (Feed.inFlight) { Feed.again = true; return; }
      clearTimeout(Feed.timer);
      Feed.inFlight = true;
      var g = ++Feed.gen, me = Feed.me;
      var prevNos = Feed.prev ? Object.keys(Feed.prev) : [];
      Server.mine(me, prevNos).then(function (res) {
        if (g !== Feed.gen) return;
        Feed.inFlight = false;
        var set = {}, fresh = [], i;
        for (i = 0; i < res.active.length; i++) set[res.active[i].orderNo] = true;
        if (Feed.prev !== null) {
          for (i = 0; i < res.active.length; i++) if (!Feed.prev[res.active[i].orderNo]) fresh.push(res.active[i]);
        }
        for (var no in res.gone) {
          if (Object.prototype.hasOwnProperty.call(res.gone, no)) Feed.addNotice(res.gone[no].kind, res.gone[no].order, no);
        }
        /* An order that came back to me drops its old notice. */
        for (i = 0; i < res.active.length; i++) Feed.dismiss(res.active[i].orderNo);
        Feed.prev = set;
        Feed.active = res.active;
        Feed.delivered = res.delivered;
        Feed.lastGone = res.gone;
        Feed.loaded = true;
        Feed.failed = false;
        if (fresh.length) Chime.play();            /* one chime per response */
        Feed.emit({ fresh: fresh, gone: res.gone });
        Feed.after();
      }, function () {
        if (g !== Feed.gen) return;
        Feed.inFlight = false;
        Feed.failed = true;
        Feed.emit({ fresh: [], gone: {} });
        Feed.after();
      });
    },

    after: function () {
      if (Feed.again) { Feed.again = false; Feed.refresh(); return; }
      clearTimeout(Feed.timer);
      Feed.timer = setTimeout(function () {
        if (!document.hidden) Feed.refresh();
      }, POLL_MS);
    },

    emit: function (change) {
      var list = Feed.listeners.slice();
      for (var i = 0; i < list.length; i++) { try { list[i](change); } catch (e) { if (window.console) console.error(e); } }
    }
  };

  window.WK = {
    itemQty: itemQty, countWord: countWord, duration: duration, clock: clock,
    westernDigits: westernDigits, payCase: payCase, hasNotes: hasNotes,
    lineName: lineName, spaced: spaced, isActive: isActive, assignedAt: assignedAt,
    logFor: logFor, classify: classify, storedReason: storedReason, hotelDayStart: hotelDayStart,
    Lang: Lang, Seen: Seen, Chime: Chime, Session: Session, Server: Server, Feed: Feed,
    MIN: MIN
  };
})();

</script>
<script>
/* worker/js/app.js */
/* worker/js/app.js — router, bottom-sheet manager, live updates, the demo strip.
   Owns #app, #modal-root, #sr-live and #demo-bar.

   Routes (hash, so the app runs from disk):
     #/sign-in        W-03 Worker sign-in       (دخول المندوب)
     #/orders         W-01 My orders            (طلباتي)
     #/order/{no}     W-02 Order detail         (تفاصيل الطلب)
   Sheets: WM-01 Confirm delivery and payment (the desk's SM-02, ported with
   its copy; ID per spec/worker/worker-map.md) and WM-02 End shift. Sheets have no URL; a same-URL history state is pushed only
   so the browser back gesture closes the sheet instead of leaving the screen. */
(function () {
  'use strict';

  var W = window.WK;

  I18N.register({
    'w.title.W-01': { ar: 'طلباتي', en: 'My orders' },
    'w.title.W-02': { ar: 'تفاصيل الطلب', en: 'Order detail' },
    'w.title.W-03': { ar: 'دخول المندوب', en: 'Delivery worker sign-in' }
  });

  var ROUTES = [
    { re: /^\/orders$/, view: 'W-01', params: function () { return {}; } },
    { re: /^\/order\/([^\/]+)$/, view: 'W-02', params: function (m) { return { orderNo: decodeURIComponent(m[1]) }; } },
    { re: /^\/sign-in$/, view: 'W-03', params: function () { return {}; } }
  ];

  function path() { return location.hash.replace(/^#/, '') || ''; }

  function resolve(p) {
    for (var i = 0; i < ROUTES.length; i++) {
      var m = p.match(ROUTES[i].re);
      if (m) return { view: ROUTES[i].view, params: ROUTES[i].params(m) };
    }
    return null;
  }

  var current = null;
  var navCtx = {};

  /* ------------------------------------------------------------------ *
   * Bottom sheets — the desk's staff-sheet conventions (SM-01 preamble):
   * 300 ms arming delay, not dismissable while a request is in flight.
   * ------------------------------------------------------------------ */
  var Modal = {
    cur: null,
    ignorePop: 0,

    isOpen: function () { return !!Modal.cur; },
    armed: function () { return !!Modal.cur && !Modal.cur.closing && Date.now() - Modal.cur.openedAt >= 300; },

    open: function (id, params) {
      var def = Modals[id];
      if (!def || Modal.cur) return;
      var host = document.createElement('div');
      host.className = 'backdrop s-backdrop';
      host.setAttribute('data-el', id + '-S01');
      document.getElementById('modal-root').appendChild(host);
      Modal.cur = { id: id, def: def, params: params || {}, host: host, openedAt: Date.now(), busy: false, closing: false };
      def.init(Modal.cur.params);
      Modal.draw(true);
      document.getElementById('app').setAttribute('inert', '');
      document.body.classList.add('is-modal-open');
      try { history.pushState({ workerModal: id }, '', location.href); } catch (e) {}
      host.addEventListener('click', function (e) { if (e.target === host) Modal.dismiss(); });
    },

    draw: function (first) {
      var c = Modal.cur;
      if (!c) return;
      c.host.innerHTML = c.def.html();
      var sheet = c.host.firstElementChild;
      c.def.bind(sheet);
      if (!first) sheet.style.animation = 'none';
      var title = sheet.querySelector('[data-title]');
      if (first && title) { try { title.focus({ preventScroll: true }); } catch (e) { title.focus(); } }
    },

    setBusy: function (b) {
      if (!Modal.cur) return;
      Modal.cur.busy = !!b;
      Modal.cur.host.classList.toggle('is-busy', !!b);
    },

    dismiss: function (fromPop) {
      var c = Modal.cur;
      if (!c || c.closing) return false;
      if (c.busy || !Modal.armed()) {
        if (fromPop) { try { history.pushState({ workerModal: c.id }, '', location.href); } catch (e) {} }
        return false;
      }
      Modal.remove(fromPop);
      if (current && current.def.onModalOutcome) current.def.onModalOutcome(c.id, 'closed');
      return true;
    },

    /* keepHistory: the caller navigates away next (App.toList), so the
       sheet's history entry is left for that navigation to account for. */
    finish: function (outcome, order, keepHistory) {
      var c = Modal.cur;
      if (!c) return;
      Modal.remove(!!keepHistory);
      if (current && current.def.onModalOutcome) current.def.onModalOutcome(c.id, outcome, order);
    },

    remove: function (fromPop) {
      var c = Modal.cur;
      if (!c) return;
      c.closing = true;
      Modal.cur = null;
      if (c.host.parentNode) c.host.parentNode.removeChild(c.host);
      document.getElementById('app').removeAttribute('inert');
      document.body.classList.remove('is-modal-open');
      if (!fromPop && history.state && history.state.workerModal) {
        Modal.ignorePop++;
        history.back();
      }
    },

    drop: function () { if (Modal.cur) Modal.remove(true); }
  };

  window.addEventListener('popstate', function () {
    if (Modal.ignorePop > 0) { Modal.ignorePop--; return; }
    if (Modal.cur) Modal.dismiss(true);
  });

  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Escape' || e.key === 'Esc') && Modal.cur) Modal.dismiss();
  });

  /* ------------------------------------------------------------------ *
   * App
   * ------------------------------------------------------------------ */
  var App = {
    Modal: Modal,

    view: function () { return current ? current.view : null; },

    go: function (p, ctx) {
      navCtx = ctx || {};
      if (location.hash === '#' + p) { App.render(); return; }
      location.hash = p;
    },

    replace: function (p, ctx) {
      navCtx = ctx || {};
      if (location.hash === '#' + p) { App.render(); return; }
      location.replace('#' + p);
    },

    render: function () {
      var r = resolve(path());
      var sess = W.Session.current();
      if (!r) { navCtx = {}; location.replace(sess ? '#/orders' : '#/sign-in'); return; }
      if (r.view !== 'W-03' && !sess) { navCtx = {}; location.replace('#/sign-in'); return; }
      if (r.view === 'W-03' && sess) { navCtx = {}; location.replace('#/orders'); return; }
      if (sess && W.Feed.me !== sess.memberId) { W.Feed.reset(sess.memberId); W.Feed.refresh(); }

      var ctx = navCtx; navCtx = {};
      if (current && current.def.leave) current.def.leave();
      Modal.drop();
      current = { view: r.view, params: r.params, def: Views[r.view] };
      var root = document.getElementById('app');
      root.setAttribute('data-screen', r.view);
      document.title = t('w.title.' + r.view);
      current.def.enter(r.params, ctx);
    },

    rerender: function () {
      I18N.apply();
      if (current) document.title = t('w.title.' + current.view);
      drawDemo();
      if (current && current.def.draw) {
        var y = window.scrollY;
        current.def.draw();
        window.scrollTo(0, y);
      }
      if (Modal.cur) Modal.draw(false);
    },

    paint: function (html) {
      var root = document.getElementById('app');
      var y = window.scrollY;
      root.innerHTML = html;
      if (window.scrollY !== y) window.scrollTo(0, y);
      return root;
    },

    announce: function (text) {
      var el = document.getElementById('sr-live');
      if (!el) return;
      el.textContent = '';
      setTimeout(function () { el.textContent = text; }, 30);
    },

    /* Back to W-01 from W-02 — by the back button, or because the order left
       this phone. When W-02 was opened from the list, step back in history
       (past a sheet's entry if one is still there) so the list is not
       stacked twice; otherwise replace. */
    toList: function (fromList) {
      var extra = 0;
      if (Modal.cur) Modal.remove(true);
      if (history.state && history.state.workerModal) extra = 1;
      if (fromList) { try { history.go(-(1 + extra)); return; } catch (e) {} }
      App.replace('/orders');
    },

    /* W-03 success: the first Feed response is the chime baseline. */
    afterSignIn: function () {
      var me = W.Session.me();
      W.Feed.reset(me);
      W.Feed.refresh();
      App.replace('/orders');
    },

    /* WM-02 confirmed, or the demo reset. */
    endShift: function () {
      var me = W.Session.me();
      if (me) W.Seen.mark(me);
      W.Session.end();                 /* the staff-key change may already have routed to W-03 */
      W.Feed.reset(null);
      if (!current || current.view !== 'W-03') App.replace('/sign-in');
    },

    start: function () {
      W.Lang.init();
      drawDemo();
      window.addEventListener('hashchange', App.render);
      App.render();
    }
  };

  /* ------------------------------------------------------------------ *
   * Live updates, the clock, visibility, the first gesture
   * ------------------------------------------------------------------ */

  /* HotelDB fires on the cross-tab storage event and on same-tab writes. */
  HotelDB.onChange(function (e) {
    if (e.key === HotelDB.keys.staff || e.key == null) {
      /* A shift ended (or a session changed) elsewhere: re-check at once. */
      if (current && current.view !== 'W-03' && !W.Session.current()) { W.Feed.reset(null); App.replace('/sign-in'); return; }
    }
    if (e.key === HotelDB.keys.orders || e.key == null) {
      if (W.Feed.me) W.Feed.refresh();
    }
  });

  W.Feed.onUpdate(function (change) {
    if (current && current.def.onFeed) current.def.onFeed(change);
  });

  setInterval(function () {
    if (!current) return;
