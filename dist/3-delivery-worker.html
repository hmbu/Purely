    if (current.view !== 'W-03' && !W.Session.current()) { W.Feed.reset(null); App.replace('/sign-in'); return; }
    if (current.def.tick) current.def.tick(Date.now());
  }, 1000);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && W.Feed.me) W.Feed.refresh();
    if (current && current.def.onVisibility) current.def.onVisibility(!document.hidden);
  });

  /* Any touch, click or key press arms audio. */
  function gesture() {
    var was = W.Chime.ready();
    W.Chime.arm();
    if (!was && current && current.def.onArm) current.def.onArm();
  }
  document.addEventListener('pointerdown', gesture, true);
  document.addEventListener('keydown', gesture, true);
  document.addEventListener('touchstart', gesture, { capture: true, passive: true });

  /* ------------------------------------------------------------------ *
   * Demo strip — not part of the product
   * ------------------------------------------------------------------ */
  function drawDemo() {
    var bar = document.getElementById('demo-bar');
    if (!bar) return;
    var mode = W.Server.failMode;
    bar.innerHTML =
      '<span class="demo-bar__tag">' + t('w.demo.tag') + '</span>' +
      '<label>' + t('w.demo.server') +
        ' <select id="demo-fail">' +
          '<option value="none"' + (mode === 'none' ? ' selected' : '') + '>' + t('w.demo.ok') + '</option>' +
          '<option value="noConnection"' + (mode === 'noConnection' ? ' selected' : '') + '>' + t('w.demo.down') + '</option>' +
        '</select></label>' +
      '<button type="button" id="demo-reset">' + t('w.demo.reset') + '</button>';

    bar.querySelector('#demo-fail').addEventListener('change', function (e) {
      W.Server.setFailMode(e.target.value);
      if (W.Feed.me) W.Feed.refresh();
    });
    bar.querySelector('#demo-reset').addEventListener('click', function () {
      if (Modal.cur) Modal.drop();
      App.endShift();
    });
  }

  window.App = App;
})();

</script>
<script>
/* worker/js/signin.js */
/* worker/js/signin.js — W-03 Delivery worker sign-in (دخول المندوب).
   A 4-digit PIN; the 4th digit submits (the desk's S-03 behaviour). Only
   members with role `worker` get in. A supervisor PIN is not "wrong": it is
   told that this is the worker's app. Success starts the worker's shift
   (HotelDB.startShift) and writes roomstore.staff.workerSession — never the
   desk's `session`. Typing the PIN is the touch that arms the chime. */
(function () {
  'use strict';

  var W = window.WK;
  var Server = W.Server;

  I18N.register({
    'w03.c01':          { ar: 'دخول المندوب', en: 'Delivery worker sign-in' },
    'w03.c02':          { ar: 'أدخل رمزك لتبدأ ورديتك وتصلك الطلبات المحوّلة لك', en: 'Enter your PIN to start your shift and receive the orders assigned to you' },
    'w03.c03':          { ar: 'رمز الدخول (4 أرقام)', en: 'PIN (4 digits)' },
    'w03.c04.wrong':    { ar: 'رمز الدخول غير صحيح — أعد إدخاله', en: 'Wrong PIN — enter it again' },
    'w03.c04.supervisor': { ar: 'هذا تطبيق المندوب. المشرف يستخدم تابلت مكتب الروم سيرفس', en: 'This is the delivery worker app. Supervisors use the room service desk tablet' },
    'w03.c04.locked':   { ar: 'محاولات خاطئة كثيرة — انتظر دقيقة ثم حاول مرة أخرى', en: 'Too many wrong attempts — wait one minute, then try again' },
    'w03.c04.failed':   { ar: 'تعذّر الوصول إلى النظام — تحقّق من الشبكة ثم أعد إدخال الرمز', en: 'Could not reach the system — check the network, then enter the PIN again' },
    'w03.c04.short':    { ar: 'رمز الدخول 4 أرقام — أكمل إدخاله', en: 'The PIN has 4 digits — finish entering it' },
    'w03.c04.paste':    { ar: 'استخدم الأرقام فقط (0–9)', en: 'Use digits only (0–9)' },
    'w03.c05':          { ar: 'جارٍ التحقق…', en: 'Checking…' },
    'w03.c06':          { ar: 'نسيت رمزك؟ اطلبه من مشرف الروم سيرفس', en: 'Forgot your PIN? Ask the room service supervisor' },
    'w03.sr.fill':      { ar: '{n} من 4 أرقام', en: '{n} of 4 digits' }
  });

  var LOCK_MS = 60 * 1000;
  var P = { mounted: false };

  function submit() {
    if (P.busy || P.lockedUntil) return;
    var pin = P.pin;
    P.pin = '';
    P.dots = 4;
    P.busy = true;
    P.msg = null;
    var input = inputEl();
    if (input) { input.value = ''; input.blur(); }
    paintPin();
    Server.signIn(pin).then(function (res) {
      if (!P.mounted) return;
      if (res && res.kind === 'ok') {
        W.Session.start(res.member.id);
        App.afterSignIn();
        return;
      }
      P.busy = false;
      P.dots = 0;
      if (res && res.kind === 'locked') {
        P.msg = 'locked';
        P.lockedUntil = Date.now() + LOCK_MS;
        clearTimeout(P.lockTimer);
        P.lockTimer = setTimeout(function () {
          P.lockedUntil = 0;
          if (P.msg === 'locked') P.msg = null;
          paintPin();
          focusPin();
        }, LOCK_MS);
        paintPin();
        return;
      }
      P.msg = res && (res.kind === 'wrong' || res.kind === 'supervisor') ? res.kind : 'failed';
      paintPin();
      focusPin();
    }, function () {
      if (!P.mounted) return;
      P.busy = false;
      P.dots = 0;
      P.msg = 'failed';
      paintPin();
      focusPin();
    });
  }

  function onInput(e) {
    var el = e.target;
    if (P.busy || P.lockedUntil) { el.value = ''; return; }
    var raw = W.westernDigits(el.value);
    var digits = raw.replace(/[^0-9]/g, '');
    if (digits.length !== raw.length) digits = P.pin + '';   /* a non-digit is not entered */
    digits = digits.slice(0, 4);
    if (digits.length > P.pin.length) P.msg = null;           /* the next digit clears C04 */
    P.pin = digits;
    P.dots = digits.length;
    el.value = digits;
    paintPin();
    if (digits.length === 4) submit();
  }

  function onPaste(e) {
    e.preventDefault();
    if (P.busy || P.lockedUntil) return;
    var text = '';
    try { text = (e.clipboardData || window.clipboardData).getData('text') || ''; } catch (x) {}
    var v = W.westernDigits(String(text).replace(/^\s+|\s+$/g, ''));
    if (!/^[0-9]+$/.test(v)) { P.msg = 'paste'; paintPin(); return; }
    P.pin = v.slice(0, 4);
    P.dots = P.pin.length;
    P.msg = null;
    inputEl().value = P.pin;
    paintPin();
    if (P.pin.length === 4) submit();
  }

  function onKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (P.pin.length < 4 && !P.busy && !P.lockedUntil) { P.msg = 'short'; paintPin(); }
    }
  }

  function onDocKey(e) {
    if (!P.mounted) return;
    var input = inputEl();
    if (!input || document.activeElement === input) return;
    if (/^[0-9٠-٩۰-۹]$/.test(e.key) && !App.Modal.isOpen()) focusPin();
  }
  document.addEventListener('keydown', onDocKey, true);

  function inputEl() { return document.querySelector('[data-el="W-03-F01"] input'); }

  function focusPin() {
    var el = inputEl();
    if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (x) { el.focus(); } }
  }

  function cellsHtml() {
    var h = '';
    for (var i = 0; i < 4; i++) {
      var filled = i < P.dots;
      var next = !P.busy && !P.lockedUntil && i === P.dots;
      h += '<span class="s-pin__cell' + (next ? ' is-next' : '') + '" aria-hidden="true">' +
             (filled ? '<span class="s-pin__dot"></span>' : '') + '</span>';
    }
    return h;
  }

  function slotHtml() {
    if (P.busy) return '<p class="s-slot__checking" data-el="W-03-C06" role="status">' + t('w03.c05') + '</p>';
    if (P.msg) return '<p class="error" data-el="W-03-C05" role="alert">' + t('w03.c04.' + P.msg) + '</p>';
    return '';
  }

  /* Demo hint: the worker PINs only (2222, 3333). */
  function demoHint() {
    var members = (HotelDB.staff().members) || [], parts = [];
    for (var i = 0; i < members.length; i++) {
      if (members[i].role !== 'worker') continue;
      parts.push('<span class="num">' + esc(members[i].pin) + '</span> ' + esc(members[i].name));
    }
    return '<aside class="s-demo-hint" data-demo="true">' +
             '<span class="s-demo-hint__tag">' + t('w.demo.tag') + '</span>' +
             t('w.demo.pins') + ' ' + parts.join(' · ') + '</aside>';
  }

  function draw() {
    if (!P.mounted) return;
    var dis = P.busy || P.lockedUntil;
    var h = '<div class="s-screen w-signin-screen">' +
      '<div class="s-top"><header class="s-header" data-el="W-03-S01">' +
        '<h1 class="s-header__title" data-el="W-03-C01">' + t('w03.c01') + '</h1>' +
        '<button type="button" class="s-hbtn" data-el="W-03-B01" lang="' + I18N.other() + '">' + t('w.lang.other') + '</button>' +
      '</header></div>' +
      '<main class="s-col s-col--narrow s-signin" data-el="W-03-S02">' +
        '<p class="w-lead" data-el="W-03-C03">' + t('w03.c02') + '</p>' +
        '<label class="s-pin-label" data-el="W-03-C04" for="w03-pin">' + t('w03.c03') + '</label>' +
        '<div class="s-pin' + (dis ? ' is-disabled' : '') + '" data-el="W-03-F01">' +
          '<span class="s-pin__cells" style="display:contents">' + cellsHtml() + '</span>' +
          '<input id="w03-pin" class="s-pin__input" type="text" inputmode="numeric" pattern="[0-9]*" ' +
            'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ' +
            'enterkeyhint="go" data-lpignore="true" data-form-type="other" name="w03-code-' + Date.now() + '" ' +
            'aria-describedby="w03-fill"' + (dis ? ' disabled' : '') + '>' +
          '<span id="w03-fill" class="sr-only">' + t('w03.sr.fill', { n: P.dots }) + '</span>' +
        '</div>' +
        '<div class="s-slot">' + slotHtml() + '</div>' +
        '<p class="s-helper" data-el="W-03-C07">' + t('w03.c06') + '</p>' +
        demoHint() +
      '</main></div>';

    var root = App.paint(h);
    root.querySelector('[data-el="W-03-B01"]').addEventListener('click', function () {
      var now = Date.now();
      if (P.tapAt && now - P.tapAt < 300) return;
      P.tapAt = now;
      W.Lang.toggle();
    });
    var input = inputEl();
    if (input) {
      input.value = P.pin;
      input.addEventListener('input', onInput);
      input.addEventListener('paste', onPaste);
      input.addEventListener('keydown', onKey);
    }
  }

  function paintPin() {
    var box = document.querySelector('[data-el="W-03-F01"]');
    if (!box) return;
    var dis = !!(P.busy || P.lockedUntil);
    box.classList.toggle('is-disabled', dis);
    box.querySelector('.s-pin__cells').innerHTML = cellsHtml();
    box.querySelector('#w03-fill').textContent = t('w03.sr.fill', { n: P.dots });
    inputEl().disabled = dis;
    var slot = document.querySelector('.s-slot');
    if (slot) slot.innerHTML = slotHtml();
  }

  Views['W-03'] = {
    enter: function () {
      P = { mounted: true, pin: '', dots: 0, busy: false, msg: null, lockedUntil: 0, lockTimer: null, tapAt: 0 };
      window.scrollTo(0, 0);
      draw();
      focusPin();
    },
    leave: function () {
      P.mounted = false;
      clearTimeout(P.lockTimer);
    },
    draw: function () { draw(); focusPin(); }
  };
})();

</script>
<script>
/* worker/js/orders.js */
/* worker/js/orders.js — W-01 My orders (طلباتي) and WM-02 End shift.
   Only orders where assignedTo === me, status Accepted or On the way, oldest
   first (docs/operations.html "التوزيع على العمّال", design rule 1). The
   list is live: WK.Feed refreshes on every HotelDB change, so a new
   assignment appears — with the chime — and a reassignment away disappears,
   with no reload. Money is never shown here (design rule 8): the payment
   method only. */
(function () {
  'use strict';

  var W = window.WK;
  var Feed = W.Feed, Session = W.Session;

  I18N.register({
    'w01.c01':        { ar: 'طلباتي', en: 'My orders' },
    'w01.b02':        { ar: 'إنهاء الوردية', en: 'End shift' },
    'w01.c02':        { ar: '{name} — في الوردية منذ {time}', en: '{name} — on shift since {time}' },
    'w01.c03':        { ar: 'المس الشاشة مرة واحدة لتفعيل صوت الطلبات الجديدة', en: 'Touch the screen once to turn on the new-order sound' },
    'w01.c11':        { ar: 'للتوصيل الآن — {n}', en: 'To deliver now — {n}' },
    'w01.c05':        { ar: 'جديد', en: 'New' },
    'w01.card.meta':  { ar: '{count} · {method}', en: '{count} · {method}' },
    'w01.card.when':  { ar: 'حُوّل لك {ago}', en: 'Assigned to you {ago}' },
    'w01.c06.l1':     { ar: 'لا توجد طلبات محوّلة لك الآن', en: 'No orders assigned to you right now' },
    'w01.c06.l2':     { ar: 'تظهر هنا فور أن يحوّلها لك مكتب الروم سيرفس، مع نغمة', en: 'They appear here as soon as the room service desk assigns them to you, with a chime' },
    'w01.c10':        { ar: 'تعذّر تحديث طلباتك — هذه آخر قائمة معروفة', en: 'Could not refresh your orders — this is the last known list' },
    'w01.c10.first':  { ar: 'تعذّر تحميل طلباتك — تحقّق من الشبكة', en: 'Could not load your orders — check the network' },
    'w01.b04':        { ar: 'إعادة المحاولة', en: 'Try again' },
    'w01.b05':        { ar: 'فهمت', en: 'Got it' },
    'w01.b03':        { ar: 'تم التوصيل اليوم ({n})', en: 'Delivered today ({n})' },
    'w01.c08':        { ar: 'غرفة {room} · طلب رقم {no}', en: 'Room {room} · Order {no}' },
    'w01.c08.desk':   { ar: 'سجّله المكتب', en: 'Recorded by the desk' },
    'w01.sr.card':    { ar: 'غرفة {room}، {status}، {count}، {method}', en: 'Room {room}, {status}, {count}, {method}' },
    'w01.sr.new':     { ar: 'طلب جديد لك: غرفة {room}', en: 'New order for you: room {room}' },

    /* WM-02 End shift */
    'wm02.c01':       { ar: 'إنهاء الوردية؟', en: 'End your shift?' },
    'wm02.c02':       { ar: 'ستخرج من التطبيق ولن تصلك طلبات جديدة حتى تسجّل دخولك مرة أخرى.', en: 'You will be signed out and will not receive new orders until you sign in again.' },
    'wm02.c03':       { ar: 'معك {count} لم يُسلَّم بعد. يبقى محوّلًا لك حتى يحوّله المكتب لعامل آخر — أبلغ المكتب قبل أن تغادر.', en: 'You still have {count} not delivered. It stays assigned to you until the desk reassigns it — tell the desk before you leave.' },
    'wm02.b02':       { ar: 'إنهاء الوردية', en: 'End shift' },
    'w.orders.1':     { ar: 'طلب واحد', en: '1 order' },
    'w.orders.2':     { ar: 'طلبان', en: '2 orders' },
    'w.orders.few':   { ar: '{n} طلبات', en: '{n} orders' },
    'w.orders.many':  { ar: '{n} طلبًا', en: '{n} orders' }
  });

  var L = { mounted: false };

  function me() { return Session.me(); }

  function ordersWord(n) {
    var b = n === 1 ? '1' : n === 2 ? '2' : (n >= 3 && n <= 10) ? 'few' : 'many';
    return t('w.orders.' + b, { n: n });
  }

  /* Double-tap guard: a second tap on the SAME control within 300 ms is ignored. */
  var tapAt = {};
  function tapOk(key) {
    var now = Date.now();
    key = key || '';
    if (tapAt[key] && now - tapAt[key] < 300) return false;
    tapAt[key] = now;
    return true;
  }

  /* ------------------------------------------------------------------ *
   * Draw
   * ------------------------------------------------------------------ */
  function noticeHtml(n) {
    var o = n.order;
    var reason = (n.kind === 'cancelled' && o) ? W.storedReason(o) : '';
    var which = n.room ? t('w.gone.which', { no: '<span class="num">' + esc(n.no) + '</span>', room: '<span class="w-ltr">' + esc(n.room) + '</span>' }) : '';
    var dont = (n.kind === 'reassigned' || n.kind === 'cancelled');
    return '<div class="s-banner w-notice" data-el="W-01-C05" data-order="' + esc(n.no) + '" data-kind="' + n.kind + '" role="alert">' +
             '<p class="s-banner__l1">' + t('w.gone.' + n.kind) + '</p>' +
             (which ? '<p class="s-banner__l2">' + which + '</p>' : '') +
             (reason ? '<p class="s-banner__l2">' + t('w.gone.reason', { reason: esc(reason) }) + '</p>' : '') +
             (dont ? '<p class="s-banner__l2">' + t('w.gone.dont') + '</p>' : '') +
             '<button type="button" class="w-notice__ok" data-el="W-01-B04" data-order="' + esc(n.no) + '">' + t('w01.b05') + '</button>' +
           '</div>';
  }

  function cardHtml(o, now) {
    var qty = W.itemQty(o);
    var method = t(o.payment === 'cash' ? 'w.pay.cash' : 'w.pay.card');
    var at = W.assignedAt(o, me());
    var isNew = at > L.seenAt;
    return '<button type="button" class="s-card w-card" data-el="W-01-C07" data-order="' + esc(o.orderNo) + '"' +
             ' aria-label="' + esc(t('w01.sr.card', { room: W.spaced(o.roomNumber), status: t('w.status.' + o.status), count: W.countWord(qty), method: method })) + '">' +
             '<span class="s-card__top">' +
               '<span class="s-card__room"><span class="s-card__roomword">' + t('w.room') + '</span>' +
               '<span class="s-roomno s-card__roomno">' + esc(o.roomNumber) + '</span></span>' +
               (isNew ? '<span class="s-chip s-chip--late w-new" data-el="W-01-C15">' + t('w01.c05') + '</span>' : '') +
             '</span>' +
             '<span class="w-card__status">' + t('w.status.' + o.status) + '</span>' +
             '<span class="w-card__meta">' + t('w01.card.meta', { count: W.countWord(qty), method: '<b>' + method + '</b>' }) + '</span>' +
             '<span class="s-card__meta"><span>' + t('w.orderno', { no: '<span class="num">' + esc(o.orderNo) + '</span>' }) + '</span>' +
               '<span>' + t('w01.card.when', { ago: W.duration(now - (at || now)) }) + '</span></span>' +
           '</button>';
  }

  function deliveredHtml() {
    var list = Feed.delivered;
    if (!list.length) return '';
    var h = '<section class="w-done" data-el="W-01-S03">' +
      '<button type="button" class="w-done__toggle" data-el="W-01-B06" aria-expanded="' + (L.open ? 'true' : 'false') + '" aria-controls="w01-done">' +
        '<span>' + t('w01.b03', { n: '<span class="num">' + list.length + '</span>' }) + '</span>' +
        '<span class="w-done__chev" aria-hidden="true">' + (L.open ? '▴' : '▾') + '</span>' +
      '</button>' +
      '<ul id="w01-done"' + (L.open ? '' : ' hidden') + '>';
    for (var i = 0; i < list.length; i++) {
      var o = list[i].order, row = W.logFor(o, 'Delivered');
      var desk = row && row.staffId !== me();
      h += '<li class="w-done__row" data-el="W-01-C16" data-order="' + esc(o.orderNo) + '">' +
             '<span>' + t('w01.c08', { room: '<span class="w-ltr">' + esc(o.roomNumber) + '</span>', no: '<span class="num">' + esc(o.orderNo) + '</span>' }) +
               (desk ? ' <span class="w-done__desk">· ' + t('w01.c08.desk') + '</span>' : '') + '</span>' +
             '<span class="w-done__time">' + W.clock(list[i].at) + '</span>' +
           '</li>';
    }
    return h + '</ul></section>';
  }

  function draw() {
    if (!L.mounted) return;
    var sess = Session.current();
    if (!sess) return;
    var now = Date.now();
    var shift = HotelDB.workers().filter(function (w) { return w.id === sess.memberId; })[0];
    var since = (shift && shift.since) || sess.since || now;

    var h = '<div class="s-screen w-list-screen">' +
      '<div class="s-top"><header class="s-header" data-el="W-01-S01">' +
        '<h1 class="s-header__title" data-el="W-01-C02">' + t('w01.c01') + '</h1>' +
        '<button type="button" class="s-hbtn" data-el="W-01-B01" lang="' + I18N.other() + '">' + t('w.lang.other') + '</button>' +
        '<button type="button" class="s-hbtn s-hbtn--end" data-el="W-01-B03">' + t('w01.b02') + '</button>' +
      '</header>' +
      '<p class="w-shiftline" data-el="W-01-C01">' + t('w01.c02', { name: esc(sess.name), time: '<span class="num">' + W.clock(since) + '</span>' }) + '</p>' +
      '</div>' +
      '<main class="s-list w-list" data-el="W-01-S02">';

    if (!W.Chime.ready()) h += '<p class="s-line s-line--boxed w-sound" data-el="W-01-C14">' + t('w01.c03') + '</p>';

    if (Feed.failed) {
      h += '<div class="w-fail" data-el="W-01-C04" role="status"><p class="s-line">' +
             t(Feed.loaded ? 'w01.c10' : 'w01.c10.first') + '</p>' +
             '<button type="button" class="btn btn--sm" data-el="W-01-B05">' + t('w01.b04') + '</button></div>';
    }

    for (var i = 0; i < Feed.notices.length; i++) h += noticeHtml(Feed.notices[i]);

    if (!Feed.loaded && !Feed.failed) {
      h += '<div data-el="W-01-C12" aria-hidden="true">' +
             '<div class="s-skel s-skel--card"></div>' +
             '<div class="s-skel s-skel--card" style="margin-top:12px"></div></div>';
    } else if (Feed.loaded) {
      var list = Feed.active;
      if (!list.length) {
        h += '<div class="s-empty" data-el="W-01-C11">' +
               '<span class="s-icon-circle" aria-hidden="true">✓</span>' +
               '<p class="s-empty__l1">' + t('w01.c06.l1') + '</p>' +
               '<p class="s-empty__l3">' + t('w01.c06.l2') + '</p></div>';
      } else {
        h += '<section class="s-group"><h2 class="s-group__title" data-el="W-01-C06">' +
               t('w01.c11', { n: '<span class="num">' + list.length + '</span>' }) + '</h2><div class="s-cards">';
        for (var j = 0; j < list.length; j++) h += cardHtml(list[j], now);
        h += '</div></section>';
      }
      h += deliveredHtml();
    }
    h += '</main></div>';

    var root = App.paint(h);
    root.querySelector('[data-el="W-01-B01"]').addEventListener('click', function () {
      if (!tapOk('B01')) return;
      W.Lang.toggle();
    });
    root.querySelector('[data-el="W-01-B03"]').addEventListener('click', function () {
      if (!tapOk('B02') || App.Modal.isOpen()) return;
      App.Modal.open('WM-02', { open: Feed.active.length });
    });
    var b04 = root.querySelector('[data-el="W-01-B05"]');
    if (b04) b04.addEventListener('click', function () { if (tapOk('B04')) Feed.refresh(); });
    var b03 = root.querySelector('[data-el="W-01-B06"]');
    if (b03) b03.addEventListener('click', function () {
      if (!tapOk('B03')) return;
      L.open = !L.open;
      draw();
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-el="W-01-B04"]'), function (b) {
      b.addEventListener('click', function () {
        Feed.dismiss(b.getAttribute('data-order'));
        draw();
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('[data-el="W-01-C07"]'), function (c) {
      c.addEventListener('click', function () {
        if (!tapOk('C04')) return;
        var no = c.getAttribute('data-order');
        App.go('/order/' + encodeURIComponent(no), { fromList: true });
      });
    });
  }

  /* ------------------------------------------------------------------ *
   * View contract
   * ------------------------------------------------------------------ */
  Views['W-01'] = {
    enter: function () {
      L = { mounted: true, open: L.open || false, seenAt: W.Seen.at(me()), lastTick: 0 };
      window.scrollTo(0, 0);
      draw();
      Feed.refresh();
    },
    leave: function () {
      L.mounted = false;
      W.Seen.mark(me());                    /* "the list was last seen" now */
    },
    draw: draw,
    onFeed: function (change) {
      if (change && change.fresh) {
        for (var i = 0; i < change.fresh.length; i++) {
          App.announce(t('w01.sr.new', { room: W.spaced(change.fresh[i].roomNumber) }));
        }
      }
      draw();
    },
    onArm: function () { draw(); },
    onVisibility: function (visible) {
      if (!visible) W.Seen.mark(me());
      else { L.seenAt = W.Seen.at(me()); draw(); }
    },
    onModalOutcome: function () { draw(); },
    tick: function (now) {
      if (!L.mounted) return;
      if (!L.lastTick) { L.lastTick = now; return; }
      if (now - L.lastTick >= 30000) { L.lastTick = now; if (!App.Modal.isOpen()) draw(); }
    }
  };

  /* ================================================================== *
   * WM-02 — End shift (confirm first)
   * ================================================================== */
  var E = {};

  Modals['WM-02'] = {
    init: function (params) { E = { open: params.open || 0 }; },
    html: function () {
      return '<div class="sheet s-sheet" data-el="WM-02-S02" role="dialog" aria-modal="true" aria-labelledby="wm01-title">' +
        '<div class="s-sheet__scroll">' +
          '<h2 id="wm01-title" class="s-sheet__title" data-el="WM-02-C01" tabindex="-1" data-title>' + t('wm02.c01') + '</h2>' +
          '<p class="s-effect" data-el="WM-02-C02">' + t('wm02.c02') + '</p>' +
          (E.open ? '<p class="s-boxline w-warn" data-el="WM-02-C03">' + t('wm02.c03', { count: ordersWord(E.open) }) + '</p>' : '') +
        '</div>' +
        '<div class="s-sheet__foot" data-el="WM-02-S03">' +
          '<button type="button" class="btn btn--ghost" data-el="WM-02-B01">' + t('w.back') + '</button>' +
          '<button type="button" class="btn btn--primary s-primary" data-el="WM-02-B02"><span class="s-primary__l1">' + t('wm02.b02') + '</span></button>' +
        '</div>' +
      '</div>';
    },
    bind: function (sheet) {
      sheet.querySelector('[data-el="WM-02-B01"]').addEventListener('click', function () { App.Modal.dismiss(); });
      sheet.querySelector('[data-el="WM-02-B02"]').addEventListener('click', function () {
        if (!App.Modal.armed()) return;
        App.Modal.remove(true);             /* the sign-in replace below takes over the sheet's entry */
        App.endShift();
      });
    }
  };
})();

</script>
<script>
/* worker/js/order.js */
/* worker/js/order.js — W-02 Order detail (تفاصيل الطلب) and WM-01 Confirm
   delivery and payment — the desk's SM-02 ported to the phone with its copy
   and behaviour (docs/operations.html moves SM-02 to the worker's phone; the
   ID WM-01 follows spec/worker/worker-map.md).

   The worker moves only their own order, one step at a time:
     Accepted  → "خرجت بالطلب / I'm on my way"             → On the way
     On the way→ "تم التوصيل واستلام المبلغ / Delivered & paid" → WM-01 → Delivered
   Workers never cancel (design rule 6): W-02-C14 tells them to call the desk.
   When the order leaves this phone — reassigned, cancelled by the desk, or
   delivered by the desk on the worker's behalf — W-02 returns to W-01, where
   W-01-C05 says why. */
(function () {
  'use strict';

  var W = window.WK;
  var Feed = W.Feed, Session = W.Session, Server = W.Server;

  I18N.register({
    'w02.c01':        { ar: 'تفاصيل الطلب', en: 'Order detail' },
    'w02.c14':        { ar: 'غيّر المكتب حالة هذا الطلب نيابةً عنك', en: "The desk changed this order's status for you" },
    'w02.c15':        { ar: 'تعذّر تحديث هذا الطلب — هذه آخر حالة معروفة', en: 'Could not refresh this order — this is the last known status' },
    'w02.c05':        { ar: 'جوال الضيف', en: 'Guest mobile' },
    'w02.sr.call':    { ar: 'اتصل بالضيف على {phone}', en: 'Call the guest on {phone}' },
    'w02.c06':        { ar: 'ما يجب تجهيزه — {count}', en: 'To prepare — {count}' },
    'w02.c07.qty':    { ar: '×{n}', en: '×{n}' },
    'w02.c09':        { ar: 'ملاحظات الضيف', en: 'Guest notes' },
    'w02.c10':        { ar: 'الدفع عند الاستلام', en: 'Pay on delivery' },
    'w02.c10.card':   { ar: 'الطريقة: بطاقة — أحضر جهاز الدفع', en: 'Method: Card — bring the card terminal' },
    'w02.c10.cash':   { ar: 'الطريقة: نقدًا', en: 'Method: Cash' },
    'w02.c10.collect':{ ar: 'المبلغ المطلوب: {total}', en: 'Amount to collect: {total}' },
    'w02.c10.more':   { ar: 'سيدفع بـ {amount} — أحضر باقي {change}', en: 'Paying with {amount} — bring {change} change' },
    'w02.c10.equal':  { ar: 'سيدفع بالمبلغ المطابق — لا يوجد باقٍ', en: 'Paying the exact amount — no change' },
    'w02.c10.none':   { ar: 'لم يحدّد الضيف المبلغ — احمل باقيًا كافيًا', en: 'The guest did not state an amount — carry enough change' },
    'w02.c11':        { ar: 'الضيف رفض الطلب أو لا يوجد دفع؟ اتصل بمكتب الروم سيرفس ليلغيه', en: "Guest refused or can't pay? Call the room service desk to cancel" },
    'w02.c12':        { ar: 'تم تسجيل التوصيل والدفع', en: 'Delivery and payment recorded' },
    'w02.c12.desk':   { ar: 'سجّل المكتب التوصيل نيابةً عنك', en: 'The desk recorded the delivery for you' },
    'w02.b02.Accepted': { ar: 'خرجت بالطلب', en: "I'm on my way" },
    'w02.b02.OnTheWay': { ar: 'تم التوصيل واستلام المبلغ', en: 'Delivered & paid' },
    'w02.b02.opens':  { ar: 'يفتح تأكيد الدفع', en: 'Opens the payment confirmation' },
    'w02.b03':        { ar: 'العودة إلى طلباتي', en: 'Back to my orders' },
    'w02.c16.l1':     { ar: 'تعذّر تحميل هذا الطلب', en: 'Could not load this order' },
    'w02.c16.l2':     { ar: 'تحقّق من الشبكة ثم ارجع إلى طلباتي وافتحه من هناك', en: 'Check the network, then go back to your orders and open it from there' },
    'w02.sr.status':  { ar: '{no}: {label}', en: '{no}: {label}' },
    'w02.sr.item':    { ar: '{n} × {name}', en: '{n} × {name}' },

    /* WM-01 — the desk's SM-02 copy, word for word. */
    'wm01.c01':         { ar: 'تأكيد التوصيل والدفع', en: 'Confirm delivery and payment' },
    'wm01.c03':         { ar: 'الطريقة: {m}', en: 'Method: {m}' },
    'wm01.c04':         { ar: 'المبلغ المطلوب', en: 'Amount to collect' },
    'wm01.c05.card':    { ar: 'خذ المبلغ على جهاز الدفع', en: 'Take the payment on the card terminal' },
    'wm01.c05.more':    { ar: 'سيدفع بـ {amount} — أعطِه باقيًا {change}', en: 'Paying with {amount} — give back {change} change' },
    'wm01.c05.equal':   { ar: 'سيدفع بالمبلغ المطابق — لا يوجد باقٍ', en: 'Paying the exact amount — no change' },
    'wm01.c05.none':    { ar: 'لم يحدّد الضيف المبلغ مسبقًا — أعطِه الباقي مما يدفعه', en: 'The guest did not state an amount in advance — give change from what they pay' },
    'wm01.c06':         { ar: 'اضغط فقط بعد أن يستلم الضيف الطلب وتستلم المبلغ', en: 'Tap only after the guest has the order and you have the payment' },
    'wm01.b02':         { ar: 'سلّمتُ الطلب واستلمتُ المبلغ', en: 'Handed over and payment taken' }
  });

  var D = { mounted: false };

  function me() { return Session.me(); }

  /* Double-tap guard: a second tap on the SAME control within 300 ms is ignored. */
  var tapAt = {};
  function tapOk(key) {
    var now = Date.now();
    key = key || '';
    if (tapAt[key] && now - tapAt[key] < 300) return false;
    tapAt[key] = now;
    return true;
  }

  function announceStatus(o) {
    App.announce(t('w02.sr.status', { no: o.orderNo, label: t('w.status.' + o.status) }));
  }

  /* The order left this phone: say why on W-01 and go there. */
  function leaveFor(kind, o) {
    Feed.addNotice(kind, o, D.orderNo);
    D.mounted = false;
    App.toList(D.fromList);
  }

  /* Apply what the server says about this order, whatever the route. */
  function apply(o) {
    var kind = W.classify(o, me());
    if (kind === 'active') {
      if (D.order && o.status !== D.order.status) {
        var row = W.logFor(o, o.status);
        if (!row || row.staffId !== me()) D.deskChanged = true;
        announceStatus(o);
      }
      D.order = o;
      D.stale = false;
      draw();
      return;
    }
    if (kind === 'deliveredByMe' || kind === 'deskDelivered') {
      /* Delivered while on this screen by someone else: back to the list with
         the notice. Opened directly (reload, link) or delivered by me: the
         read-only delivered record. */
      if (kind === 'deskDelivered' && D.order && W.isActive(D.order.status)) { leaveFor(kind, o); return; }
      if (App.Modal.isOpen()) App.Modal.drop();
      D.order = o;
      D.done = kind;
      D.stale = false;
      draw();
      return;
    }
    leaveFor(kind, o);
  }

  function check() {
    if (!D.mounted) return;
    var g = ++D.gen;
    Server.order(D.orderNo).then(function (o) {
      if (!D.mounted || g !== D.gen) return;
      apply(o);
    }, function () {
      if (!D.mounted || g !== D.gen) return;
      if (!D.order) { D.loadFail = true; draw(); return; }
      D.stale = true;
      draw();
    });
  }

  /* ------------------------------------------------------------------ *
   * The primary action
   * ------------------------------------------------------------------ */
  function primary() {
    if (!tapOk('B02') || D.busy || !D.order || D.done) return;
    var st = D.order.status;
    if (st === 'OnTheWay') {                 /* sends nothing: WM-01 decides */
      App.Modal.open('WM-01', { order: D.order });
      return;
    }
    if (st !== 'Accepted') return;
    D.busy = true;
    D.actionErr = false;
    D.gen++;
    draw();
    Server.move(D.order.orderNo, 'OnTheWay', me()).then(function (res) {
      if (!D.mounted) return;
      D.busy = false;
      var o = res && res.order;
      if (o && o.assignedTo === me() && o.status === 'OnTheWay' && (res.ok || res.error === 'stale')) {
        D.order = o;                          /* success, or the desk had already done it */
        D.deskChanged = !res.ok;
        announceStatus(o);
        draw();
        return;
      }
      if (res && (res.error === 'notMine' || res.error === 'notFound' || (o && !W.isActive(o.status)))) {
        apply(o || null);
        return;
      }
      D.actionErr = true;
      draw();
    }, function () {
      if (!D.mounted) return;
      D.busy = false;
      D.actionErr = true;                      /* nothing assumed */
      draw();
    });
  }

  /* ------------------------------------------------------------------ *
   * Draw
   * ------------------------------------------------------------------ */
  function header() {
    return '<div class="s-top"><header class="s-header" data-el="W-02-S01">' +
             '<span class="s-header__side">' +
               '<button type="button" class="iconbtn" data-el="W-02-B01" aria-label="' + esc(t('w.back')) + '">' +
                 '<span class="iconbtn__glyph chev" aria-hidden="true">›</span></button>' +
             '</span>' +
             '<h1 class="s-header__title s-header__title--center" data-el="W-02-C01">' + t('w02.c01') + '</h1>' +
             '<span class="s-header__side"></span>' +
           '</header></div>';
  }

  function backButton() {
    return '<button type="button" class="btn btn--ghost s-back-btn" data-el="W-02-B03">' + t('w02.b03') + '</button>';
  }

  function payLines(o) {
    var pc = W.payCase(o);
    var collect = '<p class="s-pay__collect">' + t('w02.c10.collect', { total: money(o.total) }) + '</p>';
    if (pc.kind === 'card') return '<p class="s-pay__line">' + t('w02.c10.card') + '</p>' + collect;
    var third;
    if (pc.kind === 'cashMore') third = '<b>' + t('w02.c10.more', { amount: money(pc.amount), change: money(pc.change) }) + '</b>';
    else if (pc.kind === 'cashEqual') third = t('w02.c10.equal');
    else third = t('w02.c10.none');
    return '<p class="s-pay__line">' + t('w02.c10.cash') + '</p>' + collect +
           '<p class="s-pay__line w-change" data-case="' + pc.kind + '">' + third + '</p>';
  }

  /* The guest's mobile, one tap to call (design rule 8). Stored normalised
     ("+" then 8–15 digits); anything else is plain text, never a link. */
  function phoneBlock(o) {
    var phone = String(o.phone == null ? '' : o.phone).trim();
    if (!phone) return '';
    var value = /^\+[0-9]{8,15}$/.test(phone)
      ? '<a class="s-phone__link" data-el="W-02-B04" href="tel:' + esc(phone) + '" dir="ltr" ' +
          'aria-label="' + esc(t('w02.sr.call', { phone: W.spaced(phone) })) + '">' + esc(phone) + '</a>'
      : '<span class="s-phone__link" dir="ltr">' + esc(phone) + '</span>';
    return '<div class="s-phone" data-el="W-02-C08">' +
             '<span class="s-phone__label">' + t('w02.c05') + '</span>' + value + '</div>';
  }

  function draw() {
    if (!D.mounted) return;
    var h = '<div class="s-screen s-order w-order">' + header();
    var bar = '';

    if (D.loadFail && !D.order) {
      h += '<main class="s-col"><div class="s-empty" data-el="W-02-C19">' +
             '<span class="s-icon-circle" aria-hidden="true">!</span>' +
             '<p class="s-empty__l1">' + t('w02.c16.l1') + '</p>' +
             '<p class="s-empty__l3">' + t('w02.c16.l2') + '</p></div></main>';
      bar = backButton();
    } else if (!D.order) {
      h += '<main class="s-col s-detail" data-el="W-02-S02" aria-hidden="true">' +
             '<div class="s-skel s-skel--line"></div>' +
             '<div class="s-skel s-skel--head" style="margin-top:8px"></div>' +
             '<div class="s-skel s-skel--room" style="margin-top:16px"></div>' +
             '<div class="s-skel s-skel--row" style="margin-top:24px"></div>' +
             '<div class="s-skel s-skel--row" style="margin-top:8px"></div>' +
           '</main>';
      bar = backButton();
    } else {
      var o = D.order, now = Date.now(), st = o.status, qty = W.itemQty(o);
      h += '<main class="s-col s-detail" data-el="W-02-S02">';
      if (D.deskChanged && !D.done) h += '<p class="s-line s-line--boxed" data-el="W-02-C03" style="margin-bottom:16px">' + t('w02.c14') + '</p>';
      if (D.stale && !D.done) h += '<p class="s-line" data-el="W-02-C06" role="status" style="margin-bottom:8px">' + t('w02.c15') + '</p>';
      h += '<div class="s-idline" data-el="W-02-C04"><span>' +
             t('w.orderno', { no: '<span class="num">' + esc(o.orderNo) + '</span>' }) + '</span>' +
             '<span>' + W.duration(now - (o.createdAt || now)) + '</span></div>';
      h += '<p class="s-status" data-el="W-02-C05" style="margin-top:8px">' + t('w.status.' + st) + '</p>';
      h += '<div class="s-roomblock" data-el="W-02-C07" style="margin-top:16px" ' +
             'aria-label="' + esc(t('w.room') + ' ' + W.spaced(o.roomNumber)) + '">' +
             '<span class="s-roomblock__word" aria-hidden="true">' + t('w.room') + '</span>' +
             '<span class="s-roomno s-roomblock__no" aria-hidden="true">' + esc(o.roomNumber) + '</span></div>';
      h += phoneBlock(o);

      h += '<section class="s-sec" data-el="W-02-S03">' +
             '<h2 class="s-sec__title" data-el="W-02-C09">' + t('w02.c06', { count: W.countWord(qty) }) + '</h2><ul>';
      for (var i = 0; i < o.lines.length; i++) {
        var l = o.lines[i];
        h += '<li class="s-item" data-el="W-02-C10" aria-label="' + esc(t('w02.sr.item', { n: l.qty, name: W.lineName(l) })) + '">' +
               '<span class="s-item__qty" aria-hidden="true">' + t('w02.c07.qty', { n: esc(l.qty) }) + '</span>' +
               '<span class="s-item__name" aria-hidden="true">' + esc(W.lineName(l)) + '</span></li>';
      }
      h += '</ul><div class="s-items-total" data-el="W-02-C11"><span>' + W.countWord(qty) + '</span>' +
             '<span class="s-items-total__sum">' + money(o.total) + '</span></div></section>';

      if (W.hasNotes(o)) {
        h += '<section class="s-sec s-notes" data-el="W-02-C12">' +
               '<h2 class="s-sec__title" style="margin-bottom:4px">' + t('w02.c09') + '</h2>' +
               '<p class="s-notes__text">' + esc(o.notes) + '</p></section>';
      }

      h += '<section class="s-sec" data-el="W-02-C13"><h2 class="s-sec__title" style="margin-bottom:4px">' +
             t('w02.c10') + '</h2>' + payLines(o) + '</section>';

      if (D.done) {
        h += '<p class="s-sec s-record w-record" data-el="W-02-C16">' + t(D.done === 'deskDelivered' ? 'w02.c12.desk' : 'w02.c12') + '</p>';
      } else {
        h += '<p class="s-sec w-hint" data-el="W-02-C14">' + t('w02.c11') + '</p>';
      }
      h += '</main>';

      if (D.done) {
        bar = backButton();
      } else {
        if (D.actionErr) bar += '<p class="error" data-el="W-02-C17" role="alert">' + t('w.actionfail') + '</p>';
        if (D.busy) {
          bar += '<button type="button" class="btn btn--primary s-primary" data-el="W-02-B02" disabled aria-disabled="true">' +
                   '<span class="s-primary__l1">' + t('w.sending') + '</span></button>';
        } else {
          var l2 = st === 'OnTheWay' ? t('w02.b02.opens') : t('w.after', { label: t('w.status.OnTheWay') });
          bar += '<button type="button" class="btn btn--primary s-primary" data-el="W-02-B02" data-status="' + st + '">' +
                   '<span class="s-primary__l1">' + t('w02.b02.' + st) + '</span>' +
                   '<span class="s-primary__l2">' + l2 + '</span></button>';
        }
      }
    }

    h += '<div class="s-bar" data-el="W-02-S04">' + bar + '</div></div>';
    var root = App.paint(h);
    var main = root.querySelector('.s-detail');
    var barEl = root.querySelector('.s-bar');
    if (main && barEl) main.style.paddingBottom = (barEl.offsetHeight + 16) + 'px';

    root.querySelector('[data-el="W-02-B01"]').addEventListener('click', goList);
    var b03 = root.querySelector('[data-el="W-02-B03"]');
    if (b03) b03.addEventListener('click', goList);
    var b02 = root.querySelector('[data-el="W-02-B02"]');
    if (b02) b02.addEventListener('click', primary);
  }

  function goList() {
    if (!tapOk('back')) return;
    D.mounted = false;
    App.toList(D.fromList);
  }

  /* ------------------------------------------------------------------ *
   * View contract
   * ------------------------------------------------------------------ */
  Views['W-02'] = {
    enter: function (params, ctx) {
      D = {
        mounted: true, orderNo: String(params.orderNo), order: null, fromList: !!ctx.fromList,
        busy: false, actionErr: false, deskChanged: false, stale: false, done: null,
        loadFail: false, gen: 0, lastTick: 0
      };
      /* From a W-01 card: drawn on the first frame from the Feed, no skeleton. */
      D.order = Feed.find(D.orderNo);
      window.scrollTo(0, 0);
      draw();
      check();
    },

    leave: function () { D.mounted = false; D.gen++; },

    draw: draw,

    /* Every Feed response: the order is still mine and active → redraw in
       place; otherwise ask the server what became of it (apply). Held while
       this phone's own request is in flight — its answer decides. */
    onFeed: function () {
      if (!D.mounted || D.busy || D.done) return;
      if (App.Modal.isOpen() && App.Modal.cur.busy) return;
      var f = Feed.find(D.orderNo);
      if (f) { apply(f); if (App.Modal.isOpen()) App.Modal.draw(false); return; }
      if (Feed.failed) { if (D.order) { D.stale = true; draw(); } return; }
      check();
    },

    onModalOutcome: function (id, outcome, order) {
      if (!D.mounted) return;
      if (outcome === 'delivered') {
        D.order = order;
        D.done = W.classify(order, me()) === 'deskDelivered' ? 'deskDelivered' : 'deliveredByMe';
        D.deskChanged = false;
        announceStatus(order);
        draw();
        return;
      }
      if (outcome === 'gone') { apply(order); return; }
      draw();
      check();
    },

    tick: function (now) {
      if (!D.mounted) return;
      if (!D.lastTick) { D.lastTick = now; return; }
      if (now - D.lastTick >= 30000) { D.lastTick = now; if (!App.Modal.isOpen()) draw(); }
    }
  };

  /* ================================================================== *
   * WM-01 — Confirm delivery and payment (the desk's SM-02, on the phone)
   * ================================================================== */
  var M = {};

  function c02Html() {
    var o = M.order, pc = W.payCase(o);
    var method = '<b>' + t(pc.kind === 'card' ? 'w.pay.card' : 'w.pay.cash') + '</b>';
    var instr;
    if (pc.kind === 'card') instr = t('wm01.c05.card');
    else if (pc.kind === 'cashMore') instr = t('wm01.c05.more', {
      amount: '<b>' + money(pc.amount) + '</b>',
      change: '<b>' + money(pc.change) + '</b>'
    });
    else if (pc.kind === 'cashEqual') instr = t('wm01.c05.equal');
    else instr = t('wm01.c05.none');
    var busy = M.busy;

    return '<div class="sheet s-sheet" data-el="WM-01-S02" role="dialog" aria-modal="true" aria-labelledby="sm02-title">' +
      '<div class="s-sheet__scroll">' +
        '<h2 id="sm02-title" class="s-sheet__title" data-el="WM-01-C01" tabindex="-1" data-title>' + t('wm01.c01') + '</h2>' +
        '<div class="s-sheet__room" data-el="WM-01-C02" aria-label="' + esc(t('w.room') + ' ' + W.spaced(o.roomNumber)) + '">' +
          '<span class="s-roomblock__word" aria-hidden="true">' + t('w.room') + '</span>' +
          '<span class="s-roomno s-sheet__roomno" aria-hidden="true">' + esc(o.roomNumber) + '</span>' +
        '</div>' +
        '<p class="s-method" data-el="WM-01-C03">' + t('wm01.c03', { m: method }) + '</p>' +
        '<div class="s-collect" data-el="WM-01-C04">' +
          '<p class="s-collect__label">' + t('wm01.c04') + '</p>' +
          '<p class="s-collect__value">' + money(o.total) + '</p>' +
        '</div>' +
        '<p class="s-instruction" data-el="WM-01-C05">' + instr + '</p>' +
        '<p class="s-line s-line--boxed w-sheet-hint" data-el="WM-01-C08">' + t('w02.c11') + '</p>' +
        '<p class="s-consequence" data-el="WM-01-C06">' + t('wm01.c06') + '</p>' +
      '</div>' +
      '<div class="s-sheet__foot" data-el="WM-01-S03">' +
        (M.failed && !busy ? '<p class="error" data-el="WM-01-C07" role="alert">' + t('w.actionfail') + '</p>' : '') +
        '<button type="button" class="btn btn--ghost" data-el="WM-01-B01"' + (busy ? ' disabled aria-disabled="true"' : '') + '>' + t('w.back') + '</button>' +
        '<button type="button" class="btn btn--primary s-primary" data-el="WM-01-B02"' + (busy ? ' disabled aria-disabled="true"' : '') + '>' +
          (busy
            ? '<span class="s-primary__l1">' + t('w.sending') + '</span>'
            : '<span class="s-primary__l1">' + t('wm01.b02') + '</span>' +
              '<span class="s-primary__l2">' + t('w.after', { label: t('w.status.Delivered') }) + '</span>') +
        '</button>' +
      '</div>' +
    '</div>';
  }

  function c02Redraw() {
    if (!App.Modal.isOpen() || App.Modal.cur.id !== 'WM-01') return;
    App.Modal.draw(false);
  }

  function c02Confirm() {
    var Modal = App.Modal;
    if (!Modal.armed() || M.busy) return;
    var now = Date.now();
    if (now - M.tapAt < 300) return;
    M.tapAt = now;
    M.busy = true;
    M.failed = false;
    Modal.setBusy(true);
    c02Redraw();
    Server.move(M.order.orderNo, 'Delivered', me()).then(function (res) {
      if (!Modal.isOpen() || Modal.cur.id !== 'WM-01') return;
      M.busy = false;
      Modal.setBusy(false);
      var o = res && res.order;
      /* Any Delivered answer for my order is "delivered", whoever recorded it. */
      if (o && o.status === 'Delivered' && o.assignedTo === me() && (res.ok || res.error === 'stale')) {
        Modal.finish('delivered', o);
        return;
      }
      if (res && (res.error === 'notMine' || res.error === 'notFound' || (o && o.status === 'Cancelled'))) {
        Modal.finish('gone', o || null, true);   /* W-02 goes back to W-01 */
        return;
      }
      M.failed = true;
      c02Redraw();
    }, function () {
      if (!Modal.isOpen() || Modal.cur.id !== 'WM-01') return;
      M.busy = false;
      Modal.setBusy(false);
      M.failed = true;
      c02Redraw();
    });
  }

  Modals['WM-01'] = {
    init: function (params) {
      M = { order: params.order, busy: false, failed: false, tapAt: 0 };
    },
    html: function () {
      /* Redrawn from the latest order this screen knows (a Feed update). */
      if (D.order && String(D.order.orderNo) === String(M.order.orderNo)) M.order = D.order;
      return c02Html();
    },
    bind: function (sheet) {
      sheet.querySelector('[data-el="WM-01-B01"]').addEventListener('click', function () { App.Modal.dismiss(); });
      sheet.querySelector('[data-el="WM-01-B02"]').addEventListener('click', c02Confirm);
    }
  };
})();

</script>
<script>App.start();</script>
</body>
