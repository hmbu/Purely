    /* Screen reader only (§7.7). */
    's01.sr.card':    { ar: 'غرفة {room}، طلب رقم {no}، {count}، {total}، {chips}', en: 'Room {room}, order {no}, {count}, {total}, {chips}' },
    's01.sr.new':     { ar: '{n} طلبات جديدة', en: '{n} new orders' }
  });

  var REFRESH_MS = 15000;
  var MARK_MS = 60 * 1000;           /* C08 stays in place for 60 s (§5.7) */
  var DARK_MS = 2 * 60 * 1000;       /* C02 turns dark after 2 min (§5.5 rule 7) */
  var ACTIVE = ['New', 'Accepted', 'OnTheWay'];
  var STATUSES = ['New', 'Accepted', 'OnTheWay', 'Delivered', 'Cancelled'];

  /* Board state. Survives a visit to S-02 (page memory), reset at sign-in. */
  var B = {
    mounted: false, timer: null, inFlight: false, again: false, gen: 0,
    orders: null,      // last successful response (null: none yet)
    everOk: false,     // any success since sign-in / load (§6.3)
    failed: false,     // the most recent attempt failed
    lastOk: 0,
    retrying: false,   // B07 tapped: loading state until the answer
    marks: {},         // orderNo -> { until, group } guest-cancelled cards (C08)
    prevActive: null,  // orderNo -> status at the previous success
    touching: false, dirty: false,
    lastPaint: 0, expiredShown: false, lastNewCount: null, tapAt: 0
  };

  function resetData() {
    B.orders = null; B.everOk = false; B.failed = false; B.lastOk = 0;
    B.marks = {}; B.prevActive = null; B.lastNewCount = null;
    App.state.lastBoard = null;
  }

  /* ------------------------------------------------------------------ *
   * Requests — one on open, then every 15 s from the end of the previous
   * attempt; never two in flight; paused while hidden (§5.5, §7.4).
   * ------------------------------------------------------------------ */
  function request() {
    if (!B.mounted) return;
    if (B.inFlight) { B.again = true; return; }
    clearTimeout(B.timer);
    B.inFlight = true;
    var g = ++B.gen;
    Server.board().then(function (list) {
      if (g !== B.gen) return;
      B.inFlight = false;
      onSuccess(list || []);
      after();
    }, function () {
      if (g !== B.gen) return;
      B.inFlight = false;
      B.failed = true;
      B.retrying = false;
      paint();
      after();
    });
  }

  function after() {
    if (B.again) { B.again = false; request(); return; }
    schedule();
  }

  function schedule() {
    clearTimeout(B.timer);
    B.timer = setTimeout(function () {
      if (!B.mounted) return;
      if (document.hidden) { B.hiddenPending = true; return; }
      request();
    }, REFRESH_MS);
  }

  function newList(orders) {
    var out = [];
    for (var i = 0; i < orders.length; i++) {
      if (orders[i].status === 'New') out.push({ orderNo: orders[i].orderNo, createdAt: orders[i].createdAt });
    }
    return out;
  }

  function onSuccess(list) {
    var now = Date.now(), i, o;
    var valid = [];
    for (i = 0; i < list.length; i++) {
      if (list[i] && STATUSES.indexOf(list[i].status) !== -1) valid.push(list[i]);   /* §7.1: skip a sixth status */
    }

    /* §5.7 — a card the guest cancelled since the previous refresh stays in
       place, marked, for 60 s; an expired mark lets it leave now. */
    for (var no in B.marks) {
      if (B.marks.hasOwnProperty(no) && now >= B.marks[no].until) delete B.marks[no];
    }
    if (B.prevActive) {
      for (i = 0; i < valid.length; i++) {
        o = valid[i];
        if (o.status === 'Cancelled' && o.cancelledByGuest && B.prevActive[o.orderNo] && !B.marks[o.orderNo]) {
          B.marks[o.orderNo] = { until: now + MARK_MS, group: B.prevActive[o.orderNo] };
        }
      }
    }
    var prev = {};
    for (i = 0; i < valid.length; i++) if (S.isActiveStatus(valid[i].status)) prev[valid[i].orderNo] = valid[i].status;
    B.prevActive = prev;

    B.orders = valid;
    App.state.lastBoard = valid;
    B.everOk = true;
    B.failed = false;
    B.retrying = false;
    B.lastOk = now;

    var news = newList(valid);
    Alert.observe(news);                                   /* §5.6 rules 2–3 */
    if (B.lastNewCount !== null && news.length > B.lastNewCount) {
      App.announce(t('s01.sr.new', { n: news.length }));
    }
    B.lastNewCount = news.length;
    paint();
  }

  /* §5.3 / §7.5 — nothing moves under a finger: a repaint that arrives
     during a touch is applied when the touch ends. */
  function paint() {
    if (!B.mounted) return;
    if (B.touching) { B.dirty = true; return; }
    draw();
  }

  /* ------------------------------------------------------------------ *
   * Lists
   * ------------------------------------------------------------------ */
  function byCreatedAsc(a, b) { return (a.createdAt || 0) - (b.createdAt || 0) || Number(a.orderNo) - Number(b.orderNo); }

  function computeLists() {
    var now = Date.now(), dayStart = S.hotelDayStart(now);
    var groups = { New: [], Accepted: [], OnTheWay: [] }, done = [], activeCount = 0;
    var orders = B.orders || [];
    for (var i = 0; i < orders.length; i++) {
      var o = orders[i], mark = B.marks[o.orderNo];
      if (S.isActiveStatus(o.status)) { groups[o.status].push(o); activeCount++; continue; }
      if (mark) { groups[mark.group].push(o); continue; }
      if (S.finalAt(o) >= dayStart) done.push(o);
    }
    for (var g in groups) if (groups.hasOwnProperty(g)) groups[g].sort(byCreatedAsc);
    done.sort(function (a, b) { return S.finalAt(b) - S.finalAt(a); });
    if (done.length > 50) done = done.slice(0, 50);
    return { groups: groups, done: done, activeCount: activeCount };
  }

  /* ------------------------------------------------------------------ *
   * Card (C04 with C05–C08)
   * ------------------------------------------------------------------ */
  function payChip(o) {
    var pc = S.payCase(o);
    if (pc.kind === 'card') return t('s01.c06.card');
    if (pc.kind === 'cashMore') return t('s01.c06.change', { money: money(pc.change) });
    if (pc.kind === 'cashEqual') return t('s01.c06.exact');
    return t('s01.c06.cash');
  }

  function stripTags(s) { return String(s).replace(/<[^>]*>/g, ''); }

  function card(o, doneTab, now) {
    var marked = !doneTab && !!B.marks[o.orderNo];
    var room = esc(o.roomNumber);
    var count = S.countWord(S.itemQty(o));
    var total = money(o.total);
    var chips = [], chipsHtml = '';
    if (!marked) {
      if (!doneTab && Alert.isLate(o, now)) {
        chips.push(t('s01.c05'));
        chipsHtml += '<span class="s-chip s-chip--late" data-el="S-01-C05">' + t('s01.c05') + '</span>';
      }
      var pay = payChip(o);
      chips.push(stripTags(pay));
      chipsHtml += '<span class="s-chip" data-el="S-01-C06">' + pay + '</span>';
      if (S.hasNotes(o)) {
        chips.push(t('s01.c07'));
        chipsHtml += '<span class="s-chip" data-el="S-01-C07">' + t('s01.c07') + '</span>';
      }
    } else {
      chips.push(t('s01.c08'));
    }
    var aria = t('s01.sr.card', {
      room: esc(S.spaced(o.roomNumber)), no: esc(o.orderNo), count: count,
      total: total, chips: chips.join('، ')
    });
    return '<button type="button" class="s-card' + (marked ? ' s-card--gone' : '') + '" data-el="S-01-C04"' +
             ' data-order="' + esc(o.orderNo) + '" aria-label="' + esc(aria) + '">' +
             '<span class="s-card__top">' +
               '<span class="s-card__room"><span class="s-card__roomword">' + t('st.room') + '</span>' +
               '<span class="s-roomno s-card__roomno">' + room + '</span></span>' +
               '<span class="s-card__elapsed">' + S.duration(now - (o.createdAt || now)) + '</span>' +
             '</span>' +
             '<span class="s-card__meta"><span>' + t('st.orderno', { no: '<span class="num">' + esc(o.orderNo) + '</span>' }) + '</span>' +
               (doneTab ? '<span class="s-card__status">' + t('st.status.' + o.status) + '</span>' : '') +
             '</span>' +
             '<span class="s-card__sum">' + t('s01.sum', { count: count, total: total }) + '</span>' +
             (marked
               ? '<span class="s-card__gone" data-el="S-01-C08">' + t('s01.c08') + '</span>'
               : '<span class="s-chips">' + chipsHtml + '</span>') +
           '</button>';
  }

  /* ------------------------------------------------------------------ *
   * Draw
   * ------------------------------------------------------------------ */
  function soundLabel() {
    var st = Chime.state();
    return t(st === 'on' ? 's01.b02.on' : (st === 'off' ? 's01.b02.off' : 's01.b02.blocked'));
  }

  function shiftName(sess) {
    var name = String((sess && sess.name) || '');
    return name.length > 18 ? name.slice(0, 18) + '…' : name;
  }

  function draw() {
    var now = Date.now();
    var sess = Session.current();
    var expired = !sess || Session.expired(sess);
    B.expiredShown = expired;
    B.lastPaint = now;
    B.dirty = false;

    var loading = !B.everOk && (B.orders === null) && (!B.failed || B.retrying);
    var coldError = !B.everOk && B.failed && !B.retrying;
    if (B.retrying && !B.everOk) { loading = true; coldError = false; }
    var lists = B.everOk ? computeLists() : null;
    var tab = App.state.tab === 'done' ? 'done' : 'active';
    var nActive = lists ? String(lists.activeCount) : '—';
    var nDone = lists ? String(lists.done.length) : '—';

    var h = '<div class="s-screen s-board">' +
      '<div class="s-top">' +
        '<header class="s-header" data-el="S-01-S01">' +
          '<span class="s-header__shift" data-el="S-01-C01">' +
            (expired ? t('s01.c01.ended') : t('s01.c01', { name: esc(shiftName(sess)) })) + '</span>' +
          '<button type="button" class="s-hbtn" data-el="S-01-B02">' + soundLabel() + '</button>' +
          '<button type="button" class="s-hbtn" data-el="S-01-B01" lang="' + I18N.other() + '">' + t('st.lang.other') + '</button>' +
          (expired ? '' : '<button type="button" class="s-hbtn s-hbtn--end" data-el="S-01-B03">' + t('s01.b03') + '</button>') +
        '</header>' +
        '<div class="s-tabs" role="tablist" data-el="S-01-S02">' +
          '<button type="button" role="tab" class="s-tab" data-el="S-01-B04" data-tab="active" aria-selected="' + (tab === 'active') + '"' + (coldError ? ' disabled' : '') + '>' +
            t('s01.b04', { n: '<span class="num">' + nActive + '</span>' }) + '</button>' +
          '<button type="button" role="tab" class="s-tab" data-el="S-01-B05" data-tab="done" aria-selected="' + (tab === 'done') + '"' + (coldError ? ' disabled' : '') + '>' +
            t('s01.b05', { n: '<span class="num">' + nDone + '</span>' }) + '</button>' +
        '</div>' +
      '</div>';

    if (expired) {
      h += '<div class="s-expired" data-el="S-01-C11" role="status">' +
             '<div class="s-expired__l1">' + t('s01.c11.l1') + '</div>' +
             '<div>' + t('s01.c11.l2') + '</div>' +
             '<button type="button" class="btn" data-el="S-01-B06">' + t('st.signin.continue') + '</button>' +
           '</div>';
    }

    if (B.everOk && B.failed) {
      var dark = now - B.lastOk >= DARK_MS;
      h += '<div class="s-stale' + (dark ? ' s-stale--dark' : '') + '" data-el="S-01-C02" role="status">' +
             t('s01.c02', { d: S.duration(now - B.lastOk, true) }) + '</div>';
    }

    h += '<main class="s-list" data-el="S-01-S03">';
    if (loading) {
      h += '<div class="s-cards" data-el="S-01-C12" aria-hidden="true">' +
             '<div class="s-skel s-skel--card"></div><div class="s-skel s-skel--card"></div>' +
             '<div class="s-skel s-skel--card"></div><div class="s-skel s-skel--card"></div></div>';
    } else if (coldError) {
      h += '<div class="s-empty">' +
             '<div data-el="S-01-C13">' +
               '<p class="s-empty__l1">' + t('s01.c13.l1') + '</p>' +
               '<p class="s-empty__l2" style="margin-block-start:8px">' + t('s01.c13.l2') + '</p>' +
               '<p class="s-empty__l3" style="margin-block-start:8px">' + t('s01.c13.l3') + '</p>' +
             '</div>' +
             '<button type="button" class="btn btn--ghost" data-el="S-01-B07">' + t('s01.b07') + '</button>' +
           '</div>';
    } else if (tab === 'active') {
      var any = false;
      for (var gi = 0; gi < ACTIVE.length; gi++) {
        var st = ACTIVE[gi], cards = lists.groups[st];
        if (!cards.length) continue;                          /* §5.3: empty group renders nothing */
        any = true;
        h += '<section class="s-group" data-group="' + st + '">' +
               '<h2 class="s-group__title" data-el="S-01-C03">' +
                 t('s01.c03', { label: t('st.status.' + st), n: '<span class="num">' + cards.length + '</span>' }) + '</h2>' +
               '<div class="s-cards">';
        for (var ci = 0; ci < cards.length; ci++) h += card(cards[ci], false, now);
        h += '</div></section>';
      }
      if (!any) {
        h += '<div class="s-empty" data-el="S-01-C09">' +
               '<p class="s-empty__l1">' + t('s01.c09.l1') + '</p>' +
               '<p class="s-empty__l2">' + t('s01.c09.l2') + '</p>' +
               (Chime.soundOn() ? '' : '<p class="s-empty__l3">' + t('s01.c09.l3') + '</p>') +
             '</div>';
      }
    } else {
      if (!lists.done.length) {
        h += '<div class="s-empty" data-el="S-01-C10">' +
               '<p class="s-empty__l1">' + t('s01.c10.l1') + '</p>' +
               '<p class="s-empty__l2">' + t('s01.c10.l2') + '</p>' +
             '</div>';
      } else {
        h += '<div class="s-cards">';
        for (var di = 0; di < lists.done.length; di++) h += card(lists.done[di], true, now);
        h += '</div>';
      }
    }
    h += '</main></div>';

    var root = App.paint(h);
    bind(root);
  }

  function debounced() {
    var now = Date.now();
    if (now - B.tapAt < 300) return false;
    B.tapAt = now;
    return true;
  }

  function bind(root) {
    root.querySelector('[data-el="S-01-B01"]').addEventListener('click', function () {
      if (!debounced()) return;
      S.Lang.toggle();
    });
    root.querySelector('[data-el="S-01-B02"]').addEventListener('click', function () {
      if (!debounced()) return;
      var st = Chime.state();
      if (st === 'on') {
        Chime.setSound(false);
      } else {
        /* Turning it on — or re-enabling a refused one — plays one chime. */
        Chime.setSound(true);
        Chime.refused = false;
        Chime.arm(true);
        Chime.play();
      }
      draw();
    });
    var b03 = root.querySelector('[data-el="S-01-B03"]');
    if (b03) b03.addEventListener('click', function () {
      if (!debounced()) return;
      App.state.returnTarget = null;
      Session.end();                                   /* no confirmation (map §4 decision 3) */
      App.replace('/sign-in', {});
    });
    var b06 = root.querySelector('[data-el="S-01-B06"]');
    if (b06) b06.addEventListener('click', function () {
      if (!debounced()) return;
      App.state.scroll = window.scrollY;
      App.signIn({ view: 'S-01' });
    });
    var b07 = root.querySelector('[data-el="S-01-B07"]');
    if (b07) b07.addEventListener('click', function () {
      if (!debounced()) return;
      B.retrying = true;
      draw();
      if (B.inFlight) { B.gen++; B.inFlight = false; }
      request();
    });
    var tabs = root.querySelectorAll('.s-tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function (e) {
        if (!debounced()) return;
        App.state.tab = e.currentTarget.getAttribute('data-tab');
        draw();                                          /* no request (§5.5 rule 4) */
        window.scrollTo(0, 0);
      });
    }
    var cards = root.querySelectorAll('[data-el="S-01-C04"]');
    for (var c = 0; c < cards.length; c++) {
      cards[c].addEventListener('click', function (e) {
        if (!debounced()) return;
        var no = e.currentTarget.getAttribute('data-order');
        App.state.scroll = window.scrollY;
        App.go('/order/' + encodeURIComponent(no), { fromBoard: true, order: findOrder(no) });
      });
    }
  }

  function findOrder(no) {
    var list = B.orders || [];
    for (var i = 0; i < list.length; i++) if (String(list[i].orderNo) === String(no)) return list[i];
    return null;
  }

  /* Touch tracking for the "never under a finger" rule. */
  function touchStart(e) {
    if (!B.mounted) return;
    if (e.target && e.target.closest && e.target.closest('.s-list')) B.touching = true;
  }
  function touchEnd() {
    if (!B.touching) return;
    B.touching = false;
    /* After the click that the touch may produce, so the tapped card is
       still there to receive it. */
    setTimeout(function () { if (B.mounted && B.dirty && !B.touching) draw(); }, 60);
  }
  document.addEventListener('pointerdown', touchStart, true);
  document.addEventListener('pointerup', touchEnd, true);
  document.addEventListener('pointercancel', touchEnd, true);

  /* ------------------------------------------------------------------ *
   * View contract
   * ------------------------------------------------------------------ */
  Views['S-01'] = {
    enter: function (params, ctx) {
      B.mounted = true;
      B.touching = false;
      if (ctx.freshBoard) {
        resetData();
        App.state.tab = 'active';
        App.state.scroll = 0;
      }
      if (ctx.newBaseline) Alert.resetBaseline();
      draw();
      window.scrollTo(0, ctx.freshBoard ? 0 : App.state.scroll);
      request();                                       /* one immediate request */
    },

    leave: function () {
      App.state.scroll = window.scrollY;
      B.mounted = false;
      B.gen++;
      B.inFlight = false;
      B.again = false;
      clearTimeout(B.timer);
    },

    draw: draw,

    onData: function () {
      if (!document.hidden) request();
    },

    onVisibility: function (visible) {
      if (!visible) return;
      Alert.resetBaseline();                           /* §5.6 rule 3 */
      B.hiddenPending = false;
      request();
    },

    tick: function (now) {
      if (!B.mounted) return;
      if (B.everOk && B.orders) Alert.tick(newList(B.orders), now);   /* §5.6 rule 4 */
      var sess = Session.current();
      var expired = !sess || Session.expired(sess);
      if (expired !== B.expiredShown) { paint(); return; }
      if (now - B.lastPaint >= 30000) paint();        /* durations, Late, C02 */
    }
  };
})();

</script>
<script>
/* staff/js/order.js */
/* staff/js/order.js — S-02 Order detail (تفاصيل الطلب).
   Spec: /spec/staff/screens/S-02.md. The only screen that changes an order:
   accept, on the way, delivered (through SM-02) and cancel (through SM-01).
   Every status change is one step forward through HotelDB.setStatus, which
   refuses a stale step — the cancellation race is decided there (§5.7). */
(function () {
  'use strict';

  var S = window.Staff;
  var Server = S.Server, Session = S.Session;

  I18N.register({
    's02.c01':          { ar: 'تفاصيل الطلب', en: 'Order detail' },
    's02.c02.g1':       { ar: 'ألغى الضيف هذا الطلب', en: 'The guest cancelled this order' },
    's02.c02.h1':       { ar: 'أُلغي هذا الطلب من جهاز آخر', en: 'This order was cancelled on another device' },
    's02.c02.l2':       { ar: 'لا تُحضّره ولا تتوجّه إلى الغرفة.', en: 'Do not prepare it and do not go to the room.' },
    's02.c03':          { ar: 'تغيّرت حالة هذا الطلب من جهاز آخر', en: "This order's status was changed on another device" },
    's02.c06':          { ar: 'تعذّر تحديث هذا الطلب — هذه آخر حالة معروفة', en: 'Could not refresh this order — this is the last known status' },
    's02.c08':          { ar: 'ما يجب تجهيزه — {count}', en: 'To prepare — {count}' },
    's02.c09.qty':      { ar: '×{n}', en: '×{n}' },
    's02.c11':          { ar: 'ملاحظات الضيف', en: 'Guest notes' },
    's02.c12':          { ar: 'الدفع عند الاستلام', en: 'Pay on delivery' },
    's02.c12.card':     { ar: 'الطريقة: بطاقة — أحضر جهاز الدفع', en: 'Method: Card — bring the card terminal' },
    's02.c12.cash':     { ar: 'الطريقة: نقدًا', en: 'Method: Cash' },
    's02.c12.collect':  { ar: 'المبلغ المطلوب: {total}', en: 'Amount to collect: {total}' },
    's02.c12.more':     { ar: 'سيدفع بـ {amount} — أحضر باقي {change}', en: 'Paying with {amount} — bring {change} change' },
    's02.c12.equal':    { ar: 'سيدفع بالمبلغ المطابق — لا يوجد باقٍ', en: 'Paying the exact amount — no change' },
    's02.c12.none':     { ar: 'لم يحدّد الضيف المبلغ — احمل باقيًا كافيًا', en: 'The guest did not state an amount — carry enough change' },
    's02.c13.guest':    { ar: 'ألغى الضيف هذا الطلب', en: 'The guest cancelled this order' },
    's02.c13.hotel':    { ar: 'ألغاه {name}: {reason}', en: 'Cancelled by {name}: {reason}' },
    's02.c14':          { ar: 'تم تسجيل التوصيل والدفع', en: 'Delivery and payment recorded' },
    's02.b03':          { ar: 'إلغاء الطلب', en: 'Cancel order' },
    's02.c15':          { ar: 'لم يصل التحديث إلى النظام — حاول مرة أخرى', en: 'The update did not reach the system — try again' },
    's02.c16':          { ar: 'بقبولك لن يستطيع الضيف إلغاء الطلب', en: 'Once you accept, the guest can no longer cancel it' },
    's02.b02.New':      { ar: 'قبول الطلب', en: 'Accept order' },
    's02.b02.Accepted': { ar: 'خرجت بالطلب', en: 'Heading out with the order' },
    's02.b02.OnTheWay': { ar: 'تم التوصيل والدفع', en: 'Delivered and paid' },
    'st.after':         { ar: 'الحالة بعد الضغط: {label}', en: 'Status after tapping: {label}' },
    's02.b02.opens':    { ar: 'يفتح تأكيد الدفع', en: 'Opens the payment confirmation' },
    's02.b04':          { ar: 'العودة إلى اللوحة', en: 'Back to the board' },
    's02.c17':          { ar: 'انتهت مدة الجلسة — سجّل الدخول لتنفيذ أي إجراء', en: 'The session has expired — sign in to take any action' },
    's02.c18.l1':       { ar: 'لم نعثر على هذا الطلب', en: 'We could not find this order' },
    's02.c18.l2':       { ar: 'قد يكون رقم الطلب غير صحيح، أو لم يعد الطلب موجودًا لدى الفندق', en: "The order number may be wrong, or the order is no longer in the hotel's system" },
    's02.c18.l3':       { ar: 'ارجع إلى اللوحة وافتحه من هناك', en: 'Go back to the board and open it from there' },
    /* Screen reader only (§7.5). */
    's02.sr.status':    { ar: '{no}: {label}', en: '{no}: {label}' },
    's02.sr.item':      { ar: '{n} × {name}', en: '{n} × {name}' }
  });

  var REFRESH_MS = 10000;
  var STATUSES = ['New', 'Accepted', 'OnTheWay', 'Delivered', 'Cancelled'];

  var D = { mounted: false };

  /* §6.2 — an order missing any of these is unreadable. */
  function readable(o) {
    return !!(o && o.orderNo != null && o.createdAt && o.roomNumber != null && String(o.roomNumber) !== '' &&
      o.lines && o.lines.length && (o.payment === 'card' || o.payment === 'cash') &&
      o.total != null && isFinite(Number(o.total)) && STATUSES.indexOf(o.status) !== -1);
  }

  function isFinal() { return D.order && S.isFinalStatus(D.order.status); }
  function paused() { return D.busy || D.modal || D.error; }

  /* ------------------------------------------------------------------ *
   * Refresh — one on open, then every 10 s from the end of the previous
   * attempt; paused while hidden, while a sheet is open and while an action
   * is in flight; stopped at Delivered, Cancelled and in the error state.
   * ------------------------------------------------------------------ */
  function request() {
    if (!D.mounted || paused() || isFinal()) return;
    if (D.inFlight) { D.again = true; return; }
    clearTimeout(D.timer);
    D.inFlight = true;
    var g = ++D.gen;
    Server.order(D.orderNo).then(function (o) {
      if (g !== D.gen) return;
      D.inFlight = false;
      if (!readable(o)) {
        if (!D.order) { D.error = true; draw(); return; }
        D.stale = true; draw(); after(); return;
      }
      fresh(o);
      after();
    }, function (err) {
      if (g !== D.gen) return;
      D.inFlight = false;
      if ((err && err.type === 'notFound') || !D.order) { D.error = true; draw(); return; }   /* §6.3 */
      D.stale = true;                                                                          /* C06 */
      draw();
      after();
    });
  }

  function after() {
    if (D.again) { D.again = false; request(); return; }
    schedule();
  }

  function schedule() {
    clearTimeout(D.timer);
    if (!D.mounted || isFinal() || D.error) return;
    D.timer = setTimeout(function () {
      if (!D.mounted || document.hidden) return;
      request();
    }, REFRESH_MS);
  }

  /* A response the server confirmed. A status this device did not write is
     disclosed: the banner for a cancellation, C03 for anything else. */
  function fresh(o) {
    var old = D.order;
    if (old && o.status !== old.status) {
      if (o.status === 'Cancelled') D.banner = o.cancelledByGuest ? 'G' : 'H';
      else D.external = true;
      announceStatus(o);
    }
    D.order = o;
    D.stale = false;
    draw();
  }

  function announceStatus(o) {
    App.announce(t('s02.sr.status', { no: o.orderNo, label: t('st.status.' + o.status) }));
  }

  /* ------------------------------------------------------------------ *
   * The primary action (§5.4, §5.7)
   * ------------------------------------------------------------------ */
  function primary() {
    if (!tapOk() || D.busy || !D.order) return;
    var st = D.order.status;
    if (st === 'OnTheWay') { openSheet('SM-02'); return; }   /* sends nothing */
    var target = HotelDB.nextStatus(st);
    if (!target || target === 'Delivered') return;

    D.busy = true;                  /* synchronous: a second tap finds B02 disabled */
    D.actionErr = false;
    clearTimeout(D.timer);
    D.gen++; D.inFlight = false; D.again = false;            /* refreshing pauses */
    draw();
    var sess = Session.current();
    Server.setStatus(D.order.orderNo, target, sess && sess.memberId).then(function (res) {
      if (!D.mounted) return;
      D.busy = false;
      if (res && res.order && (res.ok || res.order.status === target)) {
        /* Success — including a target the order already held (map §4 decision 20). */
        D.order = res.order;
        announceStatus(res.order);
      } else if (res && res.error === 'stale' && res.order) {
        refused(res.order);
      } else {
        D.actionErr = true;
      }
      draw();
      schedule();
    }, function () {
      if (!D.mounted) return;
      D.busy = false;
      D.actionErr = true;                                    /* C15; nothing assumed */
      draw();
      schedule();
    });
  }

  /* §5.7 rules 4–5: render the truth the server returned. */
  function refused(o) {
    if (o.status === 'Cancelled') D.banner = o.cancelledByGuest ? 'G' : 'H';
    else D.external = true;
    D.order = o;
    announceStatus(o);
  }

  function openSheet(id) {
    D.modal = true;
    clearTimeout(D.timer);
    D.gen++; D.inFlight = false; D.again = false;
    App.Modal.open(id, { order: D.order });
  }

  var tapAt = 0;
  function tapOk() {
    var now = Date.now();
    if (now - tapAt < 300) return false;
    tapAt = now;
    return true;
  }

  function goBoard() {
    if (!tapOk()) return;
    if (D.fromBoard) {
      try { history.back(); return; } catch (e) {}
    }
    App.replace('/board', { freshBoard: !App.state.lastBoard });
  }

  /* ------------------------------------------------------------------ *
   * Draw
   * ------------------------------------------------------------------ */
  function header() {
    return '<div class="s-top"><header class="s-header" data-el="S-02-S01">' +
             '<span class="s-header__side">' +
               '<button type="button" class="iconbtn" data-el="S-02-B01" aria-label="' + esc(t('st.back')) + '">' +
                 '<span class="iconbtn__glyph chev" aria-hidden="true">›</span></button>' +
             '</span>' +
             '<h1 class="s-header__title s-header__title--center" data-el="S-02-C01">' + t('s02.c01') + '</h1>' +
             '<span class="s-header__side"></span>' +
           '</header></div>';
  }

  function backButton() {
    return '<button type="button" class="btn btn--ghost s-back-btn" data-el="S-02-B04">' + t('s02.b04') + '</button>';
  }

  function payLines(o) {
    var pc = S.payCase(o);
    var total = money(o.total);
    var collect = '<p class="s-pay__collect">' + t('s02.c12.collect', { total: total }) + '</p>';
    if (pc.kind === 'card') {
      return '<p class="s-pay__line">' + t('s02.c12.card') + '</p>' + collect;
    }
    var third;
    if (pc.kind === 'cashMore') {
      third = t('s02.c12.more', {
        amount: money(pc.amount),
        change: money(pc.change)
      });
    } else if (pc.kind === 'cashEqual') {
      third = t('s02.c12.equal');
    } else {
      third = t('s02.c12.none');
    }
    return '<p class="s-pay__line">' + t('s02.c12.cash') + '</p>' + collect +
           '<p class="s-pay__line">' + third + '</p>';
  }

  /* The stored reason, never translated: of the two strings HotelDB keeps,
     the one in the interface language, else the other. Cut at 120 (§7.1). */
  function storedReason(o) {
    var ar = String(o.cancelReasonAr || ''), en = String(o.cancelReasonEn || '');
    var r = I18N.lang === 'en' ? (en || ar) : (ar || en);
    return r.length > 120 ? r.slice(0, 120) + '…' : r;
  }

  function cancelRecord(o) {
    var text;
    if (o.cancelledByGuest) {
      text = t('s02.c13.guest');
    } else {
      text = t('s02.c13.hotel', { name: esc(S.memberName(o.cancelledBy)), reason: esc(storedReason(o)) });
      text = text.replace(/:\s*$/, '');             /* no reason stored: no dangling colon */
    }
    return '<div class="s-sec s-record" data-el="S-02-C13">' +
             '<p class="s-record__label">' + t('st.status.Cancelled') + '</p>' +
             '<p class="s-record__text">' + text + '</p></div>';
  }

  function draw() {
    if (!D.mounted) return;
    var h = '<div class="s-screen s-order">' + header();
    var sess = Session.current();
    var expired = !sess || Session.expired(sess);
    D.expiredShown = expired;
    var bar = '';

    if (D.error) {
      h += '<main class="s-col"><div class="s-empty" data-el="S-02-C18">' +
             '<span class="s-icon-circle" aria-hidden="true">?</span>' +
             '<p class="s-empty__l1">' + t('s02.c18.l1') + '</p>' +
             '<p class="s-empty__l2">' + t('s02.c18.l2') + '</p>' +
             '<p class="s-empty__l3">' + t('s02.c18.l3') + '</p>' +
           '</div></main>';
      bar = backButton();
    } else if (!D.order) {
      h += '<main class="s-col s-detail" data-el="S-02-S02" aria-hidden="true">' +
             '<div class="s-skel s-skel--line"></div>' +
             '<div class="s-skel s-skel--head" style="margin-top:8px"></div>' +
             '<div class="s-skel s-skel--room" style="margin-top:16px"></div>' +
             '<div class="s-skel s-skel--row" style="margin-top:24px"></div>' +
             '<div class="s-skel s-skel--row" style="margin-top:8px"></div>' +
             '<div class="s-skel s-skel--row" style="margin-top:8px"></div>' +
           '</main>';
      bar = backButton();
    } else {
      var o = D.order, now = Date.now(), st = o.status;
      var qty = S.itemQty(o);
      h += '<main class="s-col s-detail" data-el="S-02-S02">';
      if (D.banner) {
        h += '<div class="s-banner" data-el="S-02-C02" role="alert">' +
               '<p class="s-banner__l1">' + t(D.banner === 'G' ? 's02.c02.g1' : 's02.c02.h1') + '</p>' +
               '<p class="s-banner__l2">' + t('s02.c02.l2') + '</p></div>';
      }
      if (D.external && st !== 'Cancelled') {
        h += '<p class="s-line s-line--boxed" data-el="S-02-C03" style="margin-bottom:16px">' + t('s02.c03') + '</p>';
      }
      h += '<div class="s-idline" data-el="S-02-C04"><span>' +
             t('st.orderno', { no: '<span class="num">' + esc(o.orderNo) + '</span>' }) + '</span>' +
             '<span>' + S.duration(now - (o.createdAt || now)) + '</span></div>';
      h += '<p class="s-status" data-el="S-02-C05" style="margin-top:8px">' + t('st.status.' + st) + '</p>';
      if (D.stale && !S.isFinalStatus(st)) {
        h += '<p class="s-line" data-el="S-02-C06" role="status" style="margin-top:8px">' + t('s02.c06') + '</p>';
      }
      h += '<div class="s-roomblock" data-el="S-02-C07" style="margin-top:16px" ' +
             'aria-label="' + esc(t('st.room') + ' ' + S.spaced(o.roomNumber)) + '">' +
             '<span class="s-roomblock__word" aria-hidden="true">' + t('st.room') + '</span>' +
             '<span class="s-roomno s-roomblock__no" aria-hidden="true">' + esc(o.roomNumber) + '</span></div>';

      /* Items — quantity first, names never truncated, no unit prices. */
      h += '<section class="s-sec" data-el="S-02-S03">' +
             '<h2 class="s-sec__title" data-el="S-02-C08">' + t('s02.c08', { count: S.countWord(qty) }) + '</h2><ul>';
      for (var i = 0; i < o.lines.length; i++) {
        var l = o.lines[i];
        h += '<li class="s-item" data-el="S-02-C09" aria-label="' +
               esc(t('s02.sr.item', { n: l.qty, name: S.lineName(l) })) + '">' +
               '<span class="s-item__qty" aria-hidden="true">' + t('s02.c09.qty', { n: esc(l.qty) }) + '</span>' +
               '<span class="s-item__name" aria-hidden="true">' + esc(S.lineName(l)) + '</span></li>';
      }
      h += '</ul><div class="s-items-total" data-el="S-02-C10"><span>' + S.countWord(qty) + '</span>' +
             '<span class="s-items-total__sum">' + money(o.total) + '</span></div></section>';

      if (S.hasNotes(o)) {
        h += '<section class="s-sec s-notes" data-el="S-02-C11">' +
               '<h2 class="s-sec__title" style="margin-bottom:4px">' + t('s02.c11') + '</h2>' +
               '<p class="s-notes__text">' + esc(o.notes) + '</p></section>';
      }

      h += '<section class="s-sec" data-el="S-02-C12"><h2 class="s-sec__title" style="margin-bottom:4px">' +
             t('s02.c12') + '</h2>' + payLines(o) + '</section>';

      if (st === 'Cancelled') h += cancelRecord(o);
      if (st === 'Delivered') h += '<p class="s-sec s-record" data-el="S-02-C14">' + t('s02.c14') + '</p>';

      if (!expired && S.isActiveStatus(st)) {
        h += '<button type="button" class="btn btn--ghost btn--block s-cancel" data-el="S-02-B03">' + t('s02.b03') + '</button>';
      }
      h += '</main>';

      /* S04 — exactly one button, or the session-expired bar. */
      if (expired) {
        bar = '<div class="s-expired" data-el="S-02-C17">' +
                '<div>' + t('s02.c17') + '</div>' +
                '<button type="button" class="btn" data-el="S-02-B05">' + t('st.signin.continue') + '</button></div>';
      } else if (S.isActiveStatus(st)) {
        if (D.actionErr) bar += '<p class="error" data-el="S-02-C15" role="alert">' + t('s02.c15') + '</p>';
        if (st === 'New') bar += '<p class="s-bar__consequence" data-el="S-02-C16">' + t('s02.c16') + '</p>';
        if (D.busy) {
          bar += '<button type="button" class="btn btn--primary s-primary" data-el="S-02-B02" disabled aria-disabled="true">' +
                   '<span class="s-primary__l1">' + t('st.sending') + '</span></button>';
        } else {
          var l2 = st === 'OnTheWay' ? t('s02.b02.opens') : t('st.after', { label: t('st.status.' + HotelDB.nextStatus(st)) });
          bar += '<button type="button" class="btn btn--primary s-primary" data-el="S-02-B02">' +
                   '<span class="s-primary__l1">' + t('s02.b02.' + st) + '</span>' +
                   '<span class="s-primary__l2">' + l2 + '</span></button>';
        }
      } else {
        bar = backButton();
      }
    }

    h += '<div class="s-bar" data-el="S-02-S04">' + bar + '</div></div>';
    var root = App.paint(h);
    var main = root.querySelector('.s-detail');
    var barEl = root.querySelector('.s-bar');
    if (main && barEl) main.style.paddingBottom = (barEl.offsetHeight + 16) + 'px';
    bind(root);
  }

  function bind(root) {
    root.querySelector('[data-el="S-02-B01"]').addEventListener('click', goBoard);
    var b04 = root.querySelector('[data-el="S-02-B04"]');
    if (b04) b04.addEventListener('click', goBoard);
    var b02 = root.querySelector('[data-el="S-02-B02"]');
    if (b02) b02.addEventListener('click', primary);
    var b03 = root.querySelector('[data-el="S-02-B03"]');
    if (b03) b03.addEventListener('click', function () {
      if (!tapOk() || D.modal || D.busy) return;
      openSheet('SM-01');
    });
    var b05 = root.querySelector('[data-el="S-02-B05"]');
    if (b05) b05.addEventListener('click', function () {
      if (!tapOk()) return;
      App.signIn({ view: 'S-02', orderNo: D.orderNo, order: D.order, fromBoard: D.fromBoard });
    });
  }

  /* ------------------------------------------------------------------ *
   * View contract
   * ------------------------------------------------------------------ */
  Views['S-02'] = {
    enter: function (params, ctx) {
      D = {
        mounted: true, orderNo: String(params.orderNo), order: null,
        fromBoard: !!ctx.fromBoard, error: false, stale: false, external: false,
        banner: null, busy: false, actionErr: false, modal: false,
        timer: null, inFlight: false, again: false, gen: 0
      };
      /* From a board card: drawn on the first frame from the board response,
         no skeleton (§3.1). By reload or direct URL: the loading state. */
      if (ctx.order && readable(ctx.order) && String(ctx.order.orderNo) === D.orderNo) D.order = ctx.order;
      window.scrollTo(0, 0);
      draw();
      if (isFinal()) return;               /* a finished order is read-only; nothing to refresh */
      request();
    },

    leave: function () {
      D.mounted = false;
      D.gen++;
      clearTimeout(D.timer);
    },

    draw: draw,

    onData: function () {
      if (!document.hidden) request();
    },

    onVisibility: function (visible) {
      if (visible) request();
    },

    /* SM-01 / SM-02 hand back exactly one of their outcomes (§5.8, §5.9). */
    onModalOutcome: function (id, outcome, order, variant) {
      D.modal = false;
      if (outcome === 'cancelled' || outcome === 'delivered') {
        D.order = order;
        announceStatus(order);
      } else if (outcome === 'refusedCancelled') {
        D.banner = variant === 'G' ? 'G' : 'H';
        D.order = order;
        announceStatus(order);
      } else if (outcome === 'refusedDelivered') {
        D.external = true;
        D.order = order;
        announceStatus(order);
      }
      draw();
      request();                           /* resumes with one immediate request */
    },

    tick: function (now) {
      if (!D.mounted) return;
      var sess = Session.current();
      var expired = !sess || Session.expired(sess);
      if (expired !== D.expiredShown) { D.expiredShown = expired; draw(); return; }
      if (!D.lastTick || now - D.lastTick >= 30000) {
        if (D.lastTick) draw();            /* elapsed time, every 30 s */
        D.lastTick = now;
      }
    }
  };
})();

</script>
<script>
/* staff/js/signin.js */
/* staff/js/signin.js — S-03 Staff sign-in (دخول الموظف).
   Spec: /spec/staff/screens/S-03.md. A 4-digit PIN, the 4th digit submits.
   While nobody is signed in it keeps counting the queue and keeps chiming
   with the board's rules (§5.5). Any touch here arms audio (§5.4). */
(function () {
  'use strict';

  var S = window.Staff;
  var Server = S.Server, Alert = S.Alert, Chime = S.Chime, Session = S.Session;

  I18N.register({
    's03.c01':        { ar: 'دخول الموظف', en: 'Staff sign-in' },
    's03.c02':        { ar: 'انتهت مدة الجلسة — أدخل رمزك لتعود إلى حيث كنت', en: 'The session has expired — enter your PIN to return to where you were' },
    's03.c06.count':  { ar: 'طلبات نشطة الآن: {n} — جديدة: {m}', en: 'Active orders now: {n} — new: {m}' },
    's03.c06.none':   { ar: 'لا توجد طلبات نشطة الآن', en: 'No active orders right now' },
    's03.c06.fail':   { ar: 'تعذّر تحديث عدد الطلبات', en: 'Could not update the order count' },
    's03.c07.off':    { ar: 'الصوت متوقف — لن تسمع نغمة الطلبات الجديدة. يمكن تشغيله من اللوحة بعد الدخول', en: 'Sound is off — you will not hear the new-order chime. It can be turned on from the board after signing in' },
    's03.c07.blocked':{ ar: 'الصوت لم يُفعَّل بعد — المس الشاشة مرة واحدة لتفعيله', en: 'Sound is not enabled yet — touch the screen once to enable it' },
    's03.c03':        { ar: 'رمز الدخول (4 أرقام)', en: 'PIN (4 digits)' },
    's03.c04.wrong':  { ar: 'رمز الدخول غير صحيح — أعد إدخاله', en: 'Wrong PIN — enter it again' },
    's03.c04.locked': { ar: 'محاولات خاطئة كثيرة — انتظر دقيقة ثم حاول مرة أخرى', en: 'Too many wrong attempts — wait one minute, then try again' },
    's03.c04.failed': { ar: 'تعذّر الوصول إلى النظام — تحقّق من الشبكة ثم أعد إدخال الرمز', en: 'Could not reach the system — check the network, then enter the PIN again' },
    's03.c04.short':  { ar: 'رمز الدخول 4 أرقام — أكمل إدخاله', en: 'The PIN has 4 digits — finish entering it' },
    's03.c04.paste':  { ar: 'استخدم الأرقام فقط (0–9)', en: 'Use digits only (0–9)' },
    's03.c05':        { ar: 'جارٍ التحقق…', en: 'Checking…' },
    's03.c09':        { ar: 'نسيت رمزك؟ اطلبه من المناوب المسؤول', en: 'Forgot your PIN? Ask the duty manager' },
    's03.c08.l1':     { ar: 'هذا الجهاز غير مربوط بنظام الفندق', en: "This device is not linked to the hotel's system" },
    's03.c08.l2':     { ar: 'لا يمكن الدخول أو استلام الطلبات عليه', en: 'You cannot sign in or receive orders on it' },
    's03.c08.l3':     { ar: 'اطلب من مدير الفندق ربط هذا الجهاز', en: 'Ask the hotel manager to link this device' },
    /* Screen reader only (§7.7). */
    's03.sr.fill':    { ar: '{n} من 4 أرقام', en: '{n} of 4 digits' }
  });

  var QUEUE_MS = 15000;
  var LOCK_MS = 60 * 1000;

  var P = { mounted: false };

  /* ------------------------------------------------------------------ *
   * Queue summary (§5.5): counts and New order numbers/times only.
   * ------------------------------------------------------------------ */
  function queueRequest() {
    if (!P.mounted || P.variantB) return;
    if (P.qInFlight) return;
    clearTimeout(P.qTimer);
    P.qInFlight = true;
    var g = ++P.qGen;
    Server.queue().then(function (res) {
      if (g !== P.qGen) return;
      P.qInFlight = false;
      P.queue = { n: res.active, m: res.news.length };
      P.news = res.news;
      Alert.observe(res.news);                  /* S-01 §5.6 rules, baseline per §5.5 rule 3 */
      paintQueue();
      qSchedule();
    }, function (err) {
      if (g !== P.qGen) return;
      P.qInFlight = false;
      if (err && err.type === 'notLinked') { toVariantB(); return; }
      P.queue = 'fail';
      paintQueue();
      qSchedule();
    });
  }

  function qSchedule() {
    clearTimeout(P.qTimer);
    P.qTimer = setTimeout(function () {
      if (!P.mounted || document.hidden) return;
      queueRequest();
    }, QUEUE_MS);
  }

  function toVariantB() {
    P.variantB = true;
    P.qGen++;
    clearTimeout(P.qTimer);
    draw();
  }

  /* ------------------------------------------------------------------ *
   * Sign-in (§5.2) — exactly five outcomes
   * ------------------------------------------------------------------ */
  function submit() {
    if (P.busy || P.lockedUntil) return;
    var pin = P.pin;
    P.pin = '';                   /* the digits are not kept once sent */
    P.dots = 4;
    P.busy = true;
    P.msg = null;
    var input = inputEl();
    if (input) { input.value = ''; input.blur(); }
    paintPin();
    Server.signIn(pin).then(function (res) {
      if (!P.mounted) return;
      if (res && res.kind === 'ok') {
        P.qGen++; clearTimeout(P.qTimer);          /* the queue request stops */
        Session.start(res.member.id);
        App.afterSignIn();
        return;
      }
      P.busy = false;
      P.dots = 0;
      if (res && res.kind === 'notLinked') { toVariantB(); return; }
      if (res && res.kind === 'locked') {
        P.msg = 'locked';
        P.lockedUntil = Date.now() + LOCK_MS;
        clearTimeout(P.lockTimer);
        P.lockTimer = setTimeout(function () {
          P.lockedUntil = 0;
          if (P.msg === 'locked') P.msg = null;
          paintPin();
          focusPin();
        }, LOCK_MS);
        paintPin();
        return;
      }
      P.msg = (res && res.kind === 'wrong') ? 'wrong' : 'failed';
      paintPin();
      focusPin();
    }, function () {
      if (!P.mounted) return;
      P.busy = false;
      P.dots = 0;
      P.msg = 'failed';
      paintPin();
      focusPin();
    });
  }

  function onInput(e) {
    var el = e.target;
    if (P.busy || P.lockedUntil) { el.value = ''; return; }
    var raw = S.westernDigits(el.value);
    var digits = raw.replace(/[^0-9]/g, '');
    /* A non-digit is not entered and shows no message (§7.1). */
    if (digits.length !== raw.length) digits = P.pin + '';
    digits = digits.slice(0, 4);
    if (digits.length > P.pin.length) P.msg = null;   /* the next digit clears C04 */
    P.pin = digits;
    P.dots = digits.length;
    el.value = digits;
    paintPin();
    if (digits.length === 4) submit();
  }

  function onPaste(e) {
    e.preventDefault();
    if (P.busy || P.lockedUntil) return;
    var text = '';
    try { text = (e.clipboardData || window.clipboardData).getData('text') || ''; } catch (x) {}
    var v = S.westernDigits(String(text).replace(/^\s+|\s+$/g, ''));
    if (!/^[0-9]+$/.test(v)) { P.msg = 'paste'; paintPin(); return; }
    P.pin = v.slice(0, 4);
    P.dots = P.pin.length;
    P.msg = null;
    inputEl().value = P.pin;
    paintPin();
    if (P.pin.length === 4) submit();
  }

  function onKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (P.pin.length < 4 && !P.busy && !P.lockedUntil) { P.msg = 'short'; paintPin(); }
    }
  }

  /* Digits typed anywhere on the page go into F01 (§5.2 step 1). */
  function onDocKey(e) {
    if (!P.mounted || P.variantB) return;
    var input = inputEl();
    if (!input || document.activeElement === input) return;
    if (/^[0-9٠-٩۰-۹]$/.test(e.key) && !App.Modal.isOpen()) focusPin();
  }
  document.addEventListener('keydown', onDocKey, true);

  function inputEl() { return document.querySelector('[data-el="S-03-F01"] input'); }

  function focusPin() {
    var el = inputEl();
    if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (x) { el.focus(); } }
  }

  /* ------------------------------------------------------------------ *
   * Draw — full on entry and language switch, partial while typing
   * ------------------------------------------------------------------ */
  function queueHtml() {
    if (P.queue === null) return '';
    if (P.queue === 'fail') return t('s03.c06.fail');
    if (P.queue.n === 0) return t('s03.c06.none');
    return t('s03.c06.count', { n: '<span class="num">' + P.queue.n + '</span>', m: '<span class="num">' + P.queue.m + '</span>' });
  }

  function soundKey() {
    if (!Chime.soundOn()) return 's03.c07.off';
    if (!Chime.armed || Chime.refused) return 's03.c07.blocked';
    return null;
  }

  function cellsHtml() {
    var h = '';
    for (var i = 0; i < 4; i++) {
      var filled = i < P.dots;
      var next = !P.busy && !P.lockedUntil && i === P.dots;
      h += '<span class="s-pin__cell' + (next ? ' is-next' : '') + '" aria-hidden="true">' +
             (filled ? '<span class="s-pin__dot"></span>' : '') + '</span>';
    }
    return h;
  }

  function slotHtml() {
    if (P.busy) return '<p class="s-slot__checking" data-el="S-03-C05" role="status">' + t('s03.c05') + '</p>';
    if (P.msg) return '<p class="error" data-el="S-03-C04" role="alert">' + t('s03.c04.' + P.msg) + '</p>';
    return '';
  }

  function demoHint() {
    var members = (HotelDB.staff().members) || [], parts = [];
    for (var i = 0; i < members.length; i++) {
      parts.push('<span class="num">' + esc(members[i].pin) + '</span> ' + esc(members[i].name));
    }
    return '<aside class="s-demo-hint" data-demo="true">' +
             '<span class="s-demo-hint__tag">' + t('st.demo.tag') + '</span>' +
             t('st.demo.pins') + ' ' + parts.join(' · ') + '</aside>';
  }

  function draw() {
    if (!P.mounted) return;
    var h = '<div class="s-screen s-signin-screen">' +
      '<div class="s-top"><header class="s-header" data-el="S-03-S01">' +
        '<h1 class="s-header__title" data-el="S-03-C01">' + t('s03.c01') + '</h1>' +
        '<button type="button" class="s-hbtn" data-el="S-03-B01" lang="' + I18N.other() + '">' + t('st.lang.other') + '</button>' +
      '</header></div>' +
      '<main class="s-col s-col--narrow s-signin" data-el="S-03-S02">';

    if (P.variantB) {
      h += '<div class="s-empty" data-el="S-03-C08">' +
             '<span class="s-icon-circle" aria-hidden="true">!</span>' +
             '<p class="s-empty__l1">' + t('s03.c08.l1') + '</p>' +
             '<p class="s-empty__l2">' + t('s03.c08.l2') + '</p>' +
             '<p class="s-empty__l3">' + t('s03.c08.l3') + '</p>' +
           '</div>';
    } else {
      var sk = soundKey();
      h += (P.showC02 ? '<p class="s-boxline" data-el="S-03-C02">' + t('s03.c02') + '</p>' : '') +
           '<p class="s-queue" data-el="S-03-C06" aria-live="polite">' + queueHtml() + '</p>' +
           '<p class="s-soundline" data-el="S-03-C07"' + (sk ? '' : ' hidden') + '>' + (sk ? t(sk) : '') + '</p>' +
           '<label class="s-pin-label" data-el="S-03-C03" for="s03-pin">' + t('s03.c03') + '</label>' +
           '<div class="s-pin' + (P.busy || P.lockedUntil ? ' is-disabled' : '') + '" data-el="S-03-F01">' +
             '<span class="s-pin__cells" style="display:contents">' + cellsHtml() + '</span>' +
             '<input id="s03-pin" class="s-pin__input" type="text" inputmode="numeric" pattern="[0-9]*" ' +
               'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ' +
               'enterkeyhint="go" data-lpignore="true" data-form-type="other" name="s03-code-' + Date.now() + '" ' +
               'aria-describedby="s03-fill"' + (P.busy || P.lockedUntil ? ' disabled' : '') + '>' +
             '<span id="s03-fill" class="sr-only">' + t('s03.sr.fill', { n: P.dots }) + '</span>' +
           '</div>' +
           '<div class="s-slot">' + slotHtml() + '</div>' +
           '<p class="s-helper" data-el="S-03-C09">' + t('s03.c09') + '</p>' +
           demoHint();
    }
    h += '</main></div>';

    var root = App.paint(h);
    root.querySelector('[data-el="S-03-B01"]').addEventListener('click', function () {
      var now = Date.now();
      if (P.tapAt && now - P.tapAt < 300) return;
      P.tapAt = now;
      S.Lang.toggle();                      /* digits typed, lockout, message kept */
    });
    var input = inputEl();
    if (input) {
      input.value = P.pin;
      input.addEventListener('input', onInput);
      input.addEventListener('paste', onPaste);
      input.addEventListener('keydown', onKey);
    }
  }

  function paintPin() {
    var box = document.querySelector('[data-el="S-03-F01"]');
    if (!box) return;
    box.classList.toggle('is-disabled', !!(P.busy || P.lockedUntil));
    box.querySelector('.s-pin__cells').innerHTML = cellsHtml();
    box.querySelector('#s03-fill').textContent = t('s03.sr.fill', { n: P.dots });
    var input = inputEl();
    input.disabled = !!(P.busy || P.lockedUntil);
    var slot = document.querySelector('.s-slot');
    if (slot) slot.innerHTML = slotHtml();
  }

  function paintQueue() {
    var el = document.querySelector('[data-el="S-03-C06"]');
    if (el) el.innerHTML = queueHtml();
  }

  function paintSound() {
    var el = document.querySelector('[data-el="S-03-C07"]');
    if (!el) return;
    var sk = soundKey();
    el.hidden = !sk;
    el.innerHTML = sk ? t(sk) : '';
  }

  /* ------------------------------------------------------------------ *
   * View contract
   * ------------------------------------------------------------------ */
  Views['S-03'] = {
    enter: function (params, ctx) {
      P = {
        mounted: true, pin: '', dots: 0, busy: false, msg: null,
        lockedUntil: 0, lockTimer: null,
        queue: null, news: [], qTimer: null, qInFlight: false, qGen: 0,
        showC02: !!ctx.expired && !!App.state.returnTarget,
        variantB: !S.Device.linked(),      /* decided on the device, first frame */
        tapAt: 0
      };
      if (!ctx.expired) {
        /* No return target unless reached from a "Sign in to continue". */
        App.state.returnTarget = null;
      }
      window.scrollTo(0, 0);
      draw();
      if (P.variantB) return;
      focusPin();
      queueRequest();
    },

    leave: function () {
      P.mounted = false;
      P.qGen++;
      clearTimeout(P.qTimer);
      clearTimeout(P.lockTimer);
    },

    draw: function () {
      draw();
      focusPin();
    },

    onData: function () {
      if (!document.hidden) queueRequest();
    },

    onVisibility: function (visible) {
      if (visible) queueRequest();
    },

    onArm: function () { paintSound(); },

    tick: function (now) {
      if (!P.mounted || P.variantB) return;
      if (P.news && P.news.length) Alert.tick(P.news, now);   /* the 60 s repeat while Late */
    }
  };
})();

</script>
<script>
/* staff/js/modals.js */
/* staff/js/modals.js — SM-01 Cancel order and SM-02 Confirm delivery and
   payment. Both are bottom sheets on top of S-02 (SM-01 preamble), opened
   and closed by App.Modal. Each sends one request per confirmed tap and hands
   S-02 exactly one of the outcomes it expects (S-02 §5.8, §5.9). */
(function () {
  'use strict';

  var S = window.Staff;
  var Server = S.Server, Session = S.Session, Modal = App.Modal;

  I18N.register({
    /* SM-01 */
    'sm01.c01':     { ar: 'إلغاء الطلب', en: 'Cancel order' },
    'sm01.c02':     { ar: 'لن يُحضَّر الطلب ولن يُوصَّل، وسيرى الضيف على هاتفه أنه أُلغي مع السبب. لا يمكن التراجع عن الإلغاء.',
                      en: 'The order will not be prepared or delivered, and the guest will see on their phone that it was cancelled, with the reason. A cancellation cannot be undone.' },
    'sm01.c03':     { ar: 'سبب الإلغاء (مطلوب)', en: 'Reason for cancelling (required)' },
    'sm01.p1':      { ar: 'المنتج غير متوفر', en: 'Item not available' },
    'sm01.p2':      { ar: 'الغرفة غير صحيحة أو غير مشغولة', en: 'Room number is wrong or not occupied' },
    'sm01.p3':      { ar: 'لا أحد يجيب في الغرفة', en: 'No answer at the room' },
    'sm01.p4':      { ar: 'بطلب من الضيف', en: "At the guest's request" },
    'sm01.c04':     { ar: 'اختر سببًا للإلغاء', en: 'Choose a reason for cancelling' },
    'sm01.c05':     { ar: 'إضافة قصيرة للضيف (اختياري)', en: 'Short addition for the guest (optional)' },
    'sm01.c06':     { ar: 'اكتب بلغة الطلب: {lang}', en: "Write in the order's language: {lang}" },
    'sm01.lang.ar': { ar: 'العربية', en: 'Arabic' },
    'sm01.lang.en': { ar: 'الإنجليزية', en: 'English' },
    'sm01.c07':     { ar: '{n}/60', en: '{n}/60' },
    'sm01.c08.l1':  { ar: 'سيقرأ الضيف على هاتفه:', en: 'The guest will read on their phone:' },
    /* G-06 C08's hotel-cancelled wording, word for word. */
    'sm01.c08.l2':  { ar: 'ألغى الفندق هذا الطلب: {reason}', en: 'The hotel cancelled this order: {reason}' },
    'sm01.c09':     { ar: 'لم يصل الإلغاء إلى النظام — حاول مرة أخرى', en: 'The cancellation did not reach the system — try again' },
    'sm01.b06':     { ar: 'تأكيد الإلغاء', en: 'Confirm cancellation' },

    /* SM-02 */
    'sm02.c01':         { ar: 'تأكيد التوصيل والدفع', en: 'Confirm delivery and payment' },
    'sm02.c03':         { ar: 'الطريقة: {m}', en: 'Method: {m}' },
    'sm02.card':        { ar: 'بطاقة', en: 'Card' },
    'sm02.cash':        { ar: 'نقدًا', en: 'Cash' },
    'sm02.c04':         { ar: 'المبلغ المطلوب', en: 'Amount to collect' },
    'sm02.c05.card':    { ar: 'خذ المبلغ على جهاز الدفع', en: 'Take the payment on the card terminal' },
    'sm02.c05.more':    { ar: 'سيدفع بـ {amount} — أعطِه باقيًا {change}', en: 'Paying with {amount} — give back {change} change' },
    'sm02.c05.equal':   { ar: 'سيدفع بالمبلغ المطابق — لا يوجد باقٍ', en: 'Paying the exact amount — no change' },
    'sm02.c05.none':    { ar: 'لم يحدّد الضيف المبلغ مسبقًا — أعطِه الباقي مما يدفعه', en: 'The guest did not state an amount in advance — give change from what they pay' },
    'sm02.c06':         { ar: 'اضغط فقط بعد أن يستلم الضيف الطلب وتستلم المبلغ', en: 'Tap only after the guest has the order and you have the payment' },
    'sm02.b02':         { ar: 'سلّمتُ الطلب واستلمتُ المبلغ', en: 'Handed over and payment taken' }
  });

  var PRESETS = ['sm01.p1', 'sm01.p2', 'sm01.p3', 'sm01.p4'];
  var FREE_MAX = 60;

  function myId() { var s = Session.current(); return s ? s.memberId : null; }

  /* User-perceived characters (G-04 §7.2): one emoji counts as 1. */
  function graphemes(s) {
    s = String(s || '');
    if (window.Intl && Intl.Segmenter) {
      var out = [], it = new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s);
      var iter = it[Symbol.iterator](), step;
      while (!(step = iter.next()).done) out.push(step.value.segment);
      return out;
    }
    return s.match(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\s\S]/g) || [];
  }

  function trim(s) { return String(s || '').replace(/^\s+|\s+$/g, ''); }

  function footerButtons(prefix, backEl, confirmEl, confirmKey, afterStatus, busy, errKey, errEl, showErr) {
    return '<div class="s-sheet__foot" data-el="' + prefix + '-S03">' +
             (showErr ? '<p class="error" data-el="' + errEl + '" role="alert">' + t(errKey) + '</p>' : '') +
             '<button type="button" class="btn btn--ghost" data-el="' + backEl + '"' + (busy ? ' disabled aria-disabled="true"' : '') + '>' +
               t('st.back') + '</button>' +
             '<button type="button" class="btn btn--primary s-primary" data-el="' + confirmEl + '"' + (busy ? ' disabled aria-disabled="true"' : '') + '>' +
               (busy
                 ? '<span class="s-primary__l1">' + t('st.sending') + '</span>'
                 : '<span class="s-primary__l1">' + t(confirmKey) + '</span>' +
                   '<span class="s-primary__l2">' + t('st.after', { label: t('st.status.' + afterStatus) }) + '</span>') +
             '</button>' +
           '</div>';
  }

  /* ================================================================== *
   * SM-01 — Cancel order
   * ================================================================== */
  var C = {};

  function reasonIn(lang) {
    if (C.preset == null) return '';
    var free = trim(C.free);
    var preset = S.tIn(lang, PRESETS[C.preset]);
    return free ? preset + ' — ' + free : preset;          /* §7.1 composition */
  }

  function c01Html() {
    var h = '<div class="sheet s-sheet" data-el="SM-01-S02" role="dialog" aria-modal="true" aria-labelledby="sm01-title">' +
      '<div class="s-sheet__scroll">' +
        '<h2 id="sm01-title" class="s-sheet__title" data-el="SM-01-C01" tabindex="-1" data-title>' + t('sm01.c01') + '</h2>' +
        '<p class="s-effect" data-el="SM-01-C02">' + t('sm01.c02') + '</p>' +
        '<p id="sm01-c03" class="s-field-label" data-el="SM-01-C03" style="margin-top:24px">' + t('sm01.c03') + '</p>' +
        '<div role="radiogroup" aria-labelledby="sm01-c03" style="margin-top:0">';
    for (var i = 0; i < PRESETS.length; i++) {
      h += '<button type="button" class="s-preset" role="radio" data-el="SM-01-B0' + (i + 1) + '" data-i="' + i + '"' +
             ' aria-checked="' + (C.preset === i) + '">' +
             '<span class="s-preset__mark" aria-hidden="true"></span><span>' + t(PRESETS[i]) + '</span></button>';
    }
    h += '</div>' +
        '<p class="error" data-el="SM-01-C04" role="alert" hidden>' + t('sm01.c04') + '</p>' +
        '<label class="s-field-label" data-el="SM-01-C05" for="sm01-f01" style="margin-top:24px;margin-bottom:8px">' + t('sm01.c05') + '</label>' +
        '<input id="sm01-f01" class="s-input" data-el="SM-01-F01" type="text" autocomplete="off" enterkeyhint="done" aria-describedby="sm01-c06 sm01-c07">' +
        '<div class="s-fieldrow">' +
          '<span id="sm01-c06" data-el="SM-01-C06">' + t('sm01.c06', { lang: t('sm01.lang.' + C.lang) }) + '</span>' +
          '<span id="sm01-c07" class="s-counter" data-el="SM-01-C07"></span>' +
        '</div>' +
        '<div class="s-preview" data-el="SM-01-C08" aria-live="polite" hidden>' +
          '<p class="s-preview__l1">' + t('sm01.c08.l1') + '</p>' +
          '<p class="s-preview__l2" dir="' + (C.lang === 'ar' ? 'rtl' : 'ltr') + '" lang="' + C.lang + '"></p>' +
        '</div>' +
      '</div>' +
      '<div class="s-foot-slot"></div>' +
    '</div>';
    return h;
  }

  function c01PaintFooter(sheet) {
    var slot = sheet.querySelector('.s-foot-slot');
    slot.innerHTML = footerButtons('SM-01', 'SM-01-B05', 'SM-01-B06', 'sm01.b06', 'Cancelled', C.busy,
                                   'sm01.c09', 'SM-01-C09', C.failed && !C.busy);
    slot.querySelector('[data-el="SM-01-B05"]').addEventListener('click', function () { Modal.dismiss(); });
    slot.querySelector('[data-el="SM-01-B06"]').addEventListener('click', c01Confirm);
  }

  /* Partial repaint: the input is never re-created while the sheet is open. */
  function c01Paint() {
    var sheet = C.sheet;
    if (!sheet) return;
    var rows = sheet.querySelectorAll('.s-preset');
    for (var i = 0; i < rows.length; i++) {
      rows[i].setAttribute('aria-checked', String(C.preset === i));
      if (C.busy) rows[i].setAttribute('aria-disabled', 'true'); else rows[i].removeAttribute('aria-disabled');
    }
    sheet.querySelector('[data-el="SM-01-C04"]').hidden = !C.c04;
    var n = graphemes(C.free).length;
    var counter = sheet.querySelector('[data-el="SM-01-C07"]');
    counter.textContent = t('sm01.c07', { n: n });
    counter.classList.toggle('is-full', n >= FREE_MAX);
    var prev = sheet.querySelector('[data-el="SM-01-C08"]');
    prev.hidden = C.preset == null;
    if (C.preset != null) {
      prev.querySelector('.s-preview__l2').textContent = S.tIn(C.lang, 'sm01.c08.l2', { reason: reasonIn(C.lang) });
    }
    var input = sheet.querySelector('[data-el="SM-01-F01"]');
    input.readOnly = !!C.busy;
    c01PaintFooter(sheet);
  }

  function c01Confirm() {
    if (!Modal.armed() || C.busy) return;
    var now = Date.now();
    if (now - C.tapAt < 300) return;
    C.tapAt = now;
    if (C.preset == null) {
      C.c04 = true;
      c01Paint();
      var c03 = C.sheet.querySelector('[data-el="SM-01-C03"]');
      if (c03 && c03.scrollIntoView) c03.scrollIntoView({ block: 'start' });
      return;
    }
    /* In flight — entered synchronously on the tap (§6.1). */
    C.busy = true;
    C.failed = false;
    Modal.setBusy(true);
    var input = C.sheet.querySelector('[data-el="SM-01-F01"]');
    if (input) input.blur();
    c01Paint();

    /* The reason the guest reads (§7.1): the preset in the ORDER's language
       (order.lang, Arabic when an older record lacks it) plus the free line
       exactly as typed. HotelDB keeps one field per language; the reason is
       written into the field of the language it is in and the other stays
       empty, so G-06 shows this exact string whatever language the guest
       has switched to since. The staff name is never part of it — it
       travels as staffId. */
    var reason = reasonIn(C.lang);
    var reasonAr = C.lang === 'ar' ? reason : '';
    var reasonEn = C.lang === 'en' ? reason : '';
    var me = myId();

    Server.cancel(C.orderNo, reasonAr, reasonEn, me).then(function (res) {
      if (!Modal.isOpen() || Modal.cur.id !== 'SM-01') return;
      C.busy = false;
      Modal.setBusy(false);
      var o = res && res.order;
      if (res && res.ok && o) { Modal.finish('cancelled', o); return; }
      if (res && res.error === 'stale' && o) {
        if (o.status === 'Cancelled') {
          if (o.cancelledByGuest) { Modal.finish('refusedCancelled', o, 'G'); return; }
          if (o.cancelledBy && o.cancelledBy === me) { Modal.finish('cancelled', o); return; }   /* a retry that had landed */
          Modal.finish('refusedCancelled', o, 'H');
          return;
        }
        if (o.status === 'Delivered') { Modal.finish('refusedDelivered', o); return; }
      }
      c01Fail();
    }, function () {
      if (!Modal.isOpen() || Modal.cur.id !== 'SM-01') return;
      C.busy = false;
      Modal.setBusy(false);
      c01Fail();
    });
  }

  function c01Fail() {
    C.failed = true;                        /* preset and typed line kept (§5.6) */
    c01Paint();
  }

  function onFreeInput(e) {
    var el = e.target;
    var v = el.value.replace(/[\r\n]+/g, ' ');
    var g = graphemes(v);
    if (g.length > FREE_MAX) v = g.slice(0, FREE_MAX).join('');   /* hard cap, no message */
    if (v !== el.value) el.value = v;
    C.free = v;
    c01Paint();
  }

  Modals['SM-01'] = {
    init: function (params) {
      var o = params.order || {};
      C = {
        orderNo: o.orderNo, lang: S.orderLang(o), preset: null, free: '',
        c04: false, failed: false, busy: false, tapAt: 0, sheet: null
      };
    },
    html: c01Html,
    bind: function (sheet) {
      C.sheet = sheet;
      var input = sheet.querySelector('[data-el="SM-01-F01"]');
      input.value = C.free;
      input.addEventListener('input', onFreeInput);
      input.addEventListener('paste', function (e) {
        var text = '';
        try { text = e.clipboardData.getData('text') || ''; } catch (x) { return; }
        e.preventDefault();
        if (C.busy) return;
        text = text.replace(/[\r\n]+/g, ' ');
        var start = input.selectionStart, end = input.selectionEnd;
        var before = input.value.slice(0, start), afterTxt = input.value.slice(end);
        var room = FREE_MAX - graphemes(before + afterTxt).length;
        var add = graphemes(text).slice(0, Math.max(0, room)).join('');
        input.value = before + add + afterTxt;
        C.free = input.value;
        c01Paint();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }   /* closes the keyboard, never confirms */
      });
      var rows = sheet.querySelectorAll('.s-preset');
      for (var i = 0; i < rows.length; i++) {
        rows[i].addEventListener('click', function (e) {
          if (!Modal.armed() || C.busy) return;
          C.preset = Number(e.currentTarget.getAttribute('data-i'));
          C.c04 = false;
          c01Paint();
        });
      }
      c01Paint();
    }
  };

  /* ================================================================== *
   * SM-02 — Confirm delivery and payment
   * ================================================================== */
  var M = {};

  function c02Html() {
    var o = M.order, pc = S.payCase(o);
    var method = '<b>' + t(pc.kind === 'card' ? 'sm02.card' : 'sm02.cash') + '</b>';
    var instr;
    if (pc.kind === 'card') instr = t('sm02.c05.card');
    else if (pc.kind === 'cashMore') instr = t('sm02.c05.more', {
      amount: '<b>' + money(pc.amount) + '</b>',
      change: '<b>' + money(pc.change) + '</b>'
    });
    else if (pc.kind === 'cashEqual') instr = t('sm02.c05.equal');
    else instr = t('sm02.c05.none');

    return '<div class="sheet s-sheet" data-el="SM-02-S02" role="dialog" aria-modal="true" aria-labelledby="sm02-title">' +
      '<div class="s-sheet__scroll">' +
        '<h2 id="sm02-title" class="s-sheet__title" data-el="SM-02-C01" tabindex="-1" data-title>' + t('sm02.c01') + '</h2>' +
        '<div class="s-sheet__room" data-el="SM-02-C02" aria-label="' + esc(t('st.room') + ' ' + S.spaced(o.roomNumber)) + '">' +
          '<span class="s-roomblock__word" aria-hidden="true">' + t('st.room') + '</span>' +
          '<span class="s-roomno s-sheet__roomno" aria-hidden="true">' + esc(o.roomNumber) + '</span>' +
        '</div>' +
        '<p class="s-method" data-el="SM-02-C03">' + t('sm02.c03', { m: method }) + '</p>' +
        '<div class="s-collect" data-el="SM-02-C04">' +
          '<p class="s-collect__label">' + t('sm02.c04') + '</p>' +
          '<p class="s-collect__value">' + money(o.total) + '</p>' +
        '</div>' +
        '<p class="s-instruction" data-el="SM-02-C05">' + instr + '</p>' +
        '<p class="s-consequence" data-el="SM-02-C06">' + t('sm02.c06') + '</p>' +
      '</div>' +
      footerButtons('SM-02', 'SM-02-B01', 'SM-02-B02', 'sm02.b02', 'Delivered', M.busy,
                    's02.c15', 'SM-02-C07', M.failed && !M.busy) +
    '</div>';
  }

  function c02Redraw() {
    if (!Modal.isOpen() || Modal.cur.id !== 'SM-02') return;
    Modal.draw(false);
  }

  function c02Confirm() {
    if (!Modal.armed() || M.busy) return;
    var now = Date.now();
    if (now - M.tapAt < 300) return;
    M.tapAt = now;
    M.busy = true;
    M.failed = false;
    Modal.setBusy(true);
    c02Redraw();
    Server.setStatus(M.order.orderNo, 'Delivered', myId()).then(function (res) {
      if (!Modal.isOpen() || Modal.cur.id !== 'SM-02') return;
      M.busy = false;
      Modal.setBusy(false);
      var o = res && res.order;
      /* Any Delivered answer is "delivered", whoever recorded it (§9 item 8). */
      if (o && o.status === 'Delivered' && (res.ok || res.error === 'stale')) { Modal.finish('delivered', o); return; }
      if (o && res.error === 'stale' && o.status === 'Cancelled') {
        Modal.finish('refusedCancelled', o, o.cancelledByGuest ? 'G' : 'H');
        return;
      }
      M.failed = true;
      c02Redraw();
    }, function () {
      if (!Modal.isOpen() || Modal.cur.id !== 'SM-02') return;
      M.busy = false;
      Modal.setBusy(false);
      M.failed = true;
      c02Redraw();
    });
  }

  Modals['SM-02'] = {
    init: function (params) {
      M = { order: params.order, busy: false, failed: false, tapAt: 0 };
    },
    html: c02Html,
    bind: function (sheet) {
      sheet.querySelector('[data-el="SM-02-B01"]').addEventListener('click', function () { Modal.dismiss(); });
      sheet.querySelector('[data-el="SM-02-B02"]').addEventListener('click', c02Confirm);
    }
  };
})();

</script>
<script>App.start();</script>
