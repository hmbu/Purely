    'a05.col.store': { ar: 'في المتجر', en: 'In the store' },
    'a05.col.order': { ar: 'الترتيب', en: 'Order' },
    'a05.col.actions': { ar: '—', en: '—' },
    'a05.removedPlus': { ar: '+ {R} مُزال', en: '+ {R} removed' },
    'a05.shown':  { ar: 'ظاهرة', en: 'Shown' },
    'a05.hidden': { ar: 'مخفية — بلا منتجات', en: 'Hidden — no products' },
    'a05.b02': { ar: 'نقل لأعلى', en: 'Move up' },
    'a05.b03': { ar: 'نقل لأسفل', en: 'Move down' },
    'a05.b04': { ar: 'تعديل الاسم', en: 'Rename' },
    'a05.b05': { ar: 'حذف', en: 'Delete' },
    'a05.f01': { ar: 'الاسم بالعربية *', en: 'Arabic name *' },
    'a05.f02': { ar: 'الاسم بالإنجليزية *', en: 'English name *' },
    'a05.c11': { ar: 'لا يمكن حذف فئة فيها منتجات. انقل منتجاتها إلى فئة أخرى من صفحة المنتج أولًا، بما فيها المنتجات المُزالة.',
                 en: 'A category that holds products cannot be deleted. First move its products to another category on the product page, including removed products.' },
    'a05.c12': { ar: 'بلغت الحد الأقصى 20 فئة. احذف فئة فارغة لإضافة أخرى.', en: 'You have reached the maximum of 20 categories. Delete an empty category to add another.' },
    'a05.c13.l1': { ar: 'لا توجد فئات بعد', en: 'No categories yet' },
    'a05.c13.l2': { ar: 'أنشئ فئة واحدة على الأقل لتتمكن من إضافة المنتجات', en: 'Create at least one category so you can add products' },
    'a05.c15': { ar: 'تعذّر تحميل الفئات', en: 'Categories could not be loaded' },
    'a05.c05.add':    { ar: 'تمت إضافة الفئة "{name}"', en: 'The category "{name}" was added' },
    'a05.c05.rename': { ar: 'تم تغيير اسم الفئة إلى "{name}"', en: 'The category was renamed to "{name}"' },
    'a05.c05.delete': { ar: 'تم حذف الفئة "{name}"', en: 'The category "{name}" was deleted' },
    'a05.notEmpty':   { ar: 'تعذّر الحذف: أصبحت في هذه الفئة منتجات', en: 'Could not delete: this category now holds products' },
    'a05.err.f01.empty': { ar: 'أدخل اسم الفئة بالعربية', en: 'Enter the category name in Arabic' },
    'a05.err.f01.long':  { ar: 'اسم الفئة بالعربية 24 حرفًا كحد أقصى', en: 'The Arabic category name is 24 characters at most' },
    'a05.err.f01.dup':   { ar: 'توجد فئة أخرى بهذا الاسم بالعربية', en: 'Another category already has this Arabic name' },
    'a05.err.f02.empty': { ar: 'أدخل اسم الفئة بالإنجليزية', en: 'Enter the category name in English' },
    'a05.err.f02.long':  { ar: 'اسم الفئة بالإنجليزية 24 حرفًا كحد أقصى', en: 'The English category name is 24 characters at most' },
    'a05.err.f02.dup':   { ar: 'توجد فئة أخرى بهذا الاسم بالإنجليزية', en: 'Another category already has this English name' }
  });

  var MAX = 20, NAME_MAX = 24;
  var S = { row: null, failed: false, notice: null };

  function load() { return A.Cat.load(); }
  function renumber(c) { c.categories.forEach(function (k, i) { k.order = i; }); }
  function counts(c, id) {
    var a = 0, r = 0;
    c.products.forEach(function (p) { if (p.category === id) { if (p.removed) r++; else a++; } });
    return { a: a, r: r };
  }
  function len(s) { return A.trim(s).length; }
  function key(s) { return A.trim(s).toLowerCase(); }

  function validateRow() {
    var row = S.row, e = {}, order = [];
    var c = load();
    var others = (c ? c.categories : []).filter(function (k) { return !(row.mode === 'rename' && k.id === row.id); });
    function check(f, v, prop) {
      if (!len(v)) { e[f] = 'a05.err.' + f.toLowerCase() + '.empty'; order.push(f); return; }
      if (len(v) > NAME_MAX) { e[f] = 'a05.err.' + f.toLowerCase() + '.long'; order.push(f); return; }
      for (var i = 0; i < others.length; i++) {
        if (key(others[i][prop]) === key(v)) { e[f] = 'a05.err.' + f.toLowerCase() + '.dup'; order.push(f); return; }
      }
    }
    check('F01', row.ar, 'nameAr');
    check('F02', row.en, 'nameEn');
    return { errors: e, order: order };
  }

  function isDirty() {
    var r = S.row;
    return !!r && (A.trim(r.ar) !== A.trim(r.initAr) || A.trim(r.en) !== A.trim(r.initEn));
  }

  /* The inline row's Save — also AM-01's "Save and continue" for A-05. */
  function commit() {
    var r = S.row;
    if (!r || r.busy) return 'failed';
    var v = validateRow();
    r.tried = true; r.errors = v.errors;
    if (v.order.length) { r.focus = v.order[0]; return 'invalid'; }
    var c = load();
    var ok = false, name = null;
    if (c) {
      var ar = A.trim(A.oneLine(r.ar)).replace(/ {2,}/g, ' ');
      var en = A.trim(A.oneLine(r.en)).replace(/ {2,}/g, ' ');
      if (r.mode === 'add') {
        if (c.categories.length < MAX) {
          c.categories.push({ id: 'c-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nameAr: ar, nameEn: en, order: c.categories.length });
          renumber(c);
          ok = A.Cat.save(c);
        }
      } else {
        var k = null;
        c.categories.forEach(function (x) { if (x.id === r.id) k = x; });
        if (k) { k.nameAr = ar; k.nameEn = en; ok = A.Cat.save(c); }
      }
      name = { nameAr: ar, nameEn: en };
    }
    if (!ok) { S.failed = true; S.notice = null; return 'failed'; }
    S.failed = false; S.notice = null;
    A.setFlash('A-05', r.mode === 'add' ? 'a05.c05.add' : 'a05.c05.rename', name, 5000);
    S.row = null;
    return 'ok';
  }

  function msgHtml() {
    if (S.notice) return '<p class="error adm-flash"' + A.el('A-05-C06') + '>' + esc(t(S.notice)) + '</p>';
    if (S.failed) return '<p class="error adm-flash"' + A.el('A-05-C06') + '>' + esc(t('ad.saveFail')) + '</p>';
    var f = A.getFlash('A-05');
    if (!f) return '';
    var name = I18N.lang === 'en' ? (f.vars.nameEn || f.vars.nameAr) : (f.vars.nameAr || f.vars.nameEn);
    return '<p class="adm-confirm"' + A.el('A-05-C05') + '>' + esc(t(f.key, { name: name })) + '</p>';
  }

  function inlineRow() {
    var r = S.row;
    var dis = r.busy ? ' disabled' : '';
    function fld(f, label, prop, dir) {
      var err = r.errors[f];
      var u = len(r[prop]);
      return '<div class="adm-field adm-inline__f' + (err ? ' field--error' : '') + '" data-field="' + f + '">' +
             '<label class="adm-label" for="a05-' + f + '">' + esc(t(label)) + '</label>' +
             '<input id="a05-' + f + '" type="text" class="adm-input adm-input--40 adm-w280" dir="' + dir + '" data-prop="' + prop + '"' + A.el('A-05-' + f) + dis + ' value="' + esc(r[prop]) + '">' +
             '<div class="field__counter adm-counter' + (u > NAME_MAX ? ' is-over' : '') + '" data-counter="' + f + '"' + A.el('A-05-C09') + '>' + u + '/24</div>' +
             '<p class="error adm-ferr"' + A.el('A-05-C16') + (err ? '' : ' hidden') + '>' + (err ? esc(t(err)) : '') + '</p></div>';
    }
    return '<tr class="adm-inline"' + A.el('A-05-S03') + '><td colspan="7"><div class="adm-inline__box">' +
           fld('F01', 'a05.f01', 'ar', 'rtl') + fld('F02', 'a05.f02', 'en', 'ltr') +
           '<div class="adm-inline__btns">' +
           '<button type="button" class="btn btn--primary adm-btn36" data-act="rowsave"' + A.el('A-05-B06') + dis + '>' +
             (r.busy ? '<span' + A.el('A-05-C10') + '>' + esc(t('ad.saving')) + '</span>' : esc(t('ad.save'))) + '</button>' +
           '<button type="button" class="btn btn--ghost adm-btn36" data-act="rowcancel"' + A.el('A-05-B07') + dis + '>' + esc(t('ad.cancel')) + '</button>' +
           '</div></div></td></tr>';
  }

  var view = {
    enter: function () { S.row = null; S.failed = false; S.notice = null; },
    leave: function () { S.row = null; },
    isDirty: isDirty,
    commit: commit,
    saveBlocked: function () { return null; },
    showCommitResult: function () { A.renderView(); focusRow(); },
    flashEnded: function () { var n = document.getElementById('a05-msg'); if (n) n.innerHTML = msgHtml(); },

    render: function () {
      var c = load();
      var n = c ? c.categories.length : 0;
      var open = !!S.row;
      var h = '<div class="adm-page">';
      h += '<div class="adm-head"' + A.el('A-05-S01') + '><div><h1 class="adm-title"' + A.el('A-05-C01') + '>' + esc(t('a05.c01')) + '</h1>' +
           (c && n ? '<p class="adm-sub"' + A.el('A-05-C02') + '>' + esc(t('a05.c02', { N: n })) + '</p>' : '') + '</div>' +
           '<div class="adm-head__end">' + (n >= MAX ? '<span class="adm-note"' + A.el('A-05-C12') + '>' + esc(t('a05.c12')) + '</span>' : '') +
           '<button type="button" class="btn btn--primary adm-btn40" data-act="add"' + A.el('A-05-B01') + (open || n >= MAX || !c ? ' disabled' : '') + '>' + esc(t('a05.b01')) + '</button></div></div>';
      h += '<p class="adm-note"' + A.el('A-05-C03') + '>' + esc(t('a05.c03')) + '</p>';
      h += '<p class="adm-note"' + A.el('A-05-C04') + '>' + esc(t('ad.propagate.here')) + '</p>';
      h += '<div id="a05-msg" data-flash="A-05">' + msgHtml() + '</div>';

      if (!c) {
        h += '<div class="adm-state"><p' + A.el('A-05-C15') + '>' + esc(t('a05.c15')) + '</p>' +
             '<button type="button" class="btn btn--ghost adm-btn36" data-act="reload"' + A.el('A-05-B08') + '>' + esc(t('ad.retry')) + '</button></div>';
        return h + '</div>';
      }
      if (!n && !(open && S.row.mode === 'add')) {
        h += '<div class="adm-state"' + A.el('A-05-C13') + '><p class="bold">' + esc(t('a05.c13.l1')) + '</p><p>' + esc(t('a05.c13.l2')) + '</p></div>';
        return h + '</div>';
      }
      h += '<div class="adm-tablewrap"><table class="adm-table adm-table--cats"' + A.el('A-05-S02') + '>';
      h += '<thead><tr' + A.el('A-05-C07') + '><th class="adm-c-no">' + esc(t('a05.col.no')) + '</th><th>' + esc(t('a05.col.ar')) + '</th><th>' + esc(t('a05.col.en')) + '</th>' +
           '<th>' + esc(t('a05.col.products')) + '</th><th>' + esc(t('a05.col.store')) + '</th><th>' + esc(t('a05.col.order')) + '</th><th>' + esc(t('a05.col.actions')) + '</th></tr></thead><tbody>';
      c.categories.forEach(function (k, i) {
        if (open && S.row.mode === 'rename' && S.row.id === k.id) { h += inlineRow(); return; }
        var ct = counts(c, k.id);
        var full = ct.a + ct.r > 0;
        h += '<tr class="adm-crow" data-id="' + esc(k.id) + '"' + A.el('A-05-C08') + '>';
        h += '<td class="adm-c-no num">' + (i + 1) + '</td>';
        h += '<td lang="ar" dir="rtl" class="adm-c-name">' + esc(k.nameAr) + '</td>';
        h += '<td lang="en" dir="ltr" class="adm-c-name">' + esc(k.nameEn) + '</td>';
        h += '<td><span class="num">' + ct.a + '</span>' + (ct.r ? ' <span class="muted small">' + esc(t('a05.removedPlus', { R: ct.r })) + '</span>' : '') + '</td>';
        h += '<td class="small">' + esc(t(ct.a >= 1 ? 'a05.shown' : 'a05.hidden')) + '</td>';
        h += '<td class="adm-c-order"><button type="button" class="adm-iconbtn" data-act="up" aria-label="' + esc(t('a05.b02')) + '"' + A.el('A-05-B02') + (i === 0 || open ? ' disabled' : '') + '>↑</button>' +
             '<button type="button" class="adm-iconbtn" data-act="down" aria-label="' + esc(t('a05.b03')) + '"' + A.el('A-05-B03') + (i === n - 1 || open ? ' disabled' : '') + '>↓</button></td>';
        h += '<td class="adm-c-act"><button type="button" class="adm-textbtn" data-act="rename"' + A.el('A-05-B04') + (open ? ' disabled' : '') + '>' + esc(t('a05.b04')) + '</button>' +
             '<button type="button" class="adm-textbtn" data-act="delete"' + A.el('A-05-B05') + (full || open ? ' disabled' : '') + '>' + esc(t('a05.b05')) + '</button></td>';
        h += '</tr>';
      });
      if (open && S.row.mode === 'add') h += inlineRow();
      h += '</tbody></table></div>';
      if (n) h += '<p class="adm-note"' + A.el('A-05-C11') + '>' + esc(t('a05.c11')) + '</p>';
      return h + '</div>';
    },

    mount: function (root) {
      root.addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]');
        if (!b || !root.contains(b) || b.disabled) return;
        var act = b.getAttribute('data-act');
        var tr = b.closest('.adm-crow');
        var id = tr ? tr.getAttribute('data-id') : null;
        if (act === 'reload') { A.renderView(); return; }
        if (act === 'add') {
          S.row = { mode: 'add', ar: '', en: '', initAr: '', initEn: '', errors: {}, tried: false };
          A.renderView(); focusRow('F01'); return;
        }
        if (act === 'rename') {
          var c0 = load(), k0 = null;
          c0.categories.forEach(function (x) { if (x.id === id) k0 = x; });
          if (!k0) return;
          S.row = { mode: 'rename', id: id, ar: k0.nameAr, en: k0.nameEn, initAr: k0.nameAr, initEn: k0.nameEn, errors: {}, tried: false };
          A.renderView(); focusRow('F01', true); return;
        }
        if (act === 'rowsave') { save(); return; }
        if (act === 'rowcancel') { S.row = null; A.renderView(); return; }
        if (act === 'up' || act === 'down') {
          var c = load();
          var i = -1; c.categories.forEach(function (x, j) { if (x.id === id) i = j; });
          var j2 = i + (act === 'up' ? -1 : 1);
          if (i < 0 || j2 < 0 || j2 >= c.categories.length) return;
          var tmp = c.categories[i]; c.categories[i] = c.categories[j2]; c.categories[j2] = tmp;
          renumber(c);
          S.failed = !A.Cat.save(c); S.notice = null;
          A.renderView();
          var again = document.querySelector('.adm-crow[data-id="' + id + '"] [data-act="' + act + '"]');
          if (again && !again.disabled) again.focus();
          return;
        }
        if (act === 'delete') {
          var c2 = load(), k2 = null;
          c2.categories.forEach(function (x) { if (x.id === id) k2 = x; });
          if (k2) A.Modal.open('AM-02', { variant: 'C', from: 'A-05', category: k2 });
        }
      });
      var ins = root.querySelectorAll('.adm-inline input');
      for (var i = 0; i < ins.length; i++) bindInline(ins[i]);
    }
  };

  function bindInline(el) {
    var prop = el.getAttribute('data-prop');
    var f = el.closest('[data-field]').getAttribute('data-field');
    el.addEventListener('input', function () {
      if (/[\r\n]/.test(el.value)) el.value = A.oneLine(el.value);
      S.row[prop] = el.value;
      var c = document.querySelector('[data-counter="' + f + '"]');
      if (c) { var u = len(el.value); c.textContent = u + '/24'; c.classList.toggle('is-over', u > NAME_MAX); }
    });
    el.addEventListener('blur', function () {
      if (!S.row) return;
      var collapsed = el.value.replace(/ {2,}/g, ' ');           // §7.1, visibly
      if (collapsed !== el.value) { el.value = collapsed; S.row[prop] = collapsed; }
      if (S.row.tried) {
        var v = validateRow();
        S.row.errors[f] = v.errors[f];
        if (!v.errors[f]) delete S.row.errors[f];
        var box = el.closest('[data-field]');
        box.classList.toggle('field--error', !!v.errors[f]);
        var p = box.querySelector('.adm-ferr');
        p.textContent = v.errors[f] ? t(v.errors[f]) : '';
        if (v.errors[f]) p.removeAttribute('hidden'); else p.setAttribute('hidden', '');
      }
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); save(); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); S.row = null; A.renderView(); }
    });
  }

  function save() {
    var r = commit();
    A.renderView();
    if (r === 'invalid' || r === 'failed') focusRow();
  }

  function focusRow(f, atEnd) {
    var r = S.row;
    var which = f || (r && r.focus) || 'F01';
    if (r) r.focus = null;
    var el = document.getElementById('a05-' + which);
    if (el) { el.focus(); if (atEnd) { var n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} } }
  }

  /* AM-02 variant C: delete an empty category (fresh read, re-checked). */
  A.a05 = {
    remove: function (id) {
      var c = load();
      if (!c) { S.failed = true; return false; }
      var ct = counts(c, id);
      var k = null, i = -1;
      c.categories.forEach(function (x, j) { if (x.id === id) { k = x; i = j; } });
      if (!k) return true;
      if (ct.a + ct.r > 0) {                                      // §6.3 case 6
        S.notice = 'a05.notEmpty'; S.failed = false;
        setTimeout(function () { if (S.notice === 'a05.notEmpty') { S.notice = null; var n = document.getElementById('a05-msg'); if (n) n.innerHTML = msgHtml(); } }, 5000);
        return false;
      }
      c.categories.splice(i, 1);
      renumber(c);
      var ok = A.Cat.save(c);
      S.failed = !ok; S.notice = null;
      if (ok) A.setFlash('A-05', 'a05.c05.delete', { nameAr: k.nameAr, nameEn: k.nameEn }, 5000);
      return ok;
    }
  };

  A.views['A-05'] = view;
})();

</script>

    'a06.err.date.old':    { ar: 'تُحفظ الطلبات 365 يومًا فقط — أقدم تاريخ متاح {date}', en: 'Orders are kept for 365 days only — the earliest available date is {date}' },
    'a06.err.date.order':  { ar: 'تاريخ البداية بعد تاريخ النهاية', en: 'The start date is after the end date' },
    /* §7.3 */
    'a06.err.room.chars': { ar: 'رقم الغرفة يحتوي على أرقام وحروف لاتينية وشرطة أو مسافة فقط', en: 'A room number contains only digits, Latin letters, a hyphen or a space' },
    'a06.err.room.long':  { ar: 'رقم الغرفة 6 خانات كحد أقصى', en: 'A room number is 6 characters at most' },
    /* §7.7 — CSV header */
    'a06.csv.no':     { ar: 'رقم الطلب', en: 'Order number' },
    'a06.csv.date':   { ar: 'التاريخ', en: 'Date' },
    'a06.csv.time':   { ar: 'الوقت', en: 'Time' },
    'a06.csv.room':   { ar: 'الغرفة', en: 'Room' },
    'a06.csv.phone':  { ar: 'رقم الجوال', en: 'Mobile number' },
    'a06.csv.status': { ar: 'الحالة', en: 'Status' },
    'a06.csv.pay':    { ar: 'الدفع', en: 'Payment' },
    'a06.csv.amount': { ar: 'المبلغ الذي سيدفع به', en: 'Amount the guest will pay with' },
    'a06.csv.items':  { ar: 'المنتجات', en: 'Items' },
    'a06.csv.units':  { ar: 'عدد القطع', en: 'Units' },
    'a06.csv.total':  { ar: 'الإجمالي ({label})', en: 'Total ({label})' },
    'a06.csv.notes':  { ar: 'الملاحظات', en: 'Notes' },
    'a06.csv.last':   { ar: 'آخر تغيير للحالة', en: 'Last status change' },
    'a06.csv.reason': { ar: 'سبب الإلغاء', en: 'Cancellation reason' }
  });

  var PER_PAGE = 50;
  var PERIODS = ['today', '7d', '30d'];
  var S = {};

  function defaults() {
    return { p: '30d', from: null, to: null, status: '', room: '', page: 1 };
  }

  /* ---- URL ⇄ applied filters (§7.6) ---- */
  function fromQuery(q) {
    var f = defaults(), bad = false;
    if (q.p && PERIODS.indexOf(q.p) >= 0) f.p = q.p;
    else if (q.p === 'custom') {
      var a = A.parseIso(q.from), b = A.parseIso(q.to);
      if (a && b && !rangeError(a, b)) { f.p = 'custom'; f.from = a; f.to = b; } else bad = true;
    } else if (q.p) bad = true;
    if (q.status) { if (HotelDB.STATUSES.indexOf(q.status) >= 0) f.status = q.status; else bad = true; }
    if (q.room) { var r = roomNorm(q.room); if (!roomError(r)) f.room = A.trim(r); else bad = true; }
    if (q.page) { var n = parseInt(q.page, 10); if (n >= 1 && String(n) === String(q.page)) f.page = n; else bad = true; }
    return { f: f, bad: bad };
  }
  function toHash(f) {
    return A.buildHash('/orders', {
      p: f.p, from: f.p === 'custom' ? A.isoYMD(f.from) : '', to: f.p === 'custom' ? A.isoYMD(f.to) : '',
      status: f.status, room: f.room, page: f.page > 1 ? f.page : ''
    });
  }
  function syncUrl() { A.replaceHash(toHash(S.f)); }
  function isDefault(f) { return f.p === '30d' && !f.status && !f.room; }

  function rangeOf(f) { return f.p === 'custom' ? A.range(f.from, f.to) : A.period(f.p); }

  /* ---- Field rules ---- */
  function roomNorm(v) { return A.toWestern(v); }
  function roomError(v) {
    var s = A.trim(v);
    if (!s) return null;
    if (!/^[0-9A-Za-z\- ]+$/.test(s)) return 'a06.err.room.chars';
    if (s.length > 6) return 'a06.err.room.long';
    return null;
  }
  function parseDate(raw) {
    var v = A.trim(A.toWestern(raw)).replace(/[-.]/g, '/');
    if (!v) return { err: 'a06.err.date.empty' };
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v);
    if (!m) return { err: 'a06.err.date.format' };
    var ymd = { y: +m[3], m: +m[2], d: +m[1] };
    var chk = A.ymdAdd(ymd, 0);
    if (ymd.m < 1 || ymd.m > 12 || ymd.d < 1 || chk.y !== ymd.y || chk.m !== ymd.m || chk.d !== ymd.d) return { err: 'a06.err.date.real' };
    if (A.ymdCmp(ymd, A.today()) > 0) return { err: 'a06.err.date.future' };
    if (A.ymdCmp(ymd, A.earliestYMD()) < 0) return { err: 'a06.err.date.old' };
    return { ymd: ymd };
  }
  function rangeError(a, b) {
    if (A.ymdCmp(b, A.today()) > 0 || A.ymdCmp(a, A.earliestYMD()) < 0) return true;
    return A.ymdCmp(a, b) > 0;
  }

  /* ---- The "fetch": the whole filtered set, newest first ---- */
  function fetch() {
    try {
      var f = S.f, rng = rangeOf(f);
      var room = f.room ? f.room.toLowerCase() : '';
      var list = A.ordersIn(rng).filter(function (o) {
        if (f.status && o.status !== f.status) return false;
        if (room && A.trim(o.roomNumber).toLowerCase() !== room) return false;
        return true;
      });
      var sum = { orders: list.length, delivered: 0, revenue: 0, cash: 0, card: 0 };
      list.forEach(function (o) {
        if (o.status !== 'Delivered') return;
        var tot = Number(o.total) || 0;
        sum.delivered++; sum.revenue += tot;
        if (o.payment === 'cash') sum.cash += tot; else sum.card += tot;
      });
      S.list = list; S.sum = sum; S.anyEver = A.orders().length > 0; S.failed = false;
      var pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
      if (f.page > pages) { f.page = pages; syncUrl(); }
    } catch (e) { S.failed = true; S.list = []; S.sum = null; }
    S.fetchedAt = Date.now();
  }

  /* ---- CSV (§7.7) ---- */
  function cell(v) {
    var s = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;                    // formula guard
    if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function reasonOf(o) {
    if (o.status !== 'Cancelled') return '';
    var ar = A.trim(o.cancelReasonAr), en = A.trim(o.cancelReasonEn);
    return I18N.lang === 'en' ? (en || ar) : (ar || en);
  }
  A.a06 = { reasonOf: reasonOf };
  function buildCsv(list) {
    var s = A.settings();
    var label = I18N.lang === 'en' ? (s.currencyEn || 'SAR') : (s.currencyAr || 'ر.س');
    var head = ['no', 'date', 'time', 'room', 'phone', 'status', 'pay', 'amount', 'items', 'units', 'total', 'notes', 'last', 'reason']
      .map(function (k) { return cell(t('a06.csv.' + k, { label: label })); }).join(',');
    var rows = [head];
    list.forEach(function (o) {
      var items = (o.lines || []).map(function (l) { return (Number(l.qty) || 0) + ' × ' + A.lineName(l); }).join(' | ');
      var last = o.updatedAt || o.cancelledAt || o.createdAt;
      rows.push([
        o.orderNo, A.fmtDate(o.createdAt), A.fmtTime(o.createdAt), o.roomNumber,
        /* The stored "+…" value. cell() applies the formula guard to it like
           every other cell, so a leading "+" is written as '+… (§7.7). */
        o.phone || '',
        t('ad.status.' + o.status), t(o.payment === 'cash' ? 'ad.pay.cash' : 'ad.pay.card'),
        o.payment === 'cash' && o.amount != null && o.amount !== '' ? String(o.amount) : '',
        items, A.units(o), A.amount(o.total), o.notes || '', A.fmtDT(last), reasonOf(o)
      ].map(cell).join(','));
    });
    return '﻿' + rows.join('\r\n') + '\r\n';
  }
  function exportCsv() {
    S.exporting = true; S.exportFailed = false; A.renderView();
    setTimeout(function () {
      try {
        fetch();
        var csv = buildCsv(S.list);
        var rng = rangeOf(S.f);
        var name = 'orders_' + A.isoYMD(rng.fromYMD) + '_' + A.isoYMD(rng.toYMD) + '.csv';
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name; a.style.display = 'none';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 1000);
        A.lastCsv = { name: name, text: csv };
      } catch (e) { S.exportFailed = true; }
      S.exporting = false;
      if (A.cur.id === 'A-06') A.renderView();
    }, 50);
  }

  /* ---- Rendering ---- */
  function fig(el, label, value) {
    return '<div class="adm-fig adm-fig--88"' + A.el(el) + '><div class="adm-fig__label">' + esc(label) + '</div>' +
           '<div class="adm-fig__value adm-fig__value--24">' + esc(value) + '</div></div>';
  }
  function filterErr(field) {
    var k = S.errs[field];
    if (!k) return '';
    return '<p class="error adm-ferr"' + A.el('A-06-C04') + '>' + esc(t(k, { date: A.fmtYMD(A.earliestYMD()) })) + '</p>';
  }
  function hasErr() { return !!(S.errs.from || S.errs.to || S.errs.room); }

  var view = {
    enter: function (params, query) {
      var r = fromQuery(query || {});
      S = { f: r.f, errs: {}, exporting: false, exportFailed: false };
      S.sel = r.f.p;
      S.roomText = r.f.room;
      S.fromText = r.f.p === 'custom' ? A.fmtYMD(r.f.from) : '';
      S.toText = r.f.p === 'custom' ? A.fmtYMD(r.f.to) : '';
      if (r.bad) syncUrl(); else syncUrl();
      fetch();
    },
    render: function () {
      var f = S.f;
      var h = '<div class="adm-page">';
      var empty = !S.failed && !S.list.length;
      var canExport = !empty && !S.failed && !S.exporting && !hasErr();
      h += '<div class="adm-head"' + A.el('A-06-S01') + '><div class="adm-head__title"><h1 class="adm-title"' + A.el('A-06-C01') + '>' + esc(t('a06.c01')) + '</h1>' +
           '<span class="adm-fresh"><span' + A.el('A-06-C02') + '>' + esc(t('ad.updated', { time: A.fmtTime(S.fetchedAt) })) + '</span>' +
           '<button type="button" class="btn btn--ghost adm-btn36" data-act="refresh"' + A.el('A-06-B01') + '>' + esc(t('ad.refresh')) + '</button></span></div>' +
           '<div class="adm-head__end"><button type="button" class="btn btn--ghost adm-btn40" data-act="export"' + A.el('A-06-B02') + (canExport ? '' : ' disabled') + '>' +
           (S.exporting ? '<span' + A.el('A-06-C03') + '>' + esc(t('a06.c03')) + '</span>' : esc(t('a06.b02'))) + '</button></div></div>';
      if (S.exportFailed) h += '<p class="error"' + A.el('A-06-C19') + '>' + esc(t('a06.c19')) + '</p>';

      /* Filters */
      h += '<div class="adm-filters adm-filters--wrap"' + A.el('A-06-S02') + '>';
      h += '<label class="adm-flabel"><span>' + esc(t('a06.f01')) + '</span><select class="adm-input adm-input--40 adm-w200"' + A.el('A-06-F01') + '>';
      PERIODS.concat(['custom']).forEach(function (k) {
        h += '<option value="' + k + '"' + (S.sel === k ? ' selected' : '') + '>' + esc(t('a06.f01.' + k)) + '</option>';
      });
      h += '</select></label>';
      if (S.sel === 'custom') {
        h += '<label class="adm-flabel' + (S.errs.from ? ' field--error' : '') + '"><span>' + esc(t('a06.f02')) + '</span><input type="text" inputmode="numeric" class="adm-input adm-input--40 adm-w140 num" data-date="from"' + A.el('A-06-F02') + ' value="' + esc(S.fromText) + '">' + filterErr('from') + '</label>';
        h += '<label class="adm-flabel' + (S.errs.to ? ' field--error' : '') + '"><span>' + esc(t('a06.f03')) + '</span><input type="text" inputmode="numeric" class="adm-input adm-input--40 adm-w140 num" data-date="to"' + A.el('A-06-F03') + ' value="' + esc(S.toText) + '">' + filterErr('to') + '</label>';
        h += '<button type="button" class="btn btn--ghost adm-btn40 adm-self-end" data-act="apply"' + A.el('A-06-B03') + '>' + esc(t('a06.b03')) + '</button>';
      }
      h += '<label class="adm-flabel"><span>' + esc(t('a06.f04')) + '</span><select class="adm-input adm-input--40 adm-w240"' + A.el('A-06-F04') + '>';
      h += '<option value="">' + esc(t('a06.f04.all')) + '</option>';
      HotelDB.STATUSES.forEach(function (k) {
        h += '<option value="' + k + '"' + (f.status === k ? ' selected' : '') + '>' + esc(t('ad.status.' + k)) + '</option>';
      });
      h += '</select></label>';
      h += '<label class="adm-flabel' + (S.errs.room ? ' field--error' : '') + '"><span>' + esc(t('a06.f05')) + '</span><input type="text" dir="ltr" autocomplete="off" class="adm-input adm-input--40 adm-w140"' + A.el('A-06-F05') + ' value="' + esc(S.roomText) + '">' + filterErr('room') + '</label>';
      h += '<button type="button" class="adm-textbtn adm-self-end" data-act="clear"' + A.el('A-06-B04') + (isDefault(f) ? ' hidden' : '') + '>' + esc(t('ad.clearFilters')) + '</button>';
      h += '</div>';
      h += '<p class="adm-note"' + A.el('A-06-C05') + '>' + esc(t('a06.c05', { date: A.fmtYMD(A.earliestYMD()) })) + '</p>';

      /* Summary strip */
      var s = S.sum, dash = S.failed;
      h += '<div class="adm-figs adm-figs--5"' + A.el('A-06-S03') + '>';
      h += fig('A-06-C06', t('a06.c06'), dash ? '—' : A.count(s.orders));
      h += fig('A-06-C07', t('a06.c07'), dash ? '—' : A.count(s.delivered));
      h += fig('A-06-C08', t('a06.c08'), dash ? '—' : A.money(s.revenue));
      h += fig('A-06-C09', t('a06.c09'), dash ? '—' : A.money(s.cash));
      h += fig('A-06-C10', t('a06.c10'), dash ? '—' : A.money(s.card));
      h += '</div><p class="adm-foot"' + A.el('A-06-C11') + '>' + esc(t('ad.revenueNote')) + '</p>';

      /* Table */
      h += '<section class="adm-list"' + A.el('A-06-S04') + '>';
      if (S.failed) {
        h += '<div class="adm-state"><p' + A.el('A-06-C18') + '>' + esc(t('a06.c18')) + '</p><button type="button" class="btn btn--ghost adm-btn36" data-act="refresh"' + A.el('A-06-B08') + '>' + esc(t('ad.retry')) + '</button></div>';
      } else if (empty) {
        if (!S.anyEver && isDefault(f)) h += '<div class="adm-state"' + A.el('A-06-C15') + '><p class="bold">' + esc(t('a06.c15.l1')) + '</p><p>' + esc(t('a06.c15.l2')) + '</p></div>';
        else h += '<div class="adm-state"' + A.el('A-06-C16') + '><p>' + esc(t('a06.c16')) + '</p><button type="button" class="adm-textbtn" data-act="clear"' + A.el('A-06-B04') + '>' + esc(t('ad.clearFilters')) + '</button></div>';
      } else {
        var pages = Math.max(1, Math.ceil(S.list.length / PER_PAGE));
        var page = Math.min(f.page, pages);
        var slice = S.list.slice((page - 1) * PER_PAGE, page * PER_PAGE);
        h += '<div class="adm-tablewrap"><table class="adm-table adm-table--orders"><thead><tr' + A.el('A-06-C12') + '>' +
             ['no', 'time', 'room', 'items', 'total', 'pay', 'status'].map(function (k) { return '<th>' + esc(t('a06.col.' + k)) + '</th>'; }).join('') +
             '</tr></thead><tbody>';
        slice.forEach(function (o) {
          h += '<tr class="adm-orow" tabindex="0" data-no="' + esc(o.orderNo) + '"' + A.el('A-06-C13') + '>' +
               '<td class="num" data-cell="no"' + A.el('A-06-B05') + '>' + esc(o.orderNo) + '</td>' +
               '<td><span class="num">' + esc(A.fmtDT(o.createdAt)) + '</span></td>' +
               '<td><span class="num adm-room">' + esc(o.roomNumber) + '</span></td>' +
               '<td>' + esc(A.itemsLabel(A.units(o))) + '</td>' +
               '<td>' + esc(A.money(o.total)) + '</td>' +
               '<td>' + esc(t(o.payment === 'cash' ? 'ad.pay.cash' : 'ad.pay.card')) + '</td>' +
               '<td><span class="adm-pill adm-pill--status">' + esc(t('ad.status.' + o.status)) + '</span></td></tr>';
        });
        h += '</tbody></table></div>';
        if (pages > 1) {
          h += '<div class="adm-pager"' + A.el('A-06-S05') + '>' +
               '<button type="button" class="btn btn--ghost adm-btn36" data-act="prev"' + A.el('A-06-B06') + (page <= 1 ? ' disabled' : '') + '>' + esc(t('a06.b06')) + '</button>' +
               '<span class="small"' + A.el('A-06-C14') + '>' + esc(t('a06.c14', { p: page, P: pages })) + '</span>' +
               '<button type="button" class="btn btn--ghost adm-btn36" data-act="next"' + A.el('A-06-B07') + (page >= pages ? ' disabled' : '') + '>' + esc(t('a06.b07')) + '</button></div>';
        }
      }
      h += '</section></div>';
      return h;
    },

    mount: function (root) {
      function apply(resetPage) {
        if (resetPage) S.f.page = 1;
        syncUrl(); fetch(); A.renderView();
      }
      root.addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]');
        if (b && root.contains(b)) {
          if (b.disabled) return;
          var act = b.getAttribute('data-act');
          if (act === 'refresh') { fetch(); A.renderView(); }
          else if (act === 'export') exportCsv();
          else if (act === 'clear') {
            S.f = defaults(); S.sel = '30d'; S.errs = {}; S.roomText = ''; S.fromText = ''; S.toText = '';
            apply(true);
          } else if (act === 'apply') applyCustom();
          else if (act === 'prev' || act === 'next') { S.f.page += act === 'prev' ? -1 : 1; syncUrl(); A.renderView(); window.scrollTo(0, 0); }
          return;
        }
        var row = e.target.closest('.adm-orow');
        if (row && root.contains(row)) A.Modal.open('AM-03', { orderNo: row.getAttribute('data-no') });
      });
      root.addEventListener('keydown', function (e) {
        var row = e.target.closest && e.target.closest('.adm-orow');
        if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); A.Modal.open('AM-03', { orderNo: row.getAttribute('data-no') }); }
      });

      var per = root.querySelector('[data-el="A-06-F01"]');
      per.addEventListener('change', function () {
        if (per.value === 'custom') {
          /* Prefilled with the boundaries of the selected period; nothing
             is applied until Apply (§4 F01). */
          var rng = rangeOf(S.f);
          S.sel = 'custom'; S.fromText = A.fmtYMD(rng.fromYMD); S.toText = A.fmtYMD(rng.toYMD); S.errs.from = null; S.errs.to = null;
          A.renderView();
          var ff = document.querySelector('[data-el="A-06-F02"]'); if (ff) ff.focus();
        } else {
          S.sel = per.value; S.f.p = per.value; S.f.from = null; S.f.to = null; S.errs.from = null; S.errs.to = null;
          apply(true);
        }
      });
      var st = root.querySelector('[data-el="A-06-F04"]');
      st.addEventListener('change', function () { S.f.status = st.value; apply(true); });

      var dates = root.querySelectorAll('[data-date]');
      for (var i = 0; i < dates.length; i++) (function (el) {
        var which = el.getAttribute('data-date');
        el.addEventListener('input', function () {
          var w = A.toWestern(el.value);                 // converted as typed
          if (w !== el.value) { var p = el.selectionStart; el.value = w; try { el.setSelectionRange(p, p); } catch (x) {} }
          if (which === 'from') S.fromText = el.value; else S.toText = el.value;
        });
        el.addEventListener('blur', function () {
          var v = A.trim(A.toWestern(el.value)).replace(/[-.]/g, '/');
          var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v);
          if (m) v = A.pad2(+m[1]) + '/' + A.pad2(+m[2]) + '/' + m[3];   // padded on blur
          el.value = v;
          if (which === 'from') S.fromText = v; else S.toText = v;
        });
        el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); el.blur(); applyCustom(); } });
      })(dates[i]);

      var room = root.querySelector('[data-el="A-06-F05"]');
      room.addEventListener('input', function () {
        var w = A.toWestern(room.value);
        if (w !== room.value) { var p = room.selectionStart; room.value = w; try { room.setSelectionRange(p, p); } catch (x) {} }
        S.roomText = room.value;
      });
      function applyRoom() {
        var v = A.trim(room.value);
        var err = roomError(v);
        S.errs.room = err;
        if (!err && v !== S.f.room) { S.f.room = v; apply(true); return; }
        if (err || (!err && hadRoomErr)) A.renderView();
      }
      var hadRoomErr = !!S.errs.room;
      room.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); applyRoom(); } });
      room.addEventListener('change', applyRoom);
    }
  };

  function applyCustom() {
    var a = parseDate(S.fromText), b = parseDate(S.toText);
    S.errs.from = a.err || null; S.errs.to = b.err || null;
    if (!a.err && !b.err && A.ymdCmp(a.ymd, b.ymd) > 0) S.errs.from = 'a06.err.date.order';
    if (S.errs.from || S.errs.to) { A.renderView(); return; }
    S.f.p = 'custom'; S.f.from = a.ymd; S.f.to = b.ymd; S.f.page = 1;
    S.fromText = A.fmtYMD(a.ymd); S.toText = A.fmtYMD(b.ymd);
    syncUrl(); fetch(); A.renderView();
  }

  A.views['A-06'] = view;
})();

</script>

  });

  /* The two presets, stored in the data layer's real roomFormat shape. */
  var PRESETS = {
    p1: { minLen: 1, maxLen: 5, allowLetters: false, separator: '', requireDigit: true },
    p2: { minLen: 1, maxLen: 6, allowLetters: true, separator: '-', requireDigit: true }
  };
  function presetOf(fmt) {
    if (!fmt) return 'p1';
    var r = HotelDB.roomRule(fmt);           // the data layer's own normalisation
    for (var k in PRESETS) {
      var p = PRESETS[k];
      if (r.minLen === p.minLen && r.maxLen === p.maxLen && r.allowLetters === p.allowLetters &&
          r.separator === p.separator && r.requireDigit === p.requireDigit) return k;
    }
    return null;                             // AM-04 §5.5: "Unrecognised format"
  }

  var S = null, clock = null, tzList = null;

  function fromSettings(s) {
    return { nameAr: s.hotelNameAr || '', nameEn: s.hotelNameEn || '', curAr: s.currencyAr || '', curEn: s.currencyEn || '',
             tz: A.validTz(s.timeZone) ? s.timeZone : 'Asia/Riyadh', preset: presetOf(s.roomFormat) };
  }
  function len(s) { return A.trim(s).length; }

  function curError(v, which) {
    var s = A.trim(v);
    if (!s) return 'a07.err.' + which + '.empty';
    if (s.length > 4) return 'a07.err.cur.long';
    if (/[0-9٠-٩۰-۹\s]/.test(s)) return 'a07.err.cur.chars';
    return null;
  }
  function validate() {
    var v = S.v, e = {}, order = [];
    function put(f, k) { e[f] = k; order.push(f); }
    if (!len(v.nameAr)) put('F01', 'a07.err.f01.empty'); else if (len(v.nameAr) > 24) put('F01', 'a07.err.f01.long');
    if (!len(v.nameEn)) put('F02', 'a07.err.f02.empty'); else if (len(v.nameEn) > 24) put('F02', 'a07.err.f02.long');
    var c3 = curError(v.curAr, 'f03'); if (c3) put('F03', c3);
    var c4 = curError(v.curEn, 'f04'); if (c4) put('F04', c4);
    return { errors: e, order: order };
  }
  function differs(a, b) {
    return A.trim(a.nameAr) !== A.trim(b.nameAr) || A.trim(a.nameEn) !== A.trim(b.nameEn) ||
           A.trim(a.curAr) !== A.trim(b.curAr) || A.trim(a.curEn) !== A.trim(b.curEn) ||
           a.tz !== b.tz || a.preset !== b.preset;
  }
  function otherEdits() {                     // AM-04 C13: F01–F05 only
    var a = S.v, b = S.saved;
    return A.trim(a.nameAr) !== A.trim(b.nameAr) || A.trim(a.nameEn) !== A.trim(b.nameEn) ||
           A.trim(a.curAr) !== A.trim(b.curAr) || A.trim(a.curEn) !== A.trim(b.curEn) || a.tz !== b.tz;
  }
  function isDirty() { return !!S && !S.loadFailed && differs(S.v, S.saved); }

  /* The settings record as it will be written (§7.7). */
  function record(presetKey) {
    var v = S.v;
    var squash = function (x) { return A.trim(A.oneLine(x)).replace(/ {2,}/g, ' '); };
    return { hotelNameAr: squash(v.nameAr), hotelNameEn: squash(v.nameEn), currencyAr: A.trim(v.curAr), currencyEn: A.trim(v.curEn),
             timeZone: v.tz, roomFormat: PRESETS[presetKey] ? JSON.parse(JSON.stringify(PRESETS[presetKey])) : undefined };
  }

  function afterSaved() {
    S.saved = fromSettings(A.settings());
    S.v = JSON.parse(JSON.stringify(S.saved));
    S.errors = {}; S.tried = false; S.saveFailed = false;
    A.setFlash('A-07', 'a07.c19', {}, 5000);
    A.refreshHotelName();

  /* Save with the format unchanged — also AM-01's "Save and continue". */
  function commit() {
    if (!S || S.busy) return 'failed';
    var r = validate();
    S.tried = true; S.errors = r.errors; S.saveFailed = false;
    if (r.order.length) { S.focus = r.order[0]; return 'invalid'; }
    if (S.v.preset !== S.saved.preset) return 'failed';     // only AM-04 may save it
    S.busy = true;
    var rec = record(S.saved.preset);
    if (!rec.roomFormat) delete rec.roomFormat;              // unchanged, untouched
    var ok = false;
    try { ok = HotelDB.saveSettings(rec) !== false; } catch (e) { ok = false; }
    S.busy = false;
    if (!ok) { S.saveFailed = true; return 'failed'; }
    afterSaved();
    return 'ok';
  }

  function zones() {
    if (tzList) return tzList;
    var ids = [];
    try { if (Intl.supportedValuesOf) ids = Intl.supportedValuesOf('timeZone'); } catch (e) { ids = []; }
    if (!ids.length) ids = ['Asia/Riyadh', 'Asia/Dubai', 'Asia/Kuwait', 'Asia/Qatar', 'Asia/Bahrain', 'Asia/Amman', 'Africa/Cairo', 'Europe/London', 'UTC'];
    ids = ids.filter(A.validTz);
    var now = Date.now();
    tzList = ids.map(function (id) { return { id: id, off: A.offset(now, id), label: id + ' (' + A.offsetLabel(id, now) + ')' }; })
      .sort(function (a, b) { return (a.off - b.off) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0); });
    return tzList;
  }

    mount: function (root) {

        var act = b.getAttribute('data-act');
        if (act === 'reload') { view.enter(); A.renderView(); }
        else if (act === 'pwshow') {
          S.pw.show = !S.pw.show;
          var ins = root.querySelectorAll('[data-pw]');
          for (var i = 0; i < ins.length; i++) ins[i].type = S.pw.show ? 'text' : 'password';
          b.textContent = t(S.pw.show ? 'a07.b02.hide' : 'a07.b02.show');
        } else if (act === 'pwchange') changePassword();
      });
      var form = root.querySelector('form');
      if (!form) return;
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!isDirty() || S.busy) return;
        if (S.v.preset !== S.saved.preset) {
          var r = validate();
          S.tried = true; S.errors = r.errors; S.saveFailed = false;
          if (r.order.length) { S.focus = r.order[0]; A.renderView(); focusFirst(); return; }  // AM-04 does not open
          A.Modal.open('AM-04', { from: S.saved.preset, to: S.v.preset });

        }
        commit();
        A.renderView();
        focusFirst();
      });

      var ins = root.querySelectorAll('[data-prop]');
      for (var i = 0; i < ins.length; i++) bindField(ins[i]);
      var tz = root.querySelector('#a07-F05');

        el.addEventListener('input', function () {
          S.pw[prop] = el.value;
          if (S.pw.errors[f]) {                       // each message clears when its field is edited
            delete S.pw.errors[f];
            var box = el.closest('[data-field]'); box.classList.remove('field--error');
            var pe = box.querySelector('.adm-ferr'); pe.textContent = ''; pe.setAttribute('hidden', '');
          }
          if (S.pw.result && S.pw.result !== 'a07.c25.ok') { S.pw.result = null; var r = document.querySelector('[data-el="A-07-C25"]'); if (r) r.parentNode.removeChild(r); }
          var p = S.pw;
          var b3 = document.querySelector('[data-el="A-07-B03"]'); if (b3) b3.disabled = !(p.cur && p.nw && p.conf) || p.busy;
          var b2 = document.querySelector('[data-el="A-07-B02"]'); if (b2) { if (p.cur || p.nw || p.conf) b2.removeAttribute('hidden'); else b2.setAttribute('hidden', ''); }
        });
        if (prop === 'conf') el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); changePassword(); } });
      })(pws[m]);

      if (clock) clearInterval(clock);
      clock = setInterval(updateClock, 60000);
    }
  };

  function msgHtml() {
    if (!S) return '';
    if (S.saveFailed) return '<p class="error"' + A.el('A-07-C18') + '>' + esc(t('ad.formSaveFail')) + '</p>';
    if (S.tried && Object.keys(S.errors).length) return '<p class="error"' + A.el('A-07-C17') + '>' + esc(t('ad.checkFields')) + '</p>';
    if (A.getFlash('A-07')) return '<p class="adm-confirm"' + A.el('A-07-C19') + '>' + esc(t('a07.c19')) + '</p>';
    return '';
  }

  function bindField(el) {
    var prop = el.getAttribute('data-prop');
    var f = el.closest('[data-field]').getAttribute('data-field');
    el.addEventListener('input', function () {
      if (/[\r\n]/.test(el.value)) el.value = A.oneLine(el.value);

      if (c) { var u = len(el.value); c.textContent = u + '/24'; c.classList.toggle('is-over', u > 24); }
      if (prop === 'curAr' || prop === 'curEn') {
        var old = document.getElementById('a07-c06');
        if (old) { var w = document.createElement('div'); w.innerHTML = currencyPreview(); old.parentNode.replaceChild(w.firstChild, old); }
      }
      updateSave();
    });
    el.addEventListener('blur', function () {
      if (!S) return;
      if (prop === 'nameAr' || prop === 'nameEn') {

        if (c2 !== el.value) { el.value = c2; S.v[prop] = c2; }
      }
      if (S.tried) {
        var k = validate().errors[f];
        if (k) S.errors[f] = k; else delete S.errors[f];
        var box = el.closest('[data-field]');
        box.classList.toggle('field--error', !!k);
        var p = box.querySelector('[data-err]');
        p.textContent = k ? t(k) : '';
        if (k) p.removeAttribute('hidden'); else p.setAttribute('hidden', '');

  function updateSave() {
    var b = document.querySelector('[data-el="A-07-B01"]');

  }
  function updateClock() {
    var n = document.getElementById('a07-clock');

  }
  function focusFirst() {
    if (!S || !S.focus) return;
    var el = document.getElementById('a07-' + S.focus);

    if (el) el.focus();
  }

  function changePassword() {
    var p = S.pw;
    if (p.busy || !(p.cur && p.nw && p.conf)) return;
    var e = {};
    var rec = HotelDB.admin() || {};
    if (!p.cur) e.F07 = 'a07.err.f07.empty';
    if (!p.nw) e.F08 = 'a07.err.f08.empty';
    else if (p.nw.length < 8) e.F08 = 'a07.err.f08.short';
    else if (p.nw.length > 72) e.F08 = 'a07.err.f08.long';
    else if (p.nw === p.cur) e.F08 = 'a07.err.f08.same';
    else if (p.nw.toLowerCase() === String(rec.email || '').toLowerCase()) e.F08 = 'a07.err.f08.email';
    if (!p.conf) e.F09 = 'a07.err.f09.empty';
    else if (p.conf !== p.nw) e.F09 = 'a07.err.f09.diff';
    p.errors = e; p.result = null;
    if (Object.keys(e).length) { A.renderView(); return; }
    p.busy = true; p.show = false; A.renderView();
    setTimeout(function () {
      if (!S) return;
      var a = null;
      try { a = HotelDB.admin(); } catch (x) { a = null; }
      p.busy = false;
      if (!a) { p.result = 'a07.err.pw.conn'; A.renderView(); return; }
      if (a.passwordHash !== HotelDB.hashPassword(p.cur)) {
        if (A.fails.add()) {                       // the fifth: the session ends, A-01 locked
          A.endSession(); A.forgetNext(); A.notice = null;
          S = null; A.navigate('#/signin', { force: true });
          return;
        }
        p.errors = { F07: 'a07.err.f07.wrong' };
        A.renderView();
        return;
      }
      a.passwordHash = HotelDB.hashPassword(p.nw);
      /* A new session id: this browser stays signed in, any session held
         elsewhere under the old id is no longer the account's session. */
      if (a.session) a.session.id = 's' + Date.now().toString(36);
      var ok = HotelDB.saveAdmin(a) !== false;
      if (!ok) { p.result = 'a07.err.pw.conn'; A.renderView(); return; }
      p.cur = ''; p.nw = ''; p.conf = ''; p.errors = {}; p.result = 'a07.c25.ok';
      A.renderView();
      setTimeout(function () {
        if (S && S.pw === p && p.result === 'a07.c25.ok') {
          p.result = null;
          var r = document.querySelector('[data-el="A-07-C25"]'); if (r) r.parentNode.removeChild(r);
        }
      }, 10000);
    }, 200);
  }

  /* For AM-04. */
  A.a07 = {
    PRESETS: PRESETS,
    presetOf: presetOf,
    otherEdits: function () { return !!S && otherEdits(); },
    record: function (presetKey) { return record(presetKey); },

    revertFormat: function () {

      if (r) r.focus();
    },
    saved: function () { afterSaved(); A.renderView(); }
  };

  A.views['A-07'] = view;
})();

  /* ================================================================== *
   * AM-04 — Change room number format. The live test runs the guest's own
   * rule — HotelDB.roomRule(candidate).test(value) — on the UNSAVED
   * format, and "Confirm change" stays disabled until a real room passes.
   * ================================================================== */
  var am04 = null;

  function candidate() { return A.a07.PRESETS[am04.to]; }
  function rule() { return HotelDB.roomRule(candidate()); }
  function testValue() { return A.trim(A.toWestern(am04.value)); }
  /* The message the guest's G-04 prints for this reason under this rule:
     the default rule keeps G-04 §7.1's own strings; any other rule prints
     the messages HotelDB.roomRule() hands the guest (views-checkout.js). */
  function guestMessage(r, reason) {
    if (r.isDefault && (reason === 'chars' || reason === 'long')) return t('am04.g04.' + reason);
    var m = r.messages && r.messages[reason];
    return m ? (m[I18N.lang] || m.ar) : '';
  }
  function verdict() {
    var v = testValue();
    if (!v) return { state: 'empty', value: v };
    var r = rule();
    var reason = r.test(v);
    return reason ? { state: 'no', value: v, msg: guestMessage(r, reason), reason: reason } : { state: 'ok', value: v };
  }
  function confirmEnabled() {
    return !am04.busy && !am04.checking && verdict().state === 'ok';
  }

  function runHistory() {
    try {
      var list = A.orders();
      if (!list.length) { am04.history = { kind: 'none' }; return; }
      var seen = {}, distinct = [];
      list.forEach(function (o) {                       // newest first: the first spelling is the latest
        var raw = A.trim(o.roomNumber);
        if (!raw) return;
        var k = raw.toLowerCase();
        if (seen[k]) return;
        seen[k] = true;
        distinct.push(raw);
      });
      var r = rule();
      var refused = distinct.filter(function (v) { return r.test(v) !== ''; });
      am04.history = { kind: refused.length ? 'refused' : 'ok', N: refused.length, M: distinct.length, examples: refused.slice(0, 5) };
    } catch (e) { am04.history = { kind: 'fail' }; }
  }

  function presetName(k) { return k === 'p1' || k === 'p2' ? t('am04.' + k + '.name') : t('am04.unknown'); }
  function presetSum(k) { return k === 'p1' || k === 'p2' ? '<div class="small">' + esc(t('am04.' + k + '.sum')) + '</div>' : ''; }

  function historyHtml() {
    var hs = am04.history;
    var h = '';
    if (am04.checking) return '<p class="small"' + A.el('AM-04-C05') + '>' + esc(t('am04.c05.checking')) + '</p>';
    if (hs.kind === 'none') return '<p class="small"' + A.el('AM-04-C05') + '>' + esc(t('am04.c05.none')) + '</p>';
    if (hs.kind === 'fail') return '<p class="small"' + A.el('AM-04-C05') + '>' + esc(t('am04.c05.fail')) + '</p>';
    if (hs.kind === 'ok') return '<p class="small"' + A.el('AM-04-C05') + '>' + esc(t('am04.c05.ok', { M: A.count(hs.M) })) + '</p>';
    h += '<p class="small"' + A.el('AM-04-C05') + '>' + esc(t('am04.c05.' + A.bucket(hs.N), { N: A.count(hs.N) })) + '</p>';
    h += '<p class="small"' + A.el('AM-04-C06') + '>' + esc(t('am04.c06')) + ' ' +
         hs.examples.map(function (x) { return '<span class="num adm-am04-ex">' + esc(x) + '</span>'; }).join(I18N.lang === 'en' ? ', ' : '، ') + '</p>';
    h += '<p class="small"' + A.el('AM-04-C07') + '>' + esc(t('am04.c07')) + '</p>';
    return h;
  }

  function resultHtml() {
    var v = verdict();
    if (v.state === 'empty') return '<div class="adm-am04-res small"' + A.el('AM-04-C10') + '>' + esc(t('am04.c10.empty')) + '</div>';
    var shown = '⁦' + v.value + '⁩';

           '<div class="small">' + esc(t('am04.c10.no.2', { msg: v.msg })) + '</div>' +
           '<div class="small">' + esc(t('am04.c10.no.3')) + '</div></div>';
  }

  function refreshAm04(card) {
    var res = card.querySelector('[data-el="AM-04-C10"]');

  function confirmChange() {
    if (!confirmEnabled()) return;
    am04.busy = true; am04.saveErr = null; M.redraw();
    /* §5.4 step 2 — the re-check, against the exact value about to be
       written, as the last step before the write. */
    var v = testValue();
    var fmt = candidate();
    if (HotelDB.roomRule(fmt).test(v) !== '') {
      am04.busy = false; am04.saveErr = 'am04.c11.recheck'; M.redraw(); return;
    }
    var rec = A.a07.record(am04.to);
    rec.roomFormatChangedAt = Date.now();
    rec.roomFormatChangedBy = A.account();
    var ok = false;
    try { ok = HotelDB.saveSettings(rec) !== false; } catch (e) { ok = false; }
    /* §5.4 step 4 — success is a write AND a read-back of the new format. */
    if (ok) {
      try { ok = A.a07.presetOf(HotelDB.settings().roomFormat) === am04.to; } catch (e) { ok = false; }
    }
    am04.busy = false;
    if (!ok) { am04.saveErr = 'ad.formSaveFail'; M.redraw(); return; }
    am04 = null;
    M.close();
    A.a07.saved();
  }

      var f = card.querySelector('#am04-f01');
      f.addEventListener('input', function () {
        var w = A.toWestern(f.value);                    // converted as typed, visibly
        if (w.length > 20) w = w.slice(0, 20);
        if (w !== f.value) { var pos = f.selectionStart; f.value = w; try { f.setSelectionRange(pos, pos); } catch (e) {} }
        am04.value = f.value;
        refreshAm04(card);
      });
      f.addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });   // Enter saves nothing
      card.addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]');
        if (!b || b.disabled) return;
        if (b.getAttribute('data-act') === 'cancel') am04Cancel();
        else confirmChange();
      });
      if (first) f.focus();
    },
    backdrop: function () {}, esc: function () {}, back: function () {}   // closes only by its two buttons
  };
})();

</script>
<script>Admin.start();</script>
</body>
