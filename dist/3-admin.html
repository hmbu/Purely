<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم متجر الفندق — Hotel store dashboard</title>
<style>
/* app/css/app.css */
/* ==========================================================================
   Hotel In-Room Store — guest web app
   Single stylesheet. Plain, ordinary, clean: neutral greys, one calm accent
   (muted teal), soft borders, almost no shadow, no gradients, no animation
   beyond short transitions. System fonts only — nothing is loaded remotely.

   RTL is the default (index.html ships dir="rtl"); i18n.js flips
   <html dir> to "ltr" for English. Every direction-dependent rule below uses
   logical properties (inline-start / inline-end / margin-inline / text-align
   start|end), so this one file serves both directions with no [dir=] forks
   except the two places where a glyph must physically mirror.

   Sections
     1  Tokens
     2  Reset and base
     3  App shell and demo bar
     4  Screen, header, category bar
     5  Buttons and tap areas
     6  Product grid, cards, stepper, badges
     7  Bottom bars (cart bar, action bar)
     8  Lines, summaries, totals
     9  Forms, errors, notices
    10  Modals: backdrop, bottom sheet, centred dialog
    11  Timeline
    12  Toast, empty, loading
    13  Utilities
   ========================================================================== */

/* 1 — Tokens =============================================================== */

:root {
  /* Neutrals */
  --c-page:          #e9ebed;   /* the desk around the phone column */
  --c-surface:       #ffffff;
  --c-surface-2:     #f4f5f6;   /* quiet fills: image boxes, summary blocks */
  --c-ink:           #1b1e20;   /* body text, primary fill */
  --c-ink-2:         #555d63;   /* secondary text, ≥ 4.5:1 on white */
  --c-ink-3:         #767e84;   /* not-yet-reached labels, still ≥ 4.5:1 */
  --c-border:        #dde1e4;
  --c-border-strong: #b6bdc2;

  /* One accent, used sparingly: links, active chip, focus ring */
  --c-accent:        #13706a;
  --c-accent-dark:   #0e5852;
  --c-accent-soft:   #e7f0ef;

  /* Danger — always paired with the "!" icon slot and a border, never alone */
  --c-danger:        #8c2f24;
  --c-danger-soft:   #fbf1f0;

  /* Type scale (px, as the spec states its sizes in px) */
  --t-micro:  10px;   /* "My orders" label, the one 10px string in the spec */
  --t-mini:   12px;   /* counters, banner lines 2–3 */
  --t-small:  14px;   /* minimum body size */
  --t-body:   16px;   /* default, and the minimum on form fields (no zoom) */
  --t-lg:     18px;   /* screen and modal titles */
  --t-xl:     20px;
  --t-2xl:    22px;   /* G-06 status headline */
  --t-room:   28px;   /* room number inline in a sentence */
  --t-huge:   64px;   /* M-01 room number */

  /* Spacing */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;

  /* Radius */
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-pill: 999px;

  /* Layout */
  --app-w:     390px;
  --topbar-h:  60px;
  --catbar-h:  52px;
  --bottom-h:  64px;   /* cart bar / action bar, excluding the safe area */
  --safe-b:    env(safe-area-inset-bottom, 0px);

  --shadow: 0 1px 2px rgba(0, 0, 0, .06);
  --ring:   0 0 0 2px var(--c-surface), 0 0 0 4px var(--c-accent);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Arabic",
          "Segoe UI Arabic", "Geeza Pro", Roboto, Tahoma, Arial, sans-serif;
}

/* 2 — Reset and base ======================================================= */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0; font-family: var(--font); font-size: var(--t-body);
  line-height: 1.5; color: var(--c-ink); background: var(--c-page);
}

h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
img { max-width: 100%; display: block; }
a { color: var(--c-accent); }

button, input, select, textarea { font: inherit; color: inherit; margin: 0; }

/* 16px on every typed field so mobile browsers never auto-zoom on focus. */
input, select, textarea { font-size: var(--t-body); }

:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--r-sm); }

/* A component that sets its own `display` (every .error, .notice, .row and
   flex block below) would otherwise beat the browser's [hidden] rule and show
   an empty box — an error with no message is a bare "!" in a circle. The views
   hide a message by setting `hidden`, so that has to be the stronger rule. */
[hidden] { display: none !important; }

body.is-modal-open { overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* 3 — App shell and demo bar =============================================== */

/* The phone column. On a desktop it is centred on a plain grey page. */
.app {
  max-width: var(--app-w); min-height: 100vh; margin-inline: auto;
  background: var(--c-surface); border-inline: 1px solid var(--c-border);
  position: relative;
}

/* Not part of the product: a plain dark strip in small type, above the app. */
.demo-bar {
  background: #23262a; color: #d8dbde; font-size: var(--t-mini);
  line-height: 1.4; padding: var(--s-2) var(--s-3); display: flex;
  flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3);
  border-block-end: 2px dashed #4a4f55;
}
.demo-bar__tag {
  font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: #ffffff; border: 1px solid #6b7278; border-radius: var(--r-sm);
  padding: 1px var(--s-2);
}
.demo-bar label { display: inline-flex; align-items: center; gap: var(--s-1); }
.demo-bar select, .demo-bar button {
  font-size: var(--t-mini); background: #34383d; color: #f0f2f3;
  border: 1px solid #5a6066; border-radius: var(--r-sm);
  padding: 3px var(--s-2);
}
.demo-bar button { cursor: pointer; }

/* 4 — Screen, header, category bar ========================================= */

.screen { display: block; padding-block-end: calc(var(--s-5) + var(--safe-b)); }
/* Room for whichever bar is pinned at the bottom. */
body:has(.cartbar, .actionbar) .screen { padding-block-end: calc(var(--bottom-h) + var(--s-4) + var(--safe-b)); }
/* G-03's bar stacks the totals block and the helper line above the button, so
   it stands taller than the 64px the token assumes and needs its own reserve. */
body:has(.actionbar--tall) .screen { padding-block-end: calc(168px + var(--safe-b)); }

.screen__body { padding: var(--s-4); }

/* --- Sticky header ------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 30; min-height: var(--topbar-h);
  display: grid; grid-template-columns: 56px 1fr 56px; align-items: center;
  gap: var(--s-2); padding: var(--s-2) var(--s-3);
  background: var(--c-surface); border-block-end: 1px solid var(--c-border);
}
.topbar__side { display: flex; align-items: center; }
.topbar__side--end { justify-content: flex-end; }
.topbar__main { text-align: center; min-width: 0; }
.topbar__title {
  font-size: var(--t-lg); font-weight: 700; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar__sub { font-size: var(--t-mini); color: var(--c-ink-2); }

/* Icon button with a label under it (B02 "My orders"): 10px is allowed there. */
.iconbtn {
  background: none; border: 0; padding: var(--s-1); display: inline-flex;
  flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  color: var(--c-ink);
}
.iconbtn__glyph { font-size: 20px; line-height: 1; }
.iconbtn__label { font-size: var(--t-micro); line-height: 1.2; }

/* --- Active-order banner ------------------------------------------------- */
.banner {
  display: block; width: 100%; min-height: 84px; text-align: start;
  background: var(--c-accent-soft); border: 0;
  border-block-end: 1px solid var(--c-border);
  border-inline-start: 4px solid var(--c-accent);
  padding: var(--s-3) var(--s-4); cursor: pointer; color: inherit;
}
/* Three lines, each on its own line: the views mark them up as spans inside
   the one button that is the whole banner, so the display is set here. */
.banner__line1,
.banner__line2,
.banner__line3 { display: block; }
.banner__line1 { font-size: var(--t-small); font-weight: 700; }
.banner__line2,
.banner__line3 { font-size: var(--t-mini); color: var(--c-ink-2); }
.banner__line3 { color: var(--c-accent-dark); font-weight: 600; margin-block-start: 2px; }

/* --- Sticky category bar ------------------------------------------------- */
.catbar {
  position: sticky; top: var(--topbar-h); z-index: 20;
  background: var(--c-surface); border-block-end: 1px solid var(--c-border);
  padding: var(--s-2) var(--s-3);
}
.catbar__row {
  display: flex; gap: var(--s-2); overflow-x: auto; scroll-behavior: smooth;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.catbar__row::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto; min-height: 32px; display: inline-flex; align-items: center;
  padding-inline: var(--s-3); font-size: var(--t-small); white-space: nowrap;
  background: var(--c-surface-2); color: var(--c-ink);
  border: 1px solid var(--c-border); border-radius: var(--r-pill);
  cursor: pointer; transition: background-color .15s ease, color .15s ease;
}
.chip--active { background: var(--c-ink); color: #ffffff; border-color: var(--c-ink); font-weight: 600; }

.section__title {
  font-size: var(--t-body);
  font-weight: 700;
  padding: var(--s-4) var(--s-4) var(--s-2);
  scroll-margin-block-start: calc(var(--topbar-h) + var(--catbar-h));
}

/* 5 — Buttons and tap areas ================================================ */

.btn {
  position: relative; display: inline-flex; align-items: center;
  justify-content: center; gap: var(--s-2); min-height: 48px;
  padding-inline: var(--s-4); font-size: var(--t-body); font-weight: 700;
  text-align: center; text-decoration: none; background: var(--c-surface);
  color: var(--c-ink); border: 1px solid var(--c-border-strong);
  border-radius: var(--r-md); cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
}
.btn--primary { background: var(--c-ink); color: #ffffff; border-color: var(--c-ink); }
.btn--primary:hover { background: #000000; }
/* Outlined secondary. The 2px border is the M-01 §5.3 rule and is safe
   everywhere: a secondary must never read as a display box. */
.btn--ghost {
  background: transparent;
  border: 2px solid var(--c-ink);
  color: var(--c-ink);
}
.btn--ghost:hover { background: var(--c-surface-2); }
/* A bare text action (e.g. "Edit cart"), still 44px tall for the tap area. */
.btn--link {
  min-height: 44px; padding-inline: var(--s-2); background: none; border: 0;
  border-radius: 0; color: var(--c-accent-dark); font-weight: 600;
  text-decoration: underline;
}
.btn--block { display: flex; width: 100%; }
.btn--tall  { min-height: 56px; }
.btn--sm    { min-height: 40px; font-size: var(--t-small); padding-inline: var(--s-3); }

/* Disabled never relies on colour: reduced opacity + greyscale + a dashed
   border + the not-allowed cursor, so it reads in grayscale and for a
   colour-blind guest. */
.btn[disabled],
.btn.is-disabled,
.btn[aria-disabled="true"],
.stepper__btn[disabled] {
  opacity: .5;
  filter: grayscale(1);
  border-style: dashed;
  cursor: not-allowed;
  pointer-events: none;
}

/* Minimum 44 x 44 tap area around controls whose visible shape is smaller.
   The overlay is a pseudo-element of the control itself, so a tap on it is a
   tap on the control; centring is direction-neutral, so no RTL fork needed. */
.tap, .chip, .iconbtn, .btn--sm, .btn--link, .stepper__btn, .card__add {
  position: relative;
}
.tap::after, .chip::after, .iconbtn::after, .btn--sm::after, .btn--link::after, .stepper__btn::after, .card__add::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%); width: 100%; height: 100%;
  min-width: 44px; min-height: 44px; z-index: 1;
}

/* 6 — Product grid, cards, stepper, badges ================================= */

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s-3);
  padding-inline: var(--s-4);
}

.card {
  display: flex; flex-direction: column; gap: var(--s-2);
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: var(--r-md); padding: var(--s-2); text-align: start;
  cursor: pointer; color: inherit;
}
.card__img {
  aspect-ratio: 1 / 1; width: 100%; background: var(--c-surface-2);
  border-radius: var(--r-sm); object-fit: cover; display: flex;
  align-items: center; justify-content: center; font-size: 32px;
  color: var(--c-border-strong); overflow: hidden;
}
.card__name {
  font-size: var(--t-small); line-height: 1.35; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: calc(var(--t-small) * 1.35 * 2);
}
.card__price { font-size: var(--t-small); font-weight: 700; }
.card__action {
  position: relative; z-index: 1; min-height: 40px; display: flex;
  align-items: center; margin-block-start: auto;
}
.card__add {
  width: 100%; min-height: 40px; border: 1px solid var(--c-ink);
  border-radius: var(--r-sm); background: var(--c-surface);
  font-size: var(--t-small); font-weight: 700; cursor: pointer;
}
.card__add:hover { background: var(--c-surface-2); }
/* Dimmed photo of an out-of-stock product: on a card the state lives on the
   card, on G-02 there is no card, so the box carries the modifier itself. */
.card--out .card__img,
.card__img--dim { opacity: .5; }
/* The photo inside a placeholder box. The box is the grey placeholder and
   stays visible on its own; views-shop.js removes the <img> when it fails to
   load, so nothing else has to change. Shared with the 56px line thumbnail. */
.card__img > img,
.line__media > img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
/* G-02 shows the same box at the 4:3 of the detail screen (G-02 §5.2). */
.card__img--wide { aspect-ratio: 4 / 3; }

/* Stepper: two 40x40 controls with the quantity between them. */
.stepper {
  display: grid; grid-template-columns: 40px 1fr 40px; align-items: center;
  width: 100%; min-height: 40px; border: 1px solid var(--c-border-strong);
  border-radius: var(--r-sm); overflow: visible;
}
.stepper__btn {
  width: 40px; height: 40px; display: inline-flex; align-items: center;
  justify-content: center; font-size: var(--t-lg); font-weight: 700;
  line-height: 1; background: none; border: 0; cursor: pointer;
}
.stepper__qty {
  text-align: center;
  font-size: var(--t-small);
  font-weight: 700;
  direction: ltr;
  unicode-bidi: isolate;
}
.stepper__note {
  font-size: var(--t-mini);
  color: var(--c-ink-2);
  text-align: center;
  margin-block-start: var(--s-1);
}

/* Badges: state on a card or a list row, carried by text plus border. */
.badge {
  display: inline-flex; align-items: center; min-height: 24px;
  padding-inline: var(--s-2); font-size: var(--t-mini); font-weight: 600;
  border: 1px solid var(--c-border-strong); border-radius: var(--r-sm);
  background: var(--c-surface-2); color: var(--c-ink-2);
}
.badge--out    { border-style: dashed; color: var(--c-ink); }
.badge--status { background: var(--c-ink); border-color: var(--c-ink); color: #fff; }
.badge--block  { display: flex; width: 100%; min-height: 40px; justify-content: center; font-size: var(--t-small); }

/* 7 — Bottom bars ========================================================== */

/* Both bars are pinned to the bottom of the phone column, not the viewport
   edge, so they stay under the app on a desktop screen. Centring with
   left/translate is direction-neutral. */
.cartbar, .actionbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: var(--app-w); z-index: 40;
  background: var(--c-surface); border-block-start: 1px solid var(--c-border);
  padding: var(--s-2) var(--s-3) calc(var(--s-2) + var(--safe-b));
  box-shadow: 0 -1px 2px rgba(0, 0, 0, .05);
}

.cartbar__btn {
  width: 100%; min-height: 48px; display: grid;
  grid-template-columns: auto 1fr auto; align-items: center; gap: var(--s-3);
  padding-inline: var(--s-4); background: var(--c-ink); color: #ffffff;
  border: 0; border-radius: var(--r-md); cursor: pointer; text-align: start;
}
.cartbar__count { font-size: var(--t-small); }
.cartbar__label { font-size: var(--t-body); font-weight: 700; text-align: center; }
.cartbar__total { font-size: var(--t-body); font-weight: 700; }

.actionbar__row { display: flex; flex-direction: column; gap: var(--s-2); }
.actionbar .btn { width: 100%; }

/* 8 — Lines, summaries, totals ============================================= */

/* One row of an order or cart: quantity, name, price. */
.line {
  display: grid; grid-template-columns: auto 1fr auto; align-items: start;
  gap: var(--s-3); padding-block: var(--s-3);
  border-block-end: 1px solid var(--c-border); font-size: var(--t-small);
}
.line:last-child { border-block-end: 0; }
.line__qty { min-width: 32px; font-weight: 700; direction: ltr; unicode-bidi: isolate; text-align: start; }
.line__name { line-height: 1.4; }
.line__sub  { display: block; font-size: var(--t-mini); color: var(--c-ink-2); }
.line__price { font-weight: 700; white-space: nowrap; }
.line__media {
  width: 56px;
  height: 56px;
  border-radius: var(--r-sm);
  background: var(--c-surface-2);
  flex: 0 0 auto;
  /* Centres the generic glyph and clips a photo to the rounded corners. */
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
/* A row that is one run of text rather than quantity | name | price, but
   still one row of a list with its separator (M-04 C03). */
.line--plain { display: block; }
.line--out .line__name { color: var(--c-ink-2); }
.line--out .line__media { opacity: .5; }

.panel {
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: var(--s-4);
  margin: var(--s-4);
}
.panel__title { font-size: var(--t-body); font-weight: 700; margin-block-end: var(--s-2); }

.total {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s-3); padding-block-start: var(--s-3);
  margin-block-start: var(--s-2);
  border-block-start: 1px solid var(--c-border-strong);
}
.total__label { font-size: var(--t-body); font-weight: 700; }
.total__value { font-size: var(--t-lg); font-weight: 700; }

/* 9 — Forms, errors, notices =============================================== */

.field { display: block; padding: var(--s-4) var(--s-4) 0; }
.field__label { display: block; font-size: var(--t-small); font-weight: 700; margin-block-end: var(--s-2); }
.field__input, .field__area {
  width: 100%; min-height: 56px; padding: var(--s-3) var(--s-4);
  font-size: var(--t-body); background: var(--c-surface); color: var(--c-ink);
  border: 1px solid var(--c-border-strong); border-radius: var(--r-md);
  transition: border-color .15s ease;
}
.field__input:focus,
.field__area:focus { border-color: var(--c-accent); }
.field__input--big { font-size: 24px; font-weight: 700; direction: ltr; unicode-bidi: isolate; text-align: start; }
.field__area { min-height: 96px; resize: vertical; line-height: 1.5; }
.field__hint,
.field__counter { font-size: var(--t-small); color: var(--c-ink-2); margin-block-start: var(--s-1); }
.field__counter { font-size: var(--t-mini); direction: ltr; unicode-bidi: isolate; text-align: end; }
/* A helper line between a field's label and the field itself (G-04-C16). */
.field__hint--above { margin-block: 0 var(--s-2); }
.field__counter--full { font-weight: 700; color: var(--c-ink); }

/* A field with a static suffix inside it (the currency label on F03). */
.field__wrap { position: relative; display: block; }
.field__suffix {
  position: absolute; inset-block: 0; inset-inline-end: var(--s-4);
  display: flex; align-items: center; font-size: var(--t-small);
  color: var(--c-ink-2); pointer-events: none;
}
.field__wrap:has(.field__suffix) .field__input { padding-inline-end: 72px; }

/* Error state: a heavier border AND an icon AND the message. Never colour
   alone — the screen must still read in grayscale. */
.field--error .field__input,
.field--error .field__area {
  border-width: 2px;
  border-color: var(--c-danger);
  background: var(--c-danger-soft);
}
.error, .notice {
  display: flex; align-items: flex-start; gap: var(--s-2);
  font-size: var(--t-small); line-height: 1.45;
  margin-block-start: var(--s-2);
}
.error { color: var(--c-danger); }
.notice {
  color: var(--c-ink);
  background: var(--c-surface-2);
  border: 1px solid var(--c-border-strong);
  border-radius: var(--r-md);
  padding: var(--s-3);
}
.notice--flat { background: none; border: 0; padding: 0; }
/* The shared "!" icon slot. */
.error::before, .notice::before {
  content: "!"; flex: 0 0 auto; width: 20px; height: 20px;
  margin-block-start: 1px; display: inline-flex; align-items: center;
  justify-content: center; font-size: var(--t-mini); font-weight: 700;
  line-height: 1; border: 2px solid currentColor; border-radius: 50%;
}

/* Radio-style choice rows (payment method): 72px tall, selection shown by a
   2px border and a filled mark, not by colour. */
.choice {
  display: flex; align-items: center; gap: var(--s-3); width: 100%;
  min-height: 72px; padding: var(--s-3) var(--s-4); text-align: start;
  background: var(--c-surface); border: 1px solid var(--c-border-strong);
  border-radius: var(--r-md); cursor: pointer; color: inherit;
}
.choice + .choice { margin-block-start: var(--s-2); }
.choice__mark { flex: 0 0 auto; width: 22px; height: 22px; border: 2px solid var(--c-ink); border-radius: 50%; }
.choice__label { font-size: var(--t-body); font-weight: 700; }
.choice__sub   { display: block; font-size: var(--t-small); font-weight: 400; color: var(--c-ink-2); }

<script>
/* shared/hotel-db.js */
/* shared/hotel-db.js — window.HotelDB, the hotel's one memory.
   Contract: shared/CONTRACT.md (binding).

   There is no backend. The guest app (app/), the staff app (staff/) and the
   admin app (admin/) are static pages that share the browser's localStorage.
   HotelDB owns every key below; the apps never touch these keys directly.

     roomstore.catalog     { categories:[{id,nameAr,nameEn,order}],
                             products:[{id,nameAr,nameEn,descAr,descEn,price,
                                        category,inStock,removed}] }
     roomstore.settings    { hotelNameAr, hotelNameEn, currencyAr, currencyEn,
                             timeZone, roomFormat }
     roomstore.fakeserver  { byKey, byNo, nextNo } — the hotel's order table.
                           The SHAPE IS DEFINED BY app/js/store.js (its
                           ServerDB). Each order record, as the guest's
                           Server.submitOrder creates it:
                             { orderNo, key, roomNumber,
                               phone ('+' then 8–15 digits, G-04 §7.11;
                                      '' on orders placed before it existed),
                               lines:[{productId,nameAr,nameEn,qty,price}],
                               notes, payment ('card'|'cash'), amount (null|string),
                               total, status, createdAt (ms), fingerprint }
                           Fields HotelDB adds as the order moves (all optional,
                           absent on a fresh order):
                             updatedAt        ms of the last status change
                             log              [{ status, at, staffId }] one row
                                              per change, oldest first
                             cancelledFrom    last forward status reached before
                                              Cancelled ('New'|'Accepted'|'OnTheWay')
                             cancelledByGuest true only when the guest cancelled
                             cancelReasonAr   staff's reason, Arabic  ('' if none)
                             cancelReasonEn   staff's reason, English ('' if none)
                             cancelledBy      staffId, or 'guest'
                             cancelledAt      ms
                           The guest device record keeps ONE reason string,
                           `cancelReason`; store.js's getStatus copies the reason
                           in the guest's language into it (G-06 C08).
     roomstore.staff       { members:[{id,name,pin}], session:{memberId,since}|null }
     roomstore.admin       { email, passwordHash, session }

   Rules
   - Every read reloads from storage. Nothing is cached across calls: another
     tab may have written a moment ago. Reads hand back copies, so a caller
     can never mutate the stored value by accident.
   - Every write notifies onChange listeners in this tab; the browser's
     `storage` event notifies every other tab.
   - Plain ES5, no libraries. Demo credentials are plain demo values, not
     security (CONTRACT "Demo credentials").
*/
(function () {
  'use strict';

  var K = {
    catalog:  'roomstore.catalog',
    settings: 'roomstore.settings',
    orders:   'roomstore.fakeserver',
    staff:    'roomstore.staff',
    admin:    'roomstore.admin'
  };

  /* store.js's ServerDB starts numbering here; the two must agree. */
  var FIRST_ORDER_NO = 1042;

  /* The five canonical statuses (CONTRACT "Statuses", G-01 §5.2). */
  var FORWARD = ['New', 'Accepted', 'OnTheWay', 'Delivered'];
  var STATUSES = FORWARD.concat(['Cancelled']);

  /* ------------------------------------------------------------------ *
   * roomFormat — the room-number rule the manager sets (A-07 / AM-04).
   *
   *   roomFormat = {
   *     minLen:       1,      // integer >= 1  — fewest characters allowed
   *     maxLen:       5,      // integer >= minLen, <= 12 — most characters
   *     allowLetters: false,  // true: Latin letters A–Z / a–z allowed too
   *     separator:    '',     // '' (none) or '-' only — allowed
   *     requireDigit: true    //    between characters, never first, last or
   *   }                       //    doubled ("12-B" yes; "-12", "12--B" no).
   *                           //  requireDigit: at least one 0-9 somewhere, so a
   *                           //  lettered format still refuses "ABC".
   *
   * Length is counted on the whole trimmed value, separator included.
   * Digits are always allowed. Arabic-Indic digits are converted to 0–9 by
   * the guest's field before the rule sees them (G-04 §7.1).
   *
   * DEFAULT = { minLen:1, maxLen:5, allowLetters:false, separator:'' }:
   * digits only, 1 to 5 — exactly the guest's G-04 §7.1 behaviour, with its
   * three messages. Anything missing or invalid in a stored roomFormat falls
   * back to the default value for that field.
   * ------------------------------------------------------------------ */
  var DEFAULT_ROOM_FORMAT = { minLen: 1, maxLen: 5, allowLetters: false, separator: '', requireDigit: true };
  var SEPARATORS = ['-'];   // hyphen only: PM ruling on AM-04 disagreement 1
  var ROOM_LEN_CAP = 12;

  /* ------------------------------------------------------------------ *
   * Seeds (first run only; an existing value is never overwritten)
   * ------------------------------------------------------------------ */

  function seedSettings() {
    var D = window.Data || {};
    return {
      hotelNameAr: D.hotelNameAr || 'فندق الواحة',
      hotelNameEn: D.hotelNameEn || 'Al Waha Hotel',
      currencyAr: 'ر.س',
      currencyEn: 'SAR',
      timeZone: 'Asia/Riyadh',
      roomFormat: clone(DEFAULT_ROOM_FORMAT)
    };
  }

  function seedCatalog() {
    var D = window.Data;
    if (!D || !D.products) return null;          // nothing to seed from yet
    return {
      categories: (D.categories || []).map(function (c, i) {
        return { id: c.id, nameAr: c.nameAr, nameEn: c.nameEn, order: i };
      }),
      products: D.products.map(function (p) {
        return {
          id: p.id, nameAr: p.nameAr, nameEn: p.nameEn,
          descAr: p.descAr || '', descEn: p.descEn || '',
          price: Number(p.price), category: p.category,
          inStock: p.inStock !== false, removed: false
        };
      })
    };
  }

  function seedStaff() {
    return {
      members: [
        { id: 's-sara',   name: 'سارة / Sara',   pin: '1111' },
        { id: 's-khalid', name: 'خالد / Khalid', pin: '2222' }
      ],
      session: null
    };
  }

  function seedAdmin() {
    return {
      email: 'manager@alwaha.example',
      passwordHash: hashPassword('alwaha2026'),
      session: null
    };
  }

  /* ------------------------------------------------------------------ *
   * Storage helpers
   * ------------------------------------------------------------------ */

  function clone(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }

  function read(key) {
    try {
      var raw = localStorage.getItem(key);
      if (raw == null) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { return false; }
    notify(key, 'local');
    return true;
  }

  function ensure(key, seedFn) {
    var v = read(key);
    if (v != null) return v;
    v = seedFn();
    if (v != null) {
      try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
    }
    return v;
  }

  /* Not security — a demo prototype has no secrets (CONTRACT). FNV-1a, hex. */
  function hashPassword(s) {
    var h = 0x811c9dc5;
    s = String(s == null ? '' : s);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return 'fnv1a:' + ('0000000' + h.toString(16)).slice(-8);
  }

  /* ------------------------------------------------------------------ *
   * Change notification
   * ------------------------------------------------------------------ */

  var listeners = [];

  function notify(key, source) {
    var list = listeners.slice();
    for (var i = 0; i < list.length; i++) {
      try { list[i]({ key: key, source: source }); } catch (e) {}
    }
  }

  function isOwnedKey(key) {
    if (key == null) return true;                 // localStorage.clear()
    for (var k in K) if (K[k] === key) return true;
    return false;
  }

  if (window.addEventListener) {
    window.addEventListener('storage', function (e) {
      if (e.storageArea && e.storageArea !== window.localStorage) return;
      if (!isOwnedKey(e.key)) return;
      notify(e.key, 'remote');
    });
  }

  /* ------------------------------------------------------------------ *
   * Order table (shape owned by store.js — { byKey, byNo, nextNo })
   * ------------------------------------------------------------------ */

  function readTable() {
    var raw = read(K.orders);
    if (raw && raw.byKey) {
      return { byKey: raw.byKey, byNo: raw.byNo || {}, nextNo: raw.nextNo || FIRST_ORDER_NO };
    }
    return { byKey: {}, byNo: {}, nextNo: FIRST_ORDER_NO };
  }

  function writeTable(t) {
    return write(K.orders, { byKey: t.byKey, byNo: t.byNo, nextNo: t.nextNo });
  }

  function findIn(t, orderNo) {
    var key = t.byNo[String(orderNo)];
    return key ? t.byKey[key] || null : null;
  }

  function newestFirst(a, b) {
    if (b.createdAt !== a.createdAt) return (b.createdAt || 0) - (a.createdAt || 0);
    return Number(b.orderNo) - Number(a.orderNo);
  }

  function nextStatus(status) {
    var i = FORWARD.indexOf(status);
    return (i === -1 || i >= FORWARD.length - 1) ? null : FORWARD[i + 1];
  }

  function isFinal(status) { return status === 'Delivered' || status === 'Cancelled'; }

  /* Every staff/hotel change goes through here: reload, change one record,
     write back — in one synchronous step so no other code runs in between. */
  function changeOrder(orderNo, mutate) {
    var t = readTable();
    var order = findIn(t, orderNo);
    if (!order) return { ok: false, error: 'notFound', order: null };
    var err = mutate(order);
    if (err) return { ok: false, error: err, order: clone(order) };
    writeTable(t);
    return { ok: true, error: null, order: clone(order) };
  }

  function logRow(order, status, meta) {
    var at = (meta && meta.at) || Date.now();
    if (!order.log) order.log = [];
    order.log.push({ status: status, at: at, staffId: (meta && meta.staffId) || null });
    order.updatedAt = at;
  }

  /* ------------------------------------------------------------------ *
   * roomRule
   * ------------------------------------------------------------------ */

  function normaliseRoomFormat(f) {
    f = f || {};
    var d = DEFAULT_ROOM_FORMAT;
    var min = Math.floor(Number(f.minLen));
    var max = Math.floor(Number(f.maxLen));
    if (!(min >= 1 && min <= ROOM_LEN_CAP)) min = d.minLen;
    if (!(max >= 1 && max <= ROOM_LEN_CAP)) max = d.maxLen;
    if (max < min) max = min;
    return {
      minLen: min,
      maxLen: max,
      allowLetters: f.allowLetters === true,
      separator: SEPARATORS.indexOf(f.separator) !== -1 ? f.separator : '',
      requireDigit: f.requireDigit !== false
    };
  }

  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\\/-]/g, '\\$&'); }

  /* The rule the guest's G-04 F01 validates against.
     `pattern` tests the CHARACTERS only (which characters, and where the
     separator may sit); length is checked separately against minLen/maxLen,
     so the guest keeps G-04 §7.1's priority order: empty → wrong characters
     → too long (→ too short, only reachable when minLen > 1).
     `isDefault` is true when the rule is exactly the default, in which case
     the guest shows its own three reviewed messages (G-04 §7.1) unchanged.
     `messages` are for a NON-default rule only — PROVISIONAL copy until the
     admin spec (A-07 / AM-04) rules it. */
  function roomRule(format) {
    var f;
    if (format) {
      f = normaliseRoomFormat(format);
    } else {
      var s = settings();
      f = normaliseRoomFormat(s && s.roomFormat);
    }
    var cls = f.allowLetters ? '0-9A-Za-z' : '0-9';
    var sep = f.separator ? escapeRe(f.separator) : '';
    var pattern = sep
      ? new RegExp('^[' + cls + ']+(?:' + sep + '[' + cls + ']+)*$')
      : new RegExp('^[' + cls + ']+$');

    var isDefault = f.minLen === DEFAULT_ROOM_FORMAT.minLen &&
                    f.maxLen === DEFAULT_ROOM_FORMAT.maxLen &&
                    !f.allowLetters && !f.separator;

    var rangeAr = f.minLen === f.maxLen ? String(f.maxLen) : 'من ' + f.minLen + ' إلى ' + f.maxLen;
    var rangeEn = f.minLen === f.maxLen ? String(f.maxLen) : f.minLen + ' to ' + f.maxLen;
    var whatAr = f.allowLetters ? 'أرقام وحروف إنجليزية' : 'أرقام';
    var whatEn = f.allowLetters ? 'digits and letters A–Z' : 'digits';
    var sepAr = f.separator ? '، ويمكن استخدام «' + f.separator + '» بينها' : '';
    var sepEn = f.separator ? ', "' + f.separator + '" allowed between them' : '';

    return {
      pattern: pattern,
      minLen: f.minLen,
      maxLen: f.maxLen,
      allowLetters: f.allowLetters,
      separator: f.separator,
      requireDigit: f.requireDigit,
      isDefault: isDefault,
      /* One acceptance test for everyone. The guest's G-04 and admin's AM-04
         both call this, so the live test can never pass a value the guest
         would then refuse. Returns '' when valid, else 'empty' | 'chars' |
         'long' | 'short' | 'nodigit'. */
      test: function (value) {
        var v = String(value == null ? '' : value).trim();
        if (!v) return 'empty';
        if (!pattern.test(v)) return 'chars';
        if (v.length > f.maxLen) return 'long';
        if (v.length < f.minLen) return 'short';
        if (f.requireDigit && !/[0-9]/.test(v)) return 'nodigit';
        return '';
      },
      label: {
        ar: whatAr + ' فقط، ' + rangeAr + ' خانات' + sepAr,
        en: whatEn + ' only, ' + rangeEn + ' characters' + sepEn
      },
      messages: {
        chars: { ar: 'استخدم ' + whatAr + ' فقط' + sepAr,
                 en: 'Use ' + whatEn + ' only' + sepEn },
        long:  { ar: 'رقم الغرفة طويل جدًا: ' + f.maxLen + ' خانات كحد أقصى',
                 en: 'Room number is too long: ' + f.maxLen + ' characters at most' },
        short: { ar: 'رقم الغرفة قصير جدًا: ' + f.minLen + ' خانات على الأقل',
                 en: 'Room number is too short: ' + f.minLen + ' characters at least' },
        nodigit: { ar: 'رقم الغرفة يجب أن يحتوي على رقم واحد على الأقل',
                   en: 'The room number must contain at least one digit' }
      }
    };
  }

  /* ------------------------------------------------------------------ *
   * Public API
   * ------------------------------------------------------------------ */

  function catalog() {
    var c = read(K.catalog);
    if (!c) c = ensure(K.catalog, seedCatalog);
    if (!c) return { categories: [], products: [] };
    var cats = (c.categories || []).slice().sort(function (a, b) {
      return (a.order || 0) - (b.order || 0);
    });
    return { categories: clone(cats), products: clone(c.products || []) };
  }

  function settings() {
    return clone(ensure(K.settings, seedSettings));
  }

  var HotelDB = {
    keys: clone(K),
    STATUSES: STATUSES.slice(),
    FORWARD: FORWARD.slice(),
    DEFAULT_ROOM_FORMAT: clone(DEFAULT_ROOM_FORMAT),

    /* ---- catalog ---- */
    catalog: catalog,
    saveCatalog: function (c) {
      return write(K.catalog, {
        categories: (c && c.categories) || [],
        products: (c && c.products) || []
      });
    },

    /* ---- settings ---- */
    settings: settings,
    saveSettings: function (s) {
      var cur = settings() || seedSettings();
      for (var k in s) if (Object.prototype.hasOwnProperty.call(s, k)) cur[k] = s[k];
      cur.roomFormat = normaliseRoomFormat(cur.roomFormat);
      return write(K.settings, cur);
    },
    roomRule: roomRule,

    /* ---- orders ---- */
    orders: function () {
      var t = readTable(), out = [];
      for (var key in t.byKey) {
        if (Object.prototype.hasOwnProperty.call(t.byKey, key) && t.byKey[key]) out.push(t.byKey[key]);
      }
      out.sort(newestFirst);
      return clone(out);
    },

    getOrder: function (orderNo) {
      return clone(findIn(readTable(), orderNo));
    },

    nextStatus: nextStatus,

    /* Moves an order ONE step forward (New → Accepted → OnTheWay → Delivered),
       or cancels it when status is 'Cancelled' (delegates to cancel() with no
       reason). meta = { staffId, at }.
       Returns { ok, error, order }; error is one of
         'notFound'  — no such order
         'stale'     — the order is no longer at the step before `status`
                       (another tab moved it, or the guest cancelled); the
                       fresh order is returned so the caller can redraw
         'invalid'   — not a canonical status */
    setStatus: function (orderNo, status, meta) {
      if (status === 'Cancelled') {
        return HotelDB.cancel(orderNo, '', '', meta && meta.staffId, meta && meta.at);
      }
      if (FORWARD.indexOf(status) < 1) return { ok: false, error: 'invalid', order: HotelDB.getOrder(orderNo) };
      return changeOrder(orderNo, function (order) {
        if (nextStatus(order.status) !== status) return 'stale';
        order.status = status;
        logRow(order, status, meta);
        return null;
      });
    },

    /* A hotel/staff cancellation, allowed from any non-final status.
       cancelledByGuest stays false, so the guest's G-06 reads "The hotel
       cancelled this order" (with the reason when one is given).
       Returns { ok, error, order }; error 'notFound' or 'stale' (already
       Delivered or Cancelled). */
    cancel: function (orderNo, reasonAr, reasonEn, staffId, at) {
      var meta = { staffId: staffId || null, at: at || Date.now() };
      return changeOrder(orderNo, function (order) {
        if (isFinal(order.status)) return 'stale';
        order.cancelledFrom = order.status;
        order.cancelledByGuest = false;
        order.cancelReasonAr = String(reasonAr == null ? '' : reasonAr).trim();
        order.cancelReasonEn = String(reasonEn == null ? '' : reasonEn).trim();
        order.cancelledBy = meta.staffId;
        order.cancelledAt = meta.at;
        order.status = 'Cancelled';
        logRow(order, 'Cancelled', meta);
        return null;
      });
    },

    /* ---- staff and admin records (CONTRACT key table) ---- */
    staff: function () { return clone(ensure(K.staff, seedStaff)); },
    saveStaff: function (s) { return write(K.staff, s); },
    admin: function () { return clone(ensure(K.admin, seedAdmin)); },
    saveAdmin: function (a) { return write(K.admin, a); },
    hashPassword: hashPassword,

    /* fn({ key, source: 'local' | 'remote' }). Returns an unsubscribe fn. */
    onChange: function (fn) {
      if (typeof fn !== 'function') return function () {};
      listeners.push(fn);
      return function () {
        var i = listeners.indexOf(fn);
        if (i !== -1) listeners.splice(i, 1);
      };
    },

    /* ---- for app/js/store.js's fake server only ----
       The guest's Server creates orders and records guest cancellations with
       the client-order-key contract (G-04 §7.7), which lives in store.js.
       It reads and writes the raw table through these two, so the key and
       the shape stay owned here. Always a fresh read. */
    _readTable: function () { return readTable(); },
    _writeTable: function (t) { return writeTable(t); }
  };

  /* First run: seed what is missing, never overwrite what exists. */
  ensure(K.settings, seedSettings);
  ensure(K.catalog, seedCatalog);
  ensure(K.staff, seedStaff);
  ensure(K.admin, seedAdmin);

  window.HotelDB = HotelDB;
})();

</script>
<script>
/* app/js/i18n.js */
/* i18n — Arabic is the default on first open regardless of browser language,
   and the choice is saved on the device. Locked decision 7; map §4 decision 12. */
(function () {
  'use strict';

  var DICT = {};
  var LANG_KEY = 'roomstore.lang';

  function savedLang() {
    try { return localStorage.getItem(LANG_KEY); } catch (e) { return null; }
  }

  var I18N = {
    lang: savedLang() === 'en' ? 'en' : 'ar',

    register: function (entries) {
      for (var key in entries) {
        if (Object.prototype.hasOwnProperty.call(entries, key)) DICT[key] = entries[key];
