      if (!kv) return;
      var j = kv.indexOf('=');
      var k = j < 0 ? kv : kv.slice(0, j);
      var v = j < 0 ? '' : kv.slice(j + 1);
      try { query[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) {}
    });
    return { path: h, query: query };
  };
  A.buildHash = function (path, query) {
    var parts = [];
    for (var k in query) {
      if (Object.prototype.hasOwnProperty.call(query, k) && query[k] != null && query[k] !== '') {
        parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(query[k]));
      }
    }
    return '#' + path + (parts.length ? '?' + parts.join('&') : '');
  };

  function match(path) {
    for (var i = 0; i < ROUTES.length; i++) {
      var m = path.match(ROUTES[i].re);
      if (m) return { r: ROUTES[i], params: ROUTES[i].p ? ROUTES[i].p(m) : {} };
    }
    return null;
  }

  A.cur = { id: null, hash: '', params: {}, query: {}, nav: null };
  var expectHash = null;

  function curView() { return A.cur.id ? A.views[A.cur.id] : null; }
  A.curView = curView;

  /* Replaces the URL without a hashchange and without a history entry. */
  A.replaceHash = function (h) {
    try { history.replaceState(null, '', h); } catch (e) { location.replace(h); }
    A.cur.hash = h;
  };

  function route() {
    var h = location.hash || '#/overview';
    var ph = A.parseHash(h);
    var m = match(ph.path);
    if (!m) { h = '#/overview'; A.replaceHash(h); ph = A.parseHash(h); m = match(ph.path); }

    if (!m.r.pub && !A.session()) {
      if (A.sessionExpired()) { A.endSession(); A.notice = 'expired'; }
      ssSet(SS.next, h);                                  // A-01 §3.2: used once
      h = '#/signin'; A.replaceHash(h); ph = A.parseHash(h); m = match(ph.path);
    } else if (m.r.pub && A.session()) {
      h = '#/overview'; A.replaceHash(h); ph = A.parseHash(h); m = match(ph.path);
    }

    var prev = curView();
    if (prev && prev.leave) prev.leave();
    A.Modal.close();
    A.cur = { id: m.r.id, hash: h, params: m.params, query: ph.query, nav: m.r.nav || null };
    var v = curView();
    if (v && v.enter) v.enter(m.params, ph.query);
    A.render();
    window.scrollTo(0, 0);
    if (v && v.afterEnter) v.afterEnter();
  }
  A.route = route;

  /* A navigation the manager asked for. With an unsaved edit on the current
     screen it opens AM-01 first (admin-map §3.3 rule 2). */
  A.navigate = function (h, opts) {
    opts = opts || {};
    var v = curView();
    if (!opts.force && v && v.isDirty && v.isDirty()) {
      A.Modal.open('AM-01', { origin: A.cur.id, go: function () { A.navigate(h, { force: true }); } });
      return;
    }
    if (location.hash === h) { route(); return; }
    expectHash = h;
    location.hash = h;
  };

  /* After a successful sign-in: the remembered admin address, used once. */
  A.takeNext = function () {
    var n = ssGet(SS.next);
    ssDel(SS.next);
    if (!n) return null;
    var m = match(A.parseHash(n).path);
    return (m && !m.r.pub) ? n : null;
  };
  A.forgetNext = function () { ssDel(SS.next); };

  A.signOut = function () {
    var v = curView();
    var go = function () {
      var vv = curView();
      if (vv && vv.leave) vv.leave();
      A.endSession();
      A.forgetNext();
      A.notice = 'signedout';
      A.navigate('#/signin', { force: true });
    };
    if (v && v.isDirty && v.isDirty()) { A.Modal.open('AM-01', { origin: A.cur.id, go: go }); return; }
    go();
  };

  /* Idle timeout or a refused session: A-01 with C04, the current address
     remembered (A-01 §3.1). Unsaved edits are lost, and C04 says so. */
  A.expire = function () {
    if (A.cur.id && A.cur.id !== 'A-01') ssSet(SS.next, A.cur.hash);
    var v = curView();
    if (v && v.leave) v.leave();
    A.cur.id = null;              // nothing left to guard
    A.endSession();
    A.notice = 'expired';
    A.Modal.close();
    expectHash = '#/signin';
    if (location.hash === '#/signin') { expectHash = null; route(); } else location.hash = '#/signin';
  };

  window.addEventListener('hashchange', function () {
    var h = location.hash;
    if (expectHash !== null && h === expectHash) { expectHash = null; route(); return; }
    expectHash = null;
    if (!A.cur.id || A.cur.id === 'A-01') { route(); return; }
    /* Browser back / forward / a typed address. */
    if (A.Modal.current()) {
      try { history.pushState(null, '', A.cur.hash); } catch (e) {}
      A.Modal.back();
      return;
    }
    var v = curView();
    if (v && v.isDirty && v.isDirty()) {
      try { history.pushState(null, '', A.cur.hash); } catch (e) {}
      A.Modal.open('AM-01', { origin: A.cur.id, go: function () { A.navigate(h, { force: true }); } });
      return;
    }
    route();
  });

  /* Closing the tab with an unsaved edit: the browser's own prompt. */
  window.addEventListener('beforeunload', function (e) {
    var v = curView();
    if (v && v.isDirty && v.isDirty()) { e.preventDefault(); e.returnValue = ''; return ''; }
  });

  /* Activity keeps the session alive; the first action after 60 idle
     minutes opens A-01 instead of doing what it was aimed at. */
  function activity(e) {
    if (!A.cur.id || A.cur.id === 'A-01') return;
    if (!A.session()) {
      e.preventDefault(); e.stopPropagation();
      if (A.sessionExpired()) A.expire(); else route();
      return;
    }
    A.touch();
  }
  document.addEventListener('click', activity, true);
  document.addEventListener('keydown', activity, true);

  /* ------------------------------------------------------------------ *
   * Rendering: the global frame (admin-map §4) around the current screen
   * ------------------------------------------------------------------ */
  function frameHtml() {
    var s = A.settings();
    var hotel = I18N.lang === 'en' ? (s.hotelNameEn || s.hotelNameAr || '') : (s.hotelNameAr || s.hotelNameEn || '');
    var h = '<div class="adm-frame">';
    h += '<aside class="adm-side"' + A.el('AF-S01') + '>';
    h += '<div class="adm-side__hotel"' + A.el('AF-C01') + '>' + esc(hotel) + '</div>';
    h += '<nav class="adm-nav">';
    NAV.forEach(function (n) {
      var on = A.cur.nav === n.k;
      h += '<button type="button" class="adm-nav__item' + (on ? ' is-active' : '') + '"' + A.el(n.el) +
           ' data-href="' + n.hash + '"' + (on ? ' aria-current="page"' : '') + '>' + esc(t('ad.af.' + n.k)) + '</button>';
    });
    h += '</nav></aside>';
    h += '<div class="adm-content">';
    h += '<header class="adm-top"' + A.el('AF-S02') + '>';
    h += '<button type="button" class="adm-textbtn" lang="' + I18N.other() + '"' + A.el('AF-B06') + '>' + esc(t('ad.af.b06')) + '</button>';
    h += '<span class="adm-top__email num"' + A.el('AF-C02') + '>' + esc(A.account()) + '</span>';
    h += '<button type="button" class="btn btn--ghost adm-btn36"' + A.el('AF-B07') + '>' + esc(t('ad.af.b07')) + '</button>';
    h += '</header>';
    h += '<div class="adm-narrow" role="note"' + A.el('AF-C03') + '><p>' + esc(t('ad.af.c03.l1')) + '</p><p>' + esc(t('ad.af.c03.l2')) + '</p></div>';
    h += '<main id="adm-view" class="adm-main" data-screen="' + A.cur.id + '"></main>';
    h += '</div></div>';
    return h;
  }

  function bindFrame(root) {
    var navs = root.querySelectorAll('.adm-nav__item');
    for (var i = 0; i < navs.length; i++) {
      navs[i].addEventListener('click', function () { A.navigate(this.getAttribute('data-href')); });
    }
    var lang = root.querySelector('[data-el="AF-B06"]');
    if (lang) lang.addEventListener('click', function () { A.toggleLang(); });
    var out = root.querySelector('[data-el="AF-B07"]');
    if (out) out.addEventListener('click', function () { A.signOut(); });
  }

  A.render = function () {
    document.title = t('ad.doc.title');
    var root = document.getElementById('adm');
    var v = curView();
    if (!v) { root.innerHTML = ''; return; }
    if (A.cur.id === 'A-01') {
      root.className = 'adm adm--bare';
      root.innerHTML = v.render(A.cur.params);
      if (v.mount) v.mount(root, A.cur.params);
      return;
    }
    root.className = 'adm';
    root.innerHTML = frameHtml();
    bindFrame(root);
    A.renderView();
  };

  /* Redraws only the screen inside the frame. */
  A.renderView = function () {
    var old = document.getElementById('adm-view');
    var v = curView();
    if (!old || !v) return;
    /* A fresh element each time, so listeners a screen bound on its root
       during the previous draw never pile up. */
    var main = old.cloneNode(false);
    main.setAttribute('data-screen', A.cur.id);
    old.parentNode.replaceChild(main, old);
    main.innerHTML = v.render(A.cur.params);
    if (v.mount) v.mount(main, A.cur.params);
  };

  /* Only the hotel name in the sidebar (A-07 §5.1: new name at once). */
  A.refreshHotelName = function () {
    var n = document.querySelector('[data-el="AF-C01"]');
    if (!n) return;
    var s = A.settings();
    n.textContent = I18N.lang === 'en' ? (s.hotelNameEn || s.hotelNameAr || '') : (s.hotelNameAr || s.hotelNameEn || '');
  };

  A.rerender = function () {
    I18N.apply();
    A.render();
    A.Modal.redraw();
  };

  /* ------------------------------------------------------------------ *
   * Modal host. One modal at a time: AM-01 never stacks on another
   * (AM-01 §5.4). Each modal states how it answers the backdrop, Esc and
   * browser back.
   * ------------------------------------------------------------------ */
  var M = { cur: null };
  A.Modal = M;
  M.current = function () { return M.cur; };
  M.open = function (id, params) {
    var def = A.modals[id];
    if (!def) return;
    if (M.cur) M.close();
    M.cur = { id: id, def: def, params: params || {}, prevFocus: document.activeElement, openedAt: Date.now() };
    if (def.open) def.open(M.cur.params);
    draw(true);
  };
  function draw(first) {
    var host = document.getElementById('modal-root');
    host.innerHTML = '';
    if (!M.cur) { document.body.classList.remove('is-modal-open'); return; }
    var c = M.cur, def = c.def;
    var bd = document.createElement('div');
    bd.className = 'backdrop adm-backdrop';
    bd.setAttribute('data-el', c.id + '-S01');
    bd.innerHTML = '<div class="adm-modal adm-modal--' + (def.width || 480) + '" role="dialog" aria-modal="true" ' +
                   'aria-labelledby="' + c.id + '-title"' + A.el(c.id + '-S02') + '>' + def.render(c.params) + '</div>';
    host.appendChild(bd);
    document.body.classList.add('is-modal-open');
    bd.addEventListener('click', function (e) {
      if (e.target === bd && def.backdrop) def.backdrop(c.params);
    });
    var card = bd.firstChild;
    if (def.mount) def.mount(card, c.params, first);
  }
  M.redraw = function () { if (M.cur) draw(false); };
  M.close = function () {
    var c = M.cur;
    M.cur = null;
    draw(false);
    if (c && c.def.closed) c.def.closed(c.params);
    return c;
  };
  M.restoreFocus = function (c) {
    if (c && c.prevFocus && c.prevFocus.focus && document.body.contains(c.prevFocus)) {
      try { c.prevFocus.focus(); } catch (e) {}
    }
  };
  M.back = function () { if (M.cur && M.cur.def.back) M.cur.def.back(M.cur.params); };

  document.addEventListener('keydown', function (e) {
    if (!M.cur) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      if (M.cur.def.esc) M.cur.def.esc(M.cur.params);
      return;
    }
    if (e.key === 'Tab') {                          // focus stays inside the card
      var card = document.querySelector('#modal-root .adm-modal');
      if (!card) return;
      var f = card.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex="0"]');
      if (!f.length) { e.preventDefault(); return; }
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || !card.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (document.activeElement === last || !card.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
    }
  });

  /* ------------------------------------------------------------------ *
   * Start
   * ------------------------------------------------------------------ */
  A.start = function () {
    A.initLang();
    if (!location.hash) A.replaceHash('#/overview');
    route();
  };
})();

</script>
<script>
/* admin/js/a01-signin.js */
/* A-01 — تسجيل الدخول / Sign in. spec/admin/screens/A-01.md
   The one manager account (CONTRACT "Demo credentials"). The credentials are
   plain demo values held by HotelDB; the demo hint below the card says so.
   This is not security and does not pretend to be. */
(function () {
  'use strict';
  var A = window.Admin;

  I18N.register({
    'a01.c01': { ar: 'لوحة تحكم متجر الفندق', en: 'Hotel store dashboard' },
    'a01.f01': { ar: 'البريد الإلكتروني', en: 'Email' },
    'a01.f02': { ar: 'كلمة المرور', en: 'Password' },
    'a01.b03.show': { ar: 'إظهار', en: 'Show' },
    'a01.b03.hide': { ar: 'إخفاء', en: 'Hide' },
    'a01.b01': { ar: 'تسجيل الدخول', en: 'Sign in' },
    'a01.c03': { ar: 'تم تسجيل خروجك', en: 'You are signed out' },
    'a01.c04': { ar: 'انتهت الجلسة بعد 60 دقيقة دون نشاط. أي تعديلات لم تُحفظ قد فُقدت.',
                 en: 'Your session ended after 60 minutes of inactivity. Any unsaved edits were lost.' },
    'a01.c05': { ar: 'جارٍ التحقق…', en: 'Checking…' },
    'a01.c06': { ar: 'هل نسيت كلمة المرور؟ تواصل مع الجهة التي ركّبت النظام لإعادة ضبطها.',
                 en: 'Forgot your password? Contact whoever installed the system to reset it.' },
    /* §7.4 */
    'a01.err.emailEmpty': { ar: 'أدخل البريد الإلكتروني', en: 'Enter your email' },
    'a01.err.emailBad':   { ar: 'تحقّق من صيغة البريد الإلكتروني', en: 'Check the email address' },
    'a01.err.pwEmpty':    { ar: 'أدخل كلمة المرور', en: 'Enter your password' },
    'a01.err.pwShort':    { ar: 'كلمة المرور 8 أحرف على الأقل', en: 'Your password is at least 8 characters' },
    'a01.err.wrong':      { ar: 'البريد الإلكتروني أو كلمة المرور غير صحيحة', en: 'Your email or password is incorrect' },
    'a01.err.conn':       { ar: 'تعذّر الاتصال — تحقّق من الاتصال وحاول مرة أخرى', en: 'Could not connect — check your connection and try again' },
    'a01.err.locked':     { ar: 'تم إيقاف المحاولات مؤقتًا بعد 5 محاولات فاشلة. حاول مرة أخرى بعد {N} دقيقة.',
                            en: 'Sign-in is paused after 5 failed attempts. Try again in {N} minutes.' },
    /* The demo hint — CONTRACT "Demo credentials". Not part of the product. */
    'a01.demo.tag':  { ar: 'وضع العرض · Demo', en: 'Demo · وضع العرض' },
    'a01.demo.line': { ar: 'بيانات دخول تجريبية للعرض فقط. هذه ليست حماية حقيقية.',
                       en: 'Demo sign-in details, for this prototype only. This is not real security.' },
    'a01.demo.email': { ar: 'البريد:', en: 'Email:' },
    'a01.demo.pw':    { ar: 'كلمة المرور:', en: 'Password:' }
  });

  var S = {};          // screen state, kept across a language re-render
  var lockTimer = null;

  function reset() {
    S = { email: '', pw: '', show: false, busy: false, errors: [], notice: null };
  }
  reset();

  function lockedMinutes() {
    var until = A.fails.lockedUntil();
    if (!until) return 0;
    return Math.max(1, Math.ceil((until - Date.now()) / 60000));
  }

  function validEmail(v) {
    return v.length >= 5 && v.length <= 120 && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  }

  var view = {
    enter: function () {
      reset();
      S.notice = A.notice;        // 'signedout' | 'expired' | null (C04 wins)
      A.notice = null;
    },
    leave: function () { if (lockTimer) { clearInterval(lockTimer); lockTimer = null; } S.show = false; },

    render: function () {
      var mins = lockedMinutes();
      var locked = mins > 0;
      var dis = locked || S.busy;
      var h = '<div class="adm-signin">';
      h += '<button type="button" class="adm-textbtn adm-signin__lang" lang="' + I18N.other() + '"' + A.el('A-01-B02') + '>' + esc(t('ad.af.b06')) + '</button>';
      h += '<form class="adm-signin__card" novalidate' + A.el('A-01-S01') + '>';
      h += '<h1 class="adm-signin__title"' + A.el('A-01-C01') + '>' + esc(t('a01.c01')) + '</h1>';
      if (S.notice === 'expired') h += '<p class="adm-note"' + A.el('A-01-C04') + '>' + esc(t('a01.c04')) + '</p>';
      else if (S.notice === 'signedout') h += '<p class="adm-note"' + A.el('A-01-C03') + '>' + esc(t('a01.c03')) + '</p>';

      h += '<label class="adm-label" for="a01-f01">' + esc(t('a01.f01')) + '</label>';
      h += '<input id="a01-f01" class="adm-input num" type="email" autocomplete="username" autocapitalize="off" spellcheck="false"' +
           A.el('A-01-F01') + (dis ? ' disabled' : '') + ' value="' + esc(S.email) + '">';
      h += '<label class="adm-label" for="a01-f02">' + esc(t('a01.f02')) + '</label>';
      h += '<div class="adm-pw">';
      h += '<input id="a01-f02" class="adm-input" type="' + (S.show ? 'text' : 'password') + '" autocomplete="current-password" ' +
           'autocorrect="off" autocapitalize="off" spellcheck="false"' + A.el('A-01-F02') + (dis ? ' disabled' : '') + ' value="' + esc(S.pw) + '">';
      h += '<button type="button" class="adm-pw__toggle"' + A.el('A-01-B03') + (S.pw ? '' : ' hidden') + (dis ? ' disabled' : '') + '>' +
           esc(t(S.show ? 'a01.b03.hide' : 'a01.b03.show')) + '</button>';
      h += '</div>';

      var msgs = locked ? [t('a01.err.locked', { N: mins })] : S.errors.map(function (k) { return t(k); });
      h += '<div class="error adm-signin__err" role="alert"' + A.el('A-01-C02') + (msgs.length ? '' : ' hidden') + '><div>' +
           msgs.map(function (m) { return '<div>' + esc(m) + '</div>'; }).join('') + '</div></div>';

      var canSubmit = !dis && S.email.length > 0 && S.pw.length > 0;
      h += '<button type="submit" class="btn btn--primary btn--block adm-btn44"' + A.el('A-01-B01') + (canSubmit ? '' : ' disabled') + '>' +
           (S.busy ? '<span' + A.el('A-01-C05') + '>' + esc(t('a01.c05')) + '</span>' : esc(t('a01.b01'))) + '</button>';
      h += '</form>';
      h += '<p class="adm-signin__help"' + A.el('A-01-C06') + '>' + esc(t('a01.c06')) + '</p>';

      h += '<aside class="adm-demo" data-demo="true">' +
             '<span class="demo-bar__tag">' + esc(t('a01.demo.tag')) + '</span>' +
             '<p>' + esc(t('a01.demo.line')) + '</p>' +
             '<p>' + esc(t('a01.demo.email')) + ' <code class="num">manager@alwaha.example</code></p>' +
             '<p>' + esc(t('a01.demo.pw')) + ' <code class="num">alwaha2026</code></p>' +
           '</aside>';
      h += '</div>';
      return h;
    },

    mount: function (root) {
      var f1 = root.querySelector('#a01-f01');
      var f2 = root.querySelector('#a01-f02');
      var b1 = root.querySelector('[data-el="A-01-B01"]');
      var b3 = root.querySelector('[data-el="A-01-B03"]');
      var form = root.querySelector('form');

      function refresh() {
        var dis = lockedMinutes() > 0 || S.busy;
        b1.disabled = dis || !S.email.length || !S.pw.length;
        if (b3) { if (S.pw) b3.removeAttribute('hidden'); else b3.setAttribute('hidden', ''); }
      }
      function edited() {
        var hadNotice = S.errors.length || S.notice;
        S.errors = []; S.notice = null;               // §4 C02–C04: cleared on edit
        if (hadNotice) {
          var c2 = root.querySelector('[data-el="A-01-C02"]');
          if (c2 && !lockedMinutes()) { c2.setAttribute('hidden', ''); c2.firstChild.innerHTML = ''; }
          var n = root.querySelector('[data-el="A-01-C03"], [data-el="A-01-C04"]');
          if (n) n.parentNode.removeChild(n);
        }
        refresh();
      }
      f1.addEventListener('input', function () { S.email = f1.value; edited(); });
      f2.addEventListener('input', function () { S.pw = f2.value; edited(); });
      f1.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); f2.focus(); } });
      if (b3) b3.addEventListener('click', function () {
        S.show = !S.show;
        f2.type = S.show ? 'text' : 'password';
        b3.textContent = t(S.show ? 'a01.b03.hide' : 'a01.b03.show');
      });
      root.querySelector('[data-el="A-01-B02"]').addEventListener('click', function () { A.toggleLang(); });
      form.addEventListener('submit', function (e) { e.preventDefault(); submit(); });

      if (lockTimer) clearInterval(lockTimer);
      if (lockedMinutes() > 0) {
        lockTimer = setInterval(function () {
          if (A.cur.id !== 'A-01') { clearInterval(lockTimer); lockTimer = null; return; }
          if (!lockedMinutes()) {                   // §6.6: back to default, both empty
            clearInterval(lockTimer); lockTimer = null;
            reset(); A.render();
            var e1 = document.getElementById('a01-f01'); if (e1) e1.focus();
          } else {
            var c2 = document.querySelector('[data-el="A-01-C02"]');
            if (c2) c2.firstChild.innerHTML = '<div>' + esc(t('a01.err.locked', { N: lockedMinutes() })) + '</div>';
          }
        }, 15000);
      }
      if (!S.busy && !lockedMinutes()) {
        if (!S.email) f1.focus(); else if (document.activeElement === document.body) f1.focus();
      }
    }
  };

  function submit() {
    if (S.busy || lockedMinutes()) return;
    var email = A.trim(S.email);
    var pw = S.pw;                                   // never trimmed (§7.2)
    var errs = [];
    if (!email) errs.push('a01.err.emailEmpty');
    else if (!validEmail(email)) errs.push('a01.err.emailBad');
    if (!pw) errs.push('a01.err.pwEmpty');
    else if (pw.length < 8) errs.push('a01.err.pwShort');
    if (errs.length) { S.errors = errs; A.render(); return; }

    S.busy = true; S.show = false; S.errors = [];
    A.render();
    /* The "request": HotelDB's admin record, read fresh. A short pause keeps
       the in-flight state (§6.1) visible, as a real request would. */
    setTimeout(function () {
      var rec = null;
      try { rec = HotelDB.admin(); } catch (e) { rec = null; }
      S.busy = false;
      if (!rec) { S.errors = ['a01.err.conn']; A.render(); return; }   // does not count (§7.3)
      var ok = String(rec.email || '').toLowerCase() === email.toLowerCase() &&
               rec.passwordHash === HotelDB.hashPassword(pw);
      if (!ok) {
        A.fails.add();
        S.pw = ''; S.errors = ['a01.err.wrong'];
        A.render();
        var f2 = document.getElementById('a01-f02');
        if (f2 && !f2.disabled) f2.focus();
        return;
      }
      A.fails.clear();
      if (!A.startSession()) { S.errors = ['a01.err.conn']; A.render(); return; }
      var next = A.takeNext();
      reset();
      A.navigate(next || '#/overview', { force: true });
    }, 250);
  }

  A.views['A-01'] = view;
})();

</script>
<script>
/* admin/js/a02-overview.js */
/* A-02 — نظرة عامة / Overview. spec/admin/screens/A-02.md
   Read-only. Three bands, in this order: what is broken, what the store
   earned, what sold. Fetched once on entry, again only on "Refresh" or a
   period change; it never polls (§5.2 "Freshness"). */
(function () {
  'use strict';
  var A = window.Admin;

  I18N.register({
    'a02.c01': { ar: 'ما يحتاج انتباهك', en: 'Needs your attention' },
    'a02.b01': { ar: 'لا توجد منتجات معروضة للبيع الآن', en: 'Nothing is on sale right now' },
    'a02.b02.1':    { ar: 'طلب جديد واحد لم يُقبل منذ أكثر من 10 دقائق', en: '1 new order not accepted for more than 10 minutes' },
    'a02.b02.2':    { ar: 'طلبان جديدان لم يُقبلا منذ أكثر من 10 دقائق', en: '2 new orders not accepted for more than 10 minutes' },
    'a02.b02.few':  { ar: '{N} طلبات جديدة لم تُقبل منذ أكثر من 10 دقائق', en: '{N} new orders not accepted for more than 10 minutes' },
    'a02.b02.many': { ar: '{N} طلبًا جديدًا لم يُقبل منذ أكثر من 10 دقائق', en: '{N} new orders not accepted for more than 10 minutes' },
    'a02.b03.1':    { ar: 'منتج واحد غير متوفر', en: '1 product out of stock' },
    'a02.b03.2':    { ar: 'منتجان غير متوفرين', en: '2 products out of stock' },
    'a02.b03.few':  { ar: '{N} منتجات غير متوفرة', en: '{N} products out of stock' },
    'a02.b03.many': { ar: '{N} منتجًا غير متوفر', en: '{N} products out of stock' },
    'a02.c02': { ar: 'كل شيء يعمل: هناك منتجات معروضة، ولا طلبات متأخرة عن القبول',
                 en: 'Everything is running: products are on sale and no order is waiting to be accepted' },
    'a02.b04.today': { ar: 'اليوم', en: 'Today' },
    'a02.b04.7d':    { ar: 'آخر 7 أيام', en: 'Last 7 days' },
    'a02.b04.30d':   { ar: 'آخر 30 يومًا', en: 'Last 30 days' },
    'a02.c03': { ar: 'من {from} إلى {to}', en: '{from} to {to}' },
    'a02.c04': { ar: 'الطلبات المسلَّمة', en: 'Delivered orders' },
    'a02.c05': { ar: 'الإيراد', en: 'Revenue' },
    'a02.c06': { ar: 'متوسط قيمة الطلب', en: 'Average order value' },
    'a02.c07': { ar: 'الطلبات الملغاة', en: 'Cancelled orders' },
    'a02.c09': { ar: 'الأكثر مبيعًا في هذه الفترة', en: 'Best sellers in this period' },
    'a02.c10': { ar: 'لم تُسلَّم أي طلبات في هذه الفترة', en: 'No orders were delivered in this period' },
    'a02.c11': { ar: 'تعذّر تحميل هذا القسم', en: 'This section could not be loaded' },
    'a02.removed': { ar: '(مُزال)', en: '(removed)' }
  });

  var S = { period: '7d', fetchedAt: 0, attention: null, figures: null, top: null };

  /* Band 1 — §5.2 */
  function fetchAttention() {
    try {
      var c = HotelDB.catalog();
      var active = (c.products || []).filter(function (p) { return !p.removed; });
      var onSale = active.filter(function (p) { return p.inStock; }).length;
      var out = active.length - onSale;
      var cutoff = Date.now() - 10 * 60 * 1000;
      var late = A.orders().filter(function (o) { return o.status === 'New' && o.createdAt < cutoff; }).length;
      return { nothing: onSale === 0, late: late, out: out };
    } catch (e) { return null; }
  }

  /* Bands 2 and 3 — admin-map §5.6, computed over the selected period by
     submission time. */
  function fetchPeriod() {
    try {
      var rng = A.period(S.period);
      var list = A.ordersIn(rng);
      var delivered = list.filter(function (o) { return o.status === 'Delivered'; });
      var revenue = 0;
      delivered.forEach(function (o) { revenue += Number(o.total) || 0; });
      var cancelled = list.filter(function (o) { return o.status === 'Cancelled'; }).length;
      var figures = {
        rng: rng, all: list.length, delivered: delivered.length, revenue: revenue,
        avg: delivered.length ? revenue / delivered.length : null,
        cancelled: cancelled,
        pct: list.length ? Math.floor(cancelled * 100 / list.length + 0.5) : null
      };
      var cat = HotelDB.catalog();
      var byId = {};
      (cat.products || []).forEach(function (p) { byId[p.id] = p; });
      var agg = {};
      delivered.forEach(function (o) {
        (o.lines || []).forEach(function (l) {
          var k = l.productId;
          if (!agg[k]) agg[k] = { id: k, units: 0, revenue: 0, line: l };
          agg[k].units += Number(l.qty) || 0;
          agg[k].revenue += (Number(l.qty) || 0) * (Number(l.price) || 0);
        });
      });
      var rows = [];
      for (var k in agg) if (Object.prototype.hasOwnProperty.call(agg, k) && agg[k].units > 0) {
        var r = agg[k], p = byId[k];
        r.product = p || null;
        r.nameAr = p ? p.nameAr : (r.line.nameAr || '');
        rows.push(r);
      }
      rows.sort(function (a, b) {
        return (b.units - a.units) || (b.revenue - a.revenue) || String(a.nameAr).localeCompare(String(b.nameAr), 'ar');
      });
      return { figures: figures, top: rows.slice(0, 5) };
    } catch (e) { return null; }
  }

  function fetchAll() {
    S.attention = fetchAttention();
    var p = fetchPeriod();
    S.figures = p ? p.figures : null;
    S.top = p ? p.top : null;
    S.periodFailed = !p;
    S.fetchedAt = Date.now();
  }

  function attentionHtml() {
    var h = '';
    if (!S.attention) {
      return '<p class="adm-err"' + A.el('A-02-C11') + '>' + esc(t('a02.c11')) + '</p>' +
             '<button type="button" class="btn btn--ghost adm-btn36" data-retry="attention"' + A.el('A-02-B06') + '>' + esc(t('ad.retry')) + '</button>';
    }
    var a = S.attention, any = false;
    if (a.nothing) { any = true; h += row('A-02-B01', t('a02.b01'), '#/products'); }
    if (a.late > 0) { any = true; h += row('A-02-B02', t('a02.b02.' + A.bucket(a.late), { N: A.count(a.late) }), '#/orders?status=New'); }
    if (a.out > 0) { any = true; h += row('A-02-B03', t('a02.b03.' + A.bucket(a.out), { N: A.count(a.out) }), '#/products?stock=out'); }
    if (!any) h += '<p class="adm-allclear"' + A.el('A-02-C02') + '>' + esc(t('a02.c02')) + '</p>';
    return h;
  }
  function row(el, text, href) {
    return '<button type="button" class="adm-attn"' + A.el(el) + ' data-href="' + esc(href) + '">' +
           '<span>' + esc(text) + '</span><span class="chev" aria-hidden="true">‹</span></button>';
  }

  function figuresHtml() {
    if (!S.figures) {
      return '<p class="adm-err"' + A.el('A-02-C11') + '>' + esc(t('a02.c11')) + '</p>' +
             '<button type="button" class="btn btn--ghost adm-btn36" data-retry="period"' + A.el('A-02-B06') + '>' + esc(t('ad.retry')) + '</button>';
    }
    var f = S.figures;
    var h = '<div class="adm-figs adm-figs--4">';
    h += fig('A-02-C04', t('a02.c04'), A.count(f.delivered));
    h += fig('A-02-C05', t('a02.c05'), A.money(f.revenue));
    h += fig('A-02-C06', t('a02.c06'), f.avg == null ? '—' : A.money(f.avg));
    h += fig('A-02-C07', t('a02.c07'), A.count(f.cancelled) + ' (' + (f.pct == null ? '—' : f.pct + '%') + ')');
    h += '</div>';
    h += '<p class="adm-foot"' + A.el('A-02-C08') + '>' + esc(t('ad.revenueNote')) + '</p>';
    return h;
  }
  function fig(el, label, value) {
    return '<div class="adm-fig"' + A.el(el) + '><div class="adm-fig__label">' + esc(label) + '</div>' +
           '<div class="adm-fig__value">' + esc(value) + '</div></div>';
  }

  function topHtml() {
    if (!S.top) {
      return '<p class="adm-err"' + A.el('A-02-C11') + '>' + esc(t('a02.c11')) + '</p>' +
             '<button type="button" class="btn btn--ghost adm-btn36" data-retry="period"' + A.el('A-02-B06') + '>' + esc(t('ad.retry')) + '</button>';
    }
    if (!S.top.length) return '<p class="adm-empty-line"' + A.el('A-02-C10') + '>' + esc(t('a02.c10')) + '</p>';
    var h = '<ol class="adm-top5">';
    S.top.forEach(function (r, i) {
      var name = r.product ? A.productName(r.product) : A.lineName(r.line);
      var removed = r.product && r.product.removed;
      h += '<li><button type="button" class="adm-top5__row"' + A.el('A-02-B05') + ' data-href="#/products/' + esc(encodeURIComponent(r.id)) + '">' +
           '<span class="adm-top5__rank num">' + (i + 1) + '</span>' +
           '<span class="adm-top5__name">' + esc(name) + (removed ? ' <span class="muted">' + esc(t('a02.removed')) + '</span>' : '') + '</span>' +
           '<span class="adm-top5__units num">' + esc(A.count(r.units)) + '</span>' +
           '<span class="adm-top5__rev">' + esc(A.money(r.revenue)) + '</span>' +
           '</button></li>';
    });
    return h + '</ol>';
  }

  var view = {
    enter: function () { S.period = '7d'; fetchAll(); },   // §7.1: always 7 days on entry
    render: function () {
      var h = '<div class="adm-page">';
      h += '<section class="adm-band"' + A.el('A-02-S01') + '>';
      h += '<div class="adm-band__head"><h2 class="adm-band__title"' + A.el('A-02-C01') + '>' + esc(t('a02.c01')) + '</h2>' +
           '<span class="adm-fresh"><span' + A.el('A-02-C13') + '>' + esc(t('ad.updated', { time: A.fmtTime(S.fetchedAt) })) + '</span>' +
           '<button type="button" class="btn btn--ghost adm-btn36" data-act="refresh"' + A.el('A-02-B07') + '>' + esc(t('ad.refresh')) + '</button></span></div>';
      h += '<div class="adm-attn-list">' + attentionHtml() + '</div>';
      h += '</section>';

      h += '<section class="adm-band adm-band--plain"' + A.el('A-02-S02') + '>';
      h += '<div class="adm-seg" role="group"' + A.el('A-02-B04') + '>';
      ['today', '7d', '30d'].forEach(function (k) {
        h += '<button type="button" class="adm-seg__btn' + (S.period === k ? ' is-active' : '') + '" data-period="' + k + '" aria-pressed="' + (S.period === k) + '">' + esc(t('a02.b04.' + k)) + '</button>';
      });
      h += '</div>';
      var rng = A.period(S.period);
      h += '<p class="adm-caption"' + A.el('A-02-C03') + '>' + esc(t('a02.c03', { from: A.fmtYMD(rng.fromYMD), to: A.fmtYMD(rng.toYMD) })) + '</p>';
      h += figuresHtml();
      h += '</section>';

      h += '<section class="adm-band"' + A.el('A-02-S03') + '>';
      h += '<h2 class="adm-band__title"' + A.el('A-02-C09') + '>' + esc(t('a02.c09')) + '</h2>';
      h += topHtml();
      h += '</section></div>';
      return h;
    },
    mount: function (root) {
      root.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b || !root.contains(b)) return;
        if (b.hasAttribute('data-href')) { A.navigate(b.getAttribute('data-href')); return; }
        if (b.getAttribute('data-act') === 'refresh') { fetchAll(); A.renderView(); return; }
        var p = b.getAttribute('data-period');
        if (p) {                                   // §6.1: the attention band is not re-fetched
          S.period = p;
          var r = fetchPeriod();
          S.figures = r ? r.figures : null; S.top = r ? r.top : null;
          A.renderView();
          return;
        }
        var retry = b.getAttribute('data-retry');
        if (retry === 'attention') { S.attention = fetchAttention(); A.renderView(); }
        else if (retry === 'period') { var rr = fetchPeriod(); S.figures = rr ? rr.figures : null; S.top = rr ? rr.top : null; A.renderView(); }
      });
    }
  };

  A.views['A-02'] = view;
})();

</script>
<script>
/* admin/js/a03-products.js */
/* A-03 — المنتجات / Products. spec/admin/screens/A-03.md
   The catalog in the guest's own order. Stock is switched here, inline, and
   saved at once through HotelDB.saveCatalog() — the same record the guest's
   Server.getCatalog() reads, so the next guest catalog fetch shows it. */
(function () {
  'use strict';
  var A = window.Admin;

  I18N.register({
    'a03.c01': { ar: 'المنتجات', en: 'Products' },
    'a03.c02': { ar: '{T} منتجًا — {A} معروض، {O} غير متوفر، {R} مُزال', en: '{T} products — {A} on sale, {O} out of stock, {R} removed' },
    'a03.b01': { ar: '+ منتج جديد', en: '+ New product' },
    'a03.f01': { ar: 'ابحث بالاسم', en: 'Search by name' },
    'a03.f02.all':  { ar: 'كل الفئات', en: 'All categories' },
    'a03.f02.none': { ar: 'بلا فئة', en: 'No category' },
    'a03.f03.all':     { ar: 'الكل', en: 'All' },
    'a03.f03.onsale':  { ar: 'معروض', en: 'On sale' },
    'a03.f03.out':     { ar: 'غير متوفر', en: 'Out of stock' },
    'a03.f03.removed': { ar: 'مُزال', en: 'Removed' },
    'a03.f02.label': { ar: 'الفئة', en: 'Category' },
    'a03.f03.label': { ar: 'التوفر', en: 'Stock' },
    'a03.c03': { ar: '{name} — {N} منتجات', en: '{name} — {N} products' },
    'a03.b04.on':  { ar: 'معروض', en: 'On sale' },
    'a03.b04.off': { ar: 'غير متوفر', en: 'Out of stock' },
    'a03.b05.remove':  { ar: 'إزالة', en: 'Remove' },
    'a03.b05.restore': { ar: 'استعادة', en: 'Restore' },
    'a03.b06': { ar: 'نقل لأعلى', en: 'Move up' },
    'a03.b07': { ar: 'نقل لأسفل', en: 'Move down' },
    'a03.c06.edit':    { ar: 'تم حفظ التغييرات على "{name}"', en: 'Changes to "{name}" were saved' },
    'a03.c06.create':  { ar: 'تمت إضافة "{name}" إلى المتجر', en: '"{name}" was added to the store' },
    'a03.c06.remove':  { ar: 'تمت إزالة "{name}" من المتجر', en: '"{name}" was removed from the store' },
    'a03.c06.restore': { ar: 'تمت استعادة "{name}" — لا يزال غير متوفر حتى تشغّل التوفر',
                         en: '"{name}" was restored — it stays out of stock until you switch it on' },
    'a03.c08.l1': { ar: 'لا توجد منتجات بعد', en: 'No products yet' },
    'a03.c08.l2': { ar: 'أضف أول منتج ليظهر في المتجر', en: 'Add your first product so it appears in the store' },
    'a03.c09': { ar: 'لا توجد منتجات تطابق البحث', en: 'No products match your search' },
    'a03.c11': { ar: 'بلغت الحد الأقصى 200 منتج. أزل منتجًا لإضافة آخر.', en: 'You have reached the maximum of 200 products. Remove one to add another.' },
    'a03.loadErr': { ar: 'تعذّر تحميل المنتجات', en: 'Products could not be loaded' }
  });

  var MAX_PRODUCTS = 200;

  /* ------------------------------------------------------------------ *
   * Catalog operations — each one a fresh read, one change, one write
   * (admin-map §5.4). Shared with A-04, A-05 and AM-02.
   * ------------------------------------------------------------------ */
  function find(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return i;
    return -1;
  }
  var Cat = {
    load: function () { try { return HotelDB.catalog(); } catch (e) { return null; } },
    save: function (c) { try { return HotelDB.saveCatalog(c) !== false; } catch (e) { return false; } },
    product: function (id) {
      var c = Cat.load(); if (!c) return null;
      var i = find(c.products, id);
      return i < 0 ? null : c.products[i];
    },
    change: function (id, fn) {
      var c = Cat.load(); if (!c) return null;
      var i = find(c.products, id);
      if (i < 0) return null;
      fn(c.products[i], c, i);
      return Cat.save(c) ? c.products[find(c.products, id)] || c.products[i] : null;
    },
    setStock: function (id, on) { return Cat.change(id, function (p) { p.inStock = !!on; }); },
    remove: function (id) { return Cat.change(id, function (p) { p.removed = true; }); },
    /* A-03 §5.6: a restored product always comes back out of stock. */
    restore: function (id) { return Cat.change(id, function (p) { p.removed = false; p.inStock = false; }); },
    /* One place earlier (-1) or later (+1) among the active products of the
       same category; the products array order IS the guest's order. */
    move: function (id, dir) {
      var c = Cat.load(); if (!c) return false;
      var i = find(c.products, id); if (i < 0) return false;
      var p = c.products[i];
      var j = i + dir;
      while (j >= 0 && j < c.products.length && (c.products[j].category !== p.category || c.products[j].removed)) j += dir;
      if (j < 0 || j >= c.products.length) return false;
      var tmp = c.products[j]; c.products[j] = p; c.products[i] = tmp;
      return Cat.save(c);
    },
    catIds: function (c) { var m = {}; (c.categories || []).forEach(function (k) { m[k.id] = k; }); return m; }
  };
  A.Cat = Cat;

  /* ------------------------------------------------------------------ */

  var S = { q: '', cat: '', stock: '', failed: false, loadFailed: false, busyStock: {} };
  var debounce = null;

  function norm(s) { return A.toWestern(String(s || '')).toLowerCase(); }
  function filterActive() { return !!(A.trim(S.q) || S.cat || S.stock); }

  function syncUrl() {
    var h = A.buildHash('/products', { q: S.q, cat: S.cat, stock: S.stock });
    A.replaceHash(h);
    A.lastProductsHash = h;
  }

  function productMatches(p, cats) {
    var q = norm(A.trim(S.q));
    if (q && norm(p.nameAr).indexOf(q) < 0 && norm(p.nameEn).indexOf(q) < 0) return false;
    if (S.cat === '__none') { if (cats[p.category]) return false; }
    else if (S.cat && p.category !== S.cat) return false;
    if (S.stock === 'removed') return !!p.removed;
    if (p.removed) return false;                        // "All" excludes removed (§7.2)
    if (S.stock === 'onsale') return !!p.inStock;
    if (S.stock === 'out') return !p.inStock;
    return true;
  }

  function counts(c) {
    var T = c.products.length, R = 0, Av = 0, O = 0;
    c.products.forEach(function (p) { if (p.removed) R++; else if (p.inStock) Av++; else O++; });
    return { T: T, A: Av, O: O, R: R };
  }

  function thumb(p) {
    return '<span class="adm-thumb" aria-hidden="true">' +
           (p.image ? '<img src="' + esc(p.image) + '" alt="">' : '<span class="adm-thumb__icon">▢</span>') + '</span>';
  }

  function rowHtml(p, cats, grouped, first, last, flash) {
    var catName = cats[p.category] ? A.catName(cats[p.category]) : t('a03.f02.none');
    var on = !!p.inStock && !p.removed;
    var busy = !!S.busyStock[p.id];
    var cls = 'adm-prow' + (p.removed ? ' is-removed' : '') + (flash ? ' is-flash' : '');
    var h = '<tr class="' + cls + '" data-id="' + esc(p.id) + '"' + A.el('A-03-C04') + '>';
    h += '<td class="adm-prow__img" data-open' + A.el('A-03-B03') + '>' + thumb(p) + '</td>';
    h += '<td class="adm-prow__name" data-open><span class="adm-prow__ar" lang="ar" dir="rtl">' + esc(p.nameAr || '') + '</span>' +
         '<span class="adm-prow__en" lang="en" dir="ltr">' + (p.nameEn ? esc(p.nameEn) : '&nbsp;') + '</span>' +
         (p.removed ? '<span class="adm-pill">' + esc(t('ad.removedTag')) + '</span>' : '') + '</td>';
    h += '<td class="adm-prow__cat" data-open>' + esc(catName) + '</td>';
    h += '<td class="adm-prow__price" data-open>' + esc(A.money(p.price)) + '</td>';
    h += '<td class="adm-prow__stock"><button type="button" role="switch" aria-checked="' + on + '" class="adm-switch' + (on ? ' is-on' : '') + '"' +
         A.el('A-03-B04') + ' data-ctl="stock"' + (p.removed || busy ? ' disabled' : '') + '>' +
         '<span class="adm-switch__track" aria-hidden="true"><span class="adm-switch__knob"></span></span>' +
         '<span class="adm-switch__word">' + esc(t(on ? 'a03.b04.on' : 'a03.b04.off')) + '</span></button></td>';
    h += '<td class="adm-prow__order">';
    if (grouped) {
      h += '<button type="button" class="adm-iconbtn" data-ctl="up" aria-label="' + esc(t('a03.b06')) + '"' + A.el('A-03-B06') + (first || p.removed ? ' disabled' : '') + '>↑</button>' +
           '<button type="button" class="adm-iconbtn" data-ctl="down" aria-label="' + esc(t('a03.b07')) + '"' + A.el('A-03-B07') + (last || p.removed ? ' disabled' : '') + '>↓</button>';
    }
    h += '</td>';
    h += '<td class="adm-prow__act"><button type="button" class="adm-textbtn" data-ctl="' + (p.removed ? 'restore' : 'remove') + '"' + A.el('A-03-B05') + '>' +
         esc(t(p.removed ? 'a03.b05.restore' : 'a03.b05.remove')) + '</button></td>';
    return h + '</tr>';
  }

  function listHtml() {
    var c = Cat.load();
    if (!c) {
      return '<div class="adm-state"><p>' + esc(t('a03.loadErr')) + '</p><button type="button" class="adm-textbtn" data-ctl="reload">' + esc(t('ad.retry')) + '</button></div>';
    }
    var cats = Cat.catIds(c);
    var flash = A.getFlash('A-03');
    var fl = flash && flash.extra && Date.now() < flash.extra.outlineUntil ? flash.extra.rowId : null;
    if (!c.products.length && !filterActive()) {
      return '<div class="adm-state"' + A.el('A-03-C08') + '><p class="bold">' + esc(t('a03.c08.l1')) + '</p><p>' + esc(t('a03.c08.l2')) + '</p></div>';
    }
    var h = '<div class="adm-tablewrap"><table class="adm-table adm-table--products"><tbody>';
    var any = false;
    if (!filterActive()) {
      var groups = (c.categories || []).map(function (k) { return { cat: k, items: [] }; });
      var idx = {}; groups.forEach(function (g, i) { idx[g.cat.id] = i; });
      var orphan = { cat: null, items: [] };
      c.products.forEach(function (p) {
        if (p.removed) return;
        if (p.category in idx) groups[idx[p.category]].items.push(p); else orphan.items.push(p);
      });
      if (orphan.items.length) groups.push(orphan);
      groups.forEach(function (g) {
        var name = g.cat ? A.catName(g.cat) : t('a03.f02.none');
        h += '<tr class="adm-ghead"' + A.el('A-03-C03') + '><th colspan="7">' + esc(t('a03.c03', { name: name, N: A.count(g.items.length) })) + '</th></tr>';
        g.items.forEach(function (p, i) {
          any = true;
          h += rowHtml(p, cats, true, i === 0, i === g.items.length - 1, fl === p.id);
        });
      });
    } else {
      var order = {}; (c.categories || []).forEach(function (k, i) { order[k.id] = i; });
      var list = c.products.map(function (p, i) { return { p: p, i: i }; })
        .filter(function (x) { return productMatches(x.p, cats); })
        .sort(function (a, b) {
          var ca = a.p.category in order ? order[a.p.category] : 1e6;
          var cb = b.p.category in order ? order[b.p.category] : 1e6;
          return (ca - cb) || (a.i - b.i);
        });
      if (!list.length) {
        return '<div class="adm-state"' + A.el('A-03-C09') + '><p>' + esc(t('a03.c09')) + '</p>' +
               '<button type="button" class="adm-textbtn" data-ctl="clear"' + A.el('A-03-B02') + '>' + esc(t('ad.clearFilters')) + '</button></div>';
      }
      list.forEach(function (x) { any = true; h += rowHtml(x.p, cats, false, false, false, fl === x.p.id); });
    }
    h += '</tbody></table></div>';
    return h;
  }

  function flashHtml() {
    if (S.failed) return '<p class="error adm-flash"' + A.el('A-03-C07') + '>' + esc(t('ad.saveFail')) + '</p>';
    var f = A.getFlash('A-03');
    if (!f) return '';
    var name = I18N.lang === 'en' ? (f.vars.nameEn || f.vars.nameAr) : (f.vars.nameAr || f.vars.nameEn);
    return '<p class="adm-confirm"' + A.el('A-03-C06') + '>' + esc(t(f.key, { name: name })) + '</p>';
  }

  function headerCounts(c) {
    if (!c || (!c.products.length && !filterActive())) return '';
    var k = counts(c);
    return esc(t('a03.c02', { T: A.count(k.T), A: A.count(k.A), O: A.count(k.O), R: A.count(k.R) }));
  }

  var view = {
    enter: function (params, query) {
      S.q = A.oneLine(query.q || '').slice(0, 60);
      S.cat = query.cat || '';
      S.stock = ['onsale', 'out', 'removed'].indexOf(query.stock) >= 0 ? query.stock : '';
      S.busyStock = {};
      A.lastProductsHash = A.cur.hash;
    },
    leave: function () { if (debounce) { clearTimeout(debounce); debounce = null; } },
    afterEnter: function () {
      var f = A.getFlash('A-03');
      var id = (f && f.extra && f.extra.rowId) || A.lastRowId;
      A.lastRowId = null;
      if (id) {
        var row = document.querySelector('.adm-prow[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
        if (row && row.scrollIntoView) row.scrollIntoView({ block: 'center' });
      }
    },
    flashEnded: function () { var n = document.getElementById('a03-flash'); if (n) n.innerHTML = flashHtml(); },

    render: function () {
      var c = Cat.load();
      var total = c ? c.products.length : 0;
      var full = total >= MAX_PRODUCTS;
      var h = '<div class="adm-page">';
      h += '<div class="adm-head"' + A.el('A-03-S01') + '><div><h1 class="adm-title"' + A.el('A-03-C01') + '>' + esc(t('a03.c01')) + '</h1>' +
           '<p class="adm-sub" id="a03-counts"' + A.el('A-03-C02') + '>' + headerCounts(c) + '</p></div>' +
           '<div class="adm-head__end">' + (full ? '<span class="adm-note"' + A.el('A-03-C11') + '>' + esc(t('a03.c11')) + '</span>' : '') +
           '<button type="button" class="btn btn--primary adm-btn40" data-ctl="new"' + A.el('A-03-B01') + (full ? ' disabled' : '') + '>' + esc(t('a03.b01')) + '</button></div></div>';

      h += '<div class="adm-filters"' + A.el('A-03-S02') + '>';
      h += '<span class="adm-search"><span class="adm-search__icon" aria-hidden="true">⌕</span>' +
           '<input type="search" class="adm-input adm-input--40" maxlength="60" placeholder="' + esc(t('a03.f01')) + '" aria-label="' + esc(t('a03.f01')) + '"' +
           A.el('A-03-F01') + ' value="' + esc(S.q) + '"></span>';
      h += '<select class="adm-input adm-input--40 adm-w200" aria-label="' + esc(t('a03.f02.label')) + '"' + A.el('A-03-F02') + '>';
      h += '<option value="">' + esc(t('a03.f02.all')) + '</option>';
      var cats = c ? Cat.catIds(c) : {};
      (c ? c.categories : []).forEach(function (k) {
        h += '<option value="' + esc(k.id) + '"' + (S.cat === k.id ? ' selected' : '') + '>' + esc(A.catName(k)) + '</option>';
      });
      var orphan = c && c.products.some(function (p) { return !cats[p.category]; });
      if (orphan || S.cat === '__none') h += '<option value="__none"' + (S.cat === '__none' ? ' selected' : '') + '>' + esc(t('a03.f02.none')) + '</option>';
      h += '</select>';
      h += '<select class="adm-input adm-input--40 adm-w200" aria-label="' + esc(t('a03.f03.label')) + '"' + A.el('A-03-F03') + '>';
      [['', 'all'], ['onsale', 'onsale'], ['out', 'out'], ['removed', 'removed']].forEach(function (o) {
        h += '<option value="' + o[0] + '"' + (S.stock === o[0] ? ' selected' : '') + '>' + esc(t('a03.f03.' + o[1])) + '</option>';
      });
      h += '</select>';
      h += '<button type="button" class="adm-textbtn" data-ctl="clear" id="a03-clear"' + A.el('A-03-B02') + (filterActive() ? '' : ' hidden') + '>' + esc(t('ad.clearFilters')) + '</button>';
      h += '</div>';

      h += '<p class="adm-note"' + A.el('A-03-C05') + '>' + esc(t('ad.propagate.here')) + '</p>';
      h += '<div id="a03-flash" data-flash="A-03">' + flashHtml() + '</div>';
      h += '<section class="adm-list" id="a03-list"' + A.el('A-03-S03') + '>' + listHtml() + '</section>';
      return h + '</div>';
    },

    mount: function (root) {
      var q = root.querySelector('[data-el="A-03-F01"]');
      var fc = root.querySelector('[data-el="A-03-F02"]');
      var fs = root.querySelector('[data-el="A-03-F03"]');

      function refreshList() {
        syncUrl();
        var list = document.getElementById('a03-list');
        if (list) list.innerHTML = listHtml();
        var clear = document.getElementById('a03-clear');
        if (clear) { if (filterActive()) clear.removeAttribute('hidden'); else clear.setAttribute('hidden', ''); }
        var cn = document.getElementById('a03-counts');
        if (cn) cn.innerHTML = headerCounts(Cat.load());
        var fl = document.getElementById('a03-flash');
        if (fl) fl.innerHTML = flashHtml();
      }

      q.addEventListener('input', function () {
        S.q = A.oneLine(q.value);
        if (debounce) clearTimeout(debounce);
        debounce = setTimeout(function () { debounce = null; refreshList(); }, 250);   // §7.1
      });
      fc.addEventListener('change', function () { S.cat = fc.value; refreshList(); });
      fs.addEventListener('change', function () { S.stock = fs.value; refreshList(); });

      root.addEventListener('click', function (e) {
        var ctl = e.target.closest('[data-ctl]');
        var row = e.target.closest('.adm-prow');
        if (ctl && root.contains(ctl)) {
          if (ctl.disabled) return;
          var act = ctl.getAttribute('data-ctl');
          var id = row ? row.getAttribute('data-id') : null;
          if (act === 'new') {
            A.navigate(A.buildHash('/products/new', { cat: S.cat && S.cat !== '__none' ? S.cat : '' }));
          } else if (act === 'clear') {
            S.q = ''; S.cat = ''; S.stock = '';
            q.value = ''; fc.value = ''; fs.value = '';
            refreshList();
          } else if (act === 'reload') {
            refreshList();
          } else if (act === 'stock') {
            var p = Cat.product(id);
            if (!p || p.removed) return;
            /* Optimistic: flipped on screen, then saved; reverted on failure. */
            S.busyStock[id] = true;
            ctl.classList.toggle('is-on'); ctl.setAttribute('aria-checked', String(!p.inStock));
            var res = Cat.setStock(id, !p.inStock);
            delete S.busyStock[id];
            S.failed = !res;
            refreshList();
          } else if (act === 'up' || act === 'down') {
            var ok = Cat.move(id, act === 'up' ? -1 : 1);
            S.failed = !ok;
            refreshList();
            var again = document.querySelector('.adm-prow[data-id="' + id + '"] [data-ctl="' + act + '"]');
            if (again && !again.disabled) again.focus();
          } else if (act === 'remove') {
            var pr = Cat.product(id);
            if (pr) A.Modal.open('AM-02', { variant: 'P', from: 'A-03', product: pr });
          } else if (act === 'restore') {
            var r = Cat.restore(id);
            S.failed = !r;
            if (r) A.setFlash('A-03', 'a03.c06.restore', { nameAr: r.nameAr, nameEn: r.nameEn }, 5000);
            refreshList();
          }
          return;
        }
        if (row && root.contains(row)) {
          A.lastRowId = row.getAttribute('data-id');
          A.navigate('#/products/' + encodeURIComponent(row.getAttribute('data-id')));
        }
      });

      /* The row outline lasts 3 seconds (§3.1). */
      var fl = root.querySelector('.adm-prow.is-flash');
      if (fl) setTimeout(function () { fl.classList.remove('is-flash'); }, 3000);
    }
  };

  /* For AM-02 and A-04: an action whose result belongs on A-03. */
  A.a03 = {
    removed: function (p, ok) {
      S.failed = !ok;
      if (ok) A.setFlash('A-03', 'a03.c06.remove', { nameAr: p.nameAr, nameEn: p.nameEn }, 5000);
      else A.clearFlash('A-03');
    },
    saved: function (p, mode) {
      S.failed = false;
      A.setFlash('A-03', mode === 'create' ? 'a03.c06.create' : 'a03.c06.edit',
                 { nameAr: p.nameAr, nameEn: p.nameEn }, 5000, { rowId: p.id, outlineUntil: Date.now() + 3000 });
    },
    back: function () { return A.lastProductsHash || '#/products'; }
  };

  A.views['A-03'] = view;
})();

</script>
<script>
/* admin/js/a04-product.js */
/* A-04 — تفاصيل المنتج / Product details. spec/admin/screens/A-04.md
   One screen, two modes (create / edit), identical fields and rules. A save
   writes the whole catalog through HotelDB.saveCatalog(), which the guest's
   Server.getCatalog() reads on its next fetch. */
(function () {
  'use strict';
  var A = window.Admin;

  I18N.register({
    'a04.c01.create': { ar: 'منتج جديد', en: 'New product' },
    'a04.c01.edit':   { ar: 'تعديل المنتج', en: 'Edit product' },
    'a04.f01': { ar: 'اسم المنتج (عربي) *', en: 'Product name (Arabic) *' },
    'a04.f02': { ar: 'اسم المنتج (إنجليزي) *', en: 'Product name (English) *' },
    'a04.f03': { ar: 'الوصف (عربي)', en: 'Description (Arabic)' },
    'a04.f04': { ar: 'الوصف (إنجليزي)', en: 'Description (English)' },
    'a04.f05': { ar: 'الفئة *', en: 'Category *' },
    'a04.f05.first': { ar: 'اختر فئة', en: 'Choose a category' },
    'a04.f06': { ar: 'السعر *', en: 'Price *' },
    'a04.f07.on':  { ar: 'معروض للبيع', en: 'On sale' },
    'a04.f07.off': { ar: 'غير متوفر', en: 'Out of stock' },
    'a04.f07.label': { ar: 'التوفر', en: 'Stock' },
    'a04.img.label': { ar: 'الصورة', en: 'Image' },
    'a04.b05': { ar: 'اختر صورة', en: 'Choose image' },
    'a04.b04': { ar: 'إزالة الصورة', en: 'Remove image' },
    'a04.c06': { ar: 'JPG أو PNG أو WebP، 5 ميجابايت كحد أقصى، 500 × 500 بكسل على الأقل. تُقصّ الصورة مربعة كما تظهر هنا.',
                 en: 'JPG, PNG or WebP, 5 MB maximum, at least 500 × 500 px. The image is cropped to the square shown here.' },
    'a04.c04.l1': { ar: 'كما يراها النزيل:', en: 'As the guest sees it:' },
    'a04.c04.l2': { ar: 'بالعربية {ar} — بالإنجليزية {en}', en: 'In Arabic {ar} — in English {en}' },
    'a04.c11': { ar: 'هذا المنتج مُزال من المتجر ولا يراه النزلاء.', en: 'This product is removed from the store and no guest can see it.' },
    'a04.b03.remove':  { ar: 'إزالة من المتجر', en: 'Remove from the store' },
    'a04.b03.restore': { ar: 'استعادة', en: 'Restore' },
    'a04.c13': { ar: 'أنشئ فئة واحدة على الأقل قبل إضافة منتج — افتح "الفئات".', en: 'Create at least one category before adding a product — open "Categories".' },
    'a04.uploading': { ar: 'جارٍ الرفع…', en: 'Uploading…' },
    'a04.loadErr': { ar: 'تعذّر تحميل المنتج', en: 'The product could not be loaded' },
    /* §7.6 */
    'a04.img.fmt':   { ar: 'اختر ملف JPG أو PNG أو WebP', en: 'Choose a JPG, PNG or WebP file' },
    'a04.img.size':  { ar: 'حجم الصورة أكبر من 5 ميجابايت', en: 'The image is larger than 5 MB' },
    'a04.img.small': { ar: 'الصورة صغيرة جدًا — 500 × 500 بكسل على الأقل', en: 'The image is too small — at least 500 × 500 px' },
    'a04.img.fail':  { ar: 'تعذّر رفع الصورة — حاول مرة أخرى', en: 'The image could not be uploaded — try again' },
    /* §7.7 */
    'a04.err.f01.empty': { ar: 'أدخل اسم المنتج بالعربية', en: 'Enter the product name in Arabic' },
    'a04.err.f01.long':  { ar: 'اسم المنتج بالعربية 60 حرفًا كحد أقصى', en: 'The Arabic product name is 60 characters at most' },
    'a04.err.f02.empty': { ar: 'أدخل اسم المنتج بالإنجليزية', en: 'Enter the product name in English' },
    'a04.err.f02.long':  { ar: 'اسم المنتج بالإنجليزية 60 حرفًا كحد أقصى', en: 'The English product name is 60 characters at most' },
    'a04.err.f03.long':  { ar: 'الوصف بالعربية 500 حرف كحد أقصى', en: 'The Arabic description is 500 characters at most' },
    'a04.err.f04.long':  { ar: 'الوصف بالإنجليزية 500 حرف كحد أقصى', en: 'The English description is 500 characters at most' },
    'a04.err.f05':       { ar: 'اختر فئة للمنتج', en: 'Choose a category for the product' },
    'a04.err.f06.empty': { ar: 'أدخل سعر المنتج', en: 'Enter the product price' },
    'a04.err.f06.chars': { ar: 'استخدم الأرقام فقط، مثل 12.50', en: 'Use digits only, for example 12.50' },
    'a04.err.f06.dec':   { ar: 'السعر بخانتين عشريتين كحد أقصى، مثل 12.50', en: 'The price has at most two decimals, for example 12.50' },
    'a04.err.f06.min':   { ar: 'يجب أن يكون السعر 0.01 على الأقل', en: 'The price must be at least 0.01' },
    'a04.err.f06.max':   { ar: 'الحد الأقصى للسعر 9999.99', en: 'The highest price is 9999.99' }
  });

  var NAME_MAX = 60, DESC_MAX = 500;
  var F = null;

  function blank() {
    return { nameAr: '', nameEn: '', descAr: '', descEn: '', category: '', price: '', inStock: true, image: null };
  }
  function fromProduct(p) {
    return { nameAr: p.nameAr || '', nameEn: p.nameEn || '', descAr: p.descAr || '', descEn: p.descEn || '',
             category: p.category || '', price: p.price == null ? '' : A.amount(p.price),
             inStock: !!p.inStock, image: p.image || null };
  }
  function copy(o) { var r = {}; for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) r[k] = o[k]; return r; }
  function len(s) { return A.trim(s).length; }

  /* ---- Price (§5.3, §7.3) ------------------------------------------ */
  function priceText(raw) {
    return A.trim(A.toWestern(raw)).replace(/٫/g, '.').replace(/,/g, '.');
  }
  function priceError(raw) {
    var v = priceText(raw);
    if (!v) return 'a04.err.f06.empty';
    if (/^-\d*\.?\d*$/.test(v) && /\d/.test(v)) return 'a04.err.f06.min';
    if (!/^\d*\.?\d*$/.test(v) || !/\d/.test(v)) return 'a04.err.f06.chars';
    var dot = v.indexOf('.');
    if (dot >= 0 && v.length - dot - 1 > 2) return 'a04.err.f06.dec';
    var n = parseFloat(v);
    if (!(n >= 0.01)) return 'a04.err.f06.min';
    if (n > 9999.99) return 'a04.err.f06.max';
    return null;
  }
  /* On blur, visibly: Western digits, "," → ".", two decimals, "." → "0.". */
  function normalisePrice(raw) {
    var v = priceText(raw);
    if (!/^\d*\.?\d*$/.test(v) || !/\d/.test(v)) return v || A.trim(raw);
    var dot = v.indexOf('.');
    var ip = dot < 0 ? v : v.slice(0, dot);
    var dp = dot < 0 ? '' : v.slice(dot + 1);
    if (dp.length > 2) return v;
    ip = ip ? String(parseInt(ip, 10)) : '0';
    while (dp.length < 2) dp += '0';
    return ip + '.' + dp;
  }

  /* ---- Validation (§7.7), in reading order ------------------------- */
  function validate() {
    var v = F.v, e = {}, order = [];
    function put(f, k) { e[f] = k; order.push(f); }
    if (!len(v.nameAr)) put('F01', 'a04.err.f01.empty'); else if (len(v.nameAr) > NAME_MAX) put('F01', 'a04.err.f01.long');
    if (!len(v.nameEn)) put('F02', 'a04.err.f02.empty'); else if (len(v.nameEn) > NAME_MAX) put('F02', 'a04.err.f02.long');
    if (len(v.descAr) > DESC_MAX) put('F03', 'a04.err.f03.long');
    if (len(v.descEn) > DESC_MAX) put('F04', 'a04.err.f04.long');
    var c = A.Cat.load();
    var cats = c ? A.Cat.catIds(c) : {};
    if (!v.category || !cats[v.category]) put('F05', 'a04.err.f05');
    var pe = priceError(v.price);
    if (pe) put('F06', pe);
    return { errors: e, order: order };
  }
  function fieldError(f) {
    var all = validate().errors;
    return all[f] || null;
  }

  function isDirty() {
    if (!F || F.loadFailed || !F.init) return false;
    var a = F.v, b = F.init;
    return A.trim(a.nameAr) !== A.trim(b.nameAr) || A.trim(a.nameEn) !== A.trim(b.nameEn) ||
           A.trim(a.descAr) !== A.trim(b.descAr) || A.trim(a.descEn) !== A.trim(b.descEn) ||
           a.category !== b.category || normalisePrice(a.price) !== normalisePrice(b.price) ||
           !!a.inStock !== !!b.inStock || (a.image || null) !== (b.image || null);
  }

  function noCategories() { var c = A.Cat.load(); return !c || !(c.categories || []).length; }

  /* The one save — also what AM-01 "Save and continue" runs (AM-01 §5.2).
     Returns 'ok' | 'invalid' | 'failed'. */
  function commit() {
    if (!F || F.busy || F.uploading) return 'failed';
    var r = validate();
    F.triedSave = true;
    F.errors = r.errors;
    F.saveFailed = false;
    if (r.order.length) { F.focusField = r.order[0]; return 'invalid'; }
    F.busy = true;
    var v = F.v;
    var c = A.Cat.load();
    var ok = false, product = null;
    if (c) {
      var data = {
        nameAr: A.trim(A.oneLine(v.nameAr)), nameEn: A.trim(A.oneLine(v.nameEn)),
        descAr: A.trim(v.descAr), descEn: A.trim(v.descEn),
        price: parseFloat(normalisePrice(v.price)), category: v.category, inStock: !!v.inStock,
        image: v.image || null
      };
      if (F.mode === 'create') {
        product = { id: 'p-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    nameAr: data.nameAr, nameEn: data.nameEn, descAr: data.descAr, descEn: data.descEn,
                    price: data.price, category: data.category, inStock: data.inStock, removed: false };
        if (data.image) product.image = data.image;
        c.products.push(product);                        // last in its category (A-03 §7.3)
        ok = A.Cat.save(c);
      } else {
        var i = -1;
        for (var j = 0; j < c.products.length; j++) if (c.products[j].id === F.id) { i = j; break; }
        if (i >= 0) {
          product = c.products[i];
          var moved = product.category !== data.category;
          product.nameAr = data.nameAr; product.nameEn = data.nameEn;
          product.descAr = data.descAr; product.descEn = data.descEn;
          product.price = data.price; product.category = data.category;
          if (!product.removed) product.inStock = data.inStock;
          if (data.image) product.image = data.image; else delete product.image;
          if (moved) { c.products.splice(i, 1); c.products.push(product); }   // end of the new category
          ok = A.Cat.save(c);
        }
      }
    }
    F.busy = false;
    if (!ok) { F.saveFailed = true; return 'failed'; }
    A.a03.saved(product, F.mode);
    F.init = copy(F.v);
    return 'ok';
  }

  /* ---- Image (§5.4, §7.6) — validated in the browser, centre-cropped to
     a square and kept as that crop, so the preview is exactly what is
     stored and what the guest's card shows. ---------------------------- */
  function chooseImage(file) {
    F.imgErr = null;
    if (!file) return;
    if (['image/jpeg', 'image/png', 'image/webp'].indexOf(file.type) < 0) { F.imgErr = 'a04.img.fmt'; redraw(); return; }
    if (file.size > 5 * 1024 * 1024) { F.imgErr = 'a04.img.size'; redraw(); return; }
    F.uploading = true; redraw();
    var done = false;
    var timer = setTimeout(function () { finish(null, 'a04.img.fail'); }, 30000);
    function finish(dataUrl, err) {
      if (done) return;
      done = true; clearTimeout(timer);
      if (!F) return;
      F.uploading = false;
      if (dataUrl) F.v.image = dataUrl;
      F.imgErr = err || null;
      redraw();
      if (A.Modal.current() && A.Modal.current().id === 'AM-01') A.Modal.redraw();
    }
    var rd = new FileReader();
    rd.onerror = function () { finish(null, 'a04.img.fail'); };
    rd.onload = function () {
      var img = new Image();
      img.onerror = function () { finish(null, 'a04.img.fmt'); };
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        if (w < 500 || h < 500) { finish(null, 'a04.img.small'); return; }
        try {
          var side = Math.min(w, h), out = 400;
          var cv = document.createElement('canvas');
          cv.width = out; cv.height = out;
          cv.getContext('2d').drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, out, out);
          finish(cv.toDataURL('image/jpeg', 0.85), null);
        } catch (e) { finish(null, 'a04.img.fail'); }
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }

  function redraw() {
    if (A.cur.id !== 'A-04') return;
    A.renderView();
  }

  /* ---- Rendering ---------------------------------------------------- */
  function counter(el, used, max) {
    return '<div class="field__counter adm-counter' + (used > max ? ' is-over' : '') + '"' + A.el('A-04-C05') + ' data-counter="' + el + '">' + used + '/' + max + '</div>';
  }
  function errLine(f) {
    var k = F.errors[f];
    return '<p class="error adm-ferr" data-err="' + f + '"' + (k ? '' : ' hidden') + '>' + (k ? esc(t(k)) : '') + '</p>';
  }
  function textField(f, key, name, max, multi) {
    var dis = F.busy ? ' disabled' : '';
    var val = F.v[name];
    var id = 'a04-' + f.toLowerCase();
    var h = '<div class="adm-field' + (F.errors[f] ? ' field--error' : '') + '" data-field="' + f + '">';
    h += '<label class="adm-label" for="' + id + '">' + esc(t(key)) + '</label>';
    var dirAttr = (name === 'nameAr' || name === 'descAr') ? ' lang="ar" dir="rtl"' : ' lang="en" dir="ltr"';
    if (multi) h += '<textarea id="' + id + '" class="field__area adm-input" rows="5" data-name="' + name + '"' + dirAttr + A.el('A-04-' + f) + dis + '>' + esc(val) + '</textarea>';
    else h += '<input id="' + id + '" type="text" class="field__input adm-input" data-name="' + name + '"' + dirAttr + A.el('A-04-' + f) + dis + ' value="' + esc(val) + '">';
    h += counter(f, len(val), max);
    h += errLine(f);
    return h + '</div>';
  }
  function previewHtml() {
    var s = A.settings();
    var ok = !priceError(F.v.price);
    var amt = ok ? parseFloat(normalisePrice(F.v.price)) : 0;
    return '<div class="adm-note adm-preview"' + A.el('A-04-C04') + (ok ? '' : ' hidden') + '>' +
           '<div>' + esc(t('a04.c04.l1')) + '</div>' +
           '<div>' + esc(t('a04.c04.l2', { ar: A.moneyIn('ar', amt, s), en: A.moneyIn('en', amt, s) })) + '</div></div>';
  }

  var view = {
    enter: function (params, query) {
      F = { mode: params.mode, id: params.id || null, errors: {}, triedSave: false, busy: false, uploading: false,
            imgErr: null, saveFailed: false, loadFailed: false, removed: false, restoreFailed: false };
      if (params.mode === 'create') {
        F.v = blank();
        var c = A.Cat.load();
        if (query && query.cat && c && A.Cat.catIds(c)[query.cat]) F.v.category = query.cat;
        F.init = copy(F.v);
      } else {
        var p = A.Cat.product(params.id);
        if (!p) { F.loadFailed = true; F.v = blank(); F.init = null; }
        else { F.v = fromProduct(p); F.init = copy(F.v); F.removed = !!p.removed; }
      }
    },
    leave: function () { F = null; },
    afterEnter: function () {
      if (F && F.mode === 'create') { var e = document.getElementById('a04-f01'); if (e) e.focus(); }
    },
    isDirty: isDirty,
    commit: commit,
    /* AM-01 §5.3: why "Save and continue" cannot run now, or null. */
    saveBlocked: function () {
      if (F && F.uploading) return 'upload';
      if (noCategories()) return 'nocat';
      return null;
    },
    showCommitResult: function () { redraw(); focusFirst(); },

    render: function () {
      var h = '<div class="adm-page adm-page--form">';
      h += '<div class="adm-head"' + A.el('A-04-S01') + '><h1 class="adm-title"' + A.el('A-04-C01') + '>' +
           esc(t(F.mode === 'create' ? 'a04.c01.create' : 'a04.c01.edit')) + '</h1></div>';
      if (F.loadFailed) {
        return h + '<div class="adm-state"><p>' + esc(t('a04.loadErr')) + '</p>' +
               '<button type="button" class="adm-textbtn" data-act="reload">' + esc(t('ad.retry')) + '</button></div></div>';
      }
      var dis = F.busy ? ' disabled' : '';
      var noCat = noCategories();
      h += '<form class="adm-form" novalidate' + A.el('A-04-S02') + '>';
      if (F.removed) h += '<div class="adm-banner"' + A.el('A-04-C11') + '>' + esc(t('a04.c11')) + '</div>';
      h += '<div class="adm-pair">' + textField('F01', 'a04.f01', 'nameAr', NAME_MAX) + textField('F02', 'a04.f02', 'nameEn', NAME_MAX) + '</div>';
      h += '<div class="adm-pair">' + textField('F03', 'a04.f03', 'descAr', DESC_MAX, true) + textField('F04', 'a04.f04', 'descEn', DESC_MAX, true) + '</div>';

      /* Category */
      h += '<div class="adm-field' + (F.errors.F05 ? ' field--error' : '') + '" data-field="F05">';
      h += '<label class="adm-label" for="a04-f05">' + esc(t('a04.f05')) + '</label>';
      if (noCat) {
        h += '<p class="adm-banner"' + A.el('A-04-C13') + '>' + esc(t('a04.c13')) + '</p>';
      } else {
        var c = A.Cat.load();
        h += '<select id="a04-f05" class="adm-input adm-w360"' + A.el('A-04-F05') + dis + '><option value="">' + esc(t('a04.f05.first')) + '</option>';
        c.categories.forEach(function (k) {
          h += '<option value="' + esc(k.id) + '"' + (F.v.category === k.id ? ' selected' : '') + '>' + esc(A.catName(k)) + '</option>';
        });
        h += '</select>';
      }
      h += errLine('F05') + '</div>';

      /* Price — the label is static, in the guest's position (§5.3) */
      var s = A.settings();
      var affix = '<span class="adm-affix">' + esc(I18N.lang === 'en' ? (s.currencyEn || 'SAR') : (s.currencyAr || 'ر.س')) + '</span>';
      var input = '<input id="a04-f06" type="text" inputmode="decimal" autocomplete="off" class="adm-input adm-w200 num"' + A.el('A-04-F06') + dis + ' value="' + esc(F.v.price) + '">';
      h += '<div class="adm-field' + (F.errors.F06 ? ' field--error' : '') + '" data-field="F06">';
      h += '<label class="adm-label" for="a04-f06">' + esc(t('a04.f06')) + '</label>';
      h += '<div class="adm-price">' + (I18N.lang === 'en' ? affix + input : input + affix) + '</div>';
      h += errLine('F06');
      h += previewHtml();
      h += '<p class="adm-note"' + A.el('A-04-C03') + '>' + esc(t('ad.noFees')) + '</p>';
      h += '</div>';

      /* Image */
      h += '<div class="adm-field"><span class="adm-label">' + esc(t('a04.img.label')) + '</span>';
      h += '<div class="adm-imgrow"><div class="adm-imgbox"' + A.el('A-04-C07') + '>';
      if (F.uploading) h += '<span class="adm-imgbox__text">' + esc(t('a04.uploading')) + '</span>';
      else if (F.v.image) h += '<img src="' + esc(F.v.image) + '" alt="">';
      else h += '<span class="adm-imgbox__icon" aria-hidden="true">▢</span>';
      h += '</div><div class="adm-imgrow__side">';
      h += '<button type="button" class="btn btn--ghost adm-btn40" data-act="pick"' + A.el('A-04-B05') + (F.uploading || F.busy ? ' disabled' : '') + '>' + esc(t('a04.b05')) + '</button>';
      h += '<input type="file" accept="image/jpeg,image/png,image/webp" class="sr-only" tabindex="-1" id="a04-file">';
      if (F.v.image && !F.uploading) h += '<button type="button" class="adm-textbtn" data-act="noimg"' + A.el('A-04-B04') + '>' + esc(t('a04.b04')) + '</button>';
      h += '<p class="adm-note"' + A.el('A-04-C06') + '>' + esc(t('a04.c06')) + '</p>';
      if (F.imgErr) h += '<p class="error">' + esc(t(F.imgErr)) + '</p>';
      h += '</div></div></div>';

      /* Stock — a form field here, saved with Save (§5.5) */
      var on = !!F.v.inStock;
      h += '<div class="adm-field"><span class="adm-label">' + esc(t('a04.f07.label')) + '</span>';
      h += '<button type="button" role="switch" aria-checked="' + on + '" class="adm-switch' + (on ? ' is-on' : '') + '" data-act="stock"' +
           A.el('A-04-F07') + (F.busy || F.removed ? ' disabled' : '') + '><span class="adm-switch__track" aria-hidden="true"><span class="adm-switch__knob"></span></span>' +
           '<span class="adm-switch__word">' + esc(t(on ? 'a04.f07.on' : 'a04.f07.off')) + '</span></button></div>';

      h += '<p class="adm-note"' + A.el('A-04-C09') + '>' + esc(t('ad.propagate')) + '</p>';
      if (F.saveFailed || F.restoreFailed) h += '<p class="error"' + A.el('A-04-C12') + '>' + esc(t('ad.formSaveFail')) + '</p>';
      else if (F.triedSave && Object.keys(F.errors).length) h += '<p class="error"' + A.el('A-04-C08') + '>' + esc(t('ad.checkFields')) + '</p>';

      h += '<div class="adm-actions">';
      h += '<button type="submit" class="btn btn--primary adm-btn44 adm-w160"' + A.el('A-04-B01') + (F.busy || F.uploading || noCat ? ' disabled' : '') + '>' +
           (F.busy ? '<span' + A.el('A-04-C14') + '>' + esc(t('ad.saving')) + '</span>' : esc(t('ad.save'))) + '</button>';
      h += '<button type="button" class="btn btn--ghost adm-btn44 adm-w120" data-act="cancel"' + A.el('A-04-B02') + dis + '>' + esc(t('ad.cancel')) + '</button>';
      if (F.mode === 'edit') {
        h += '<span class="adm-actions__end"><button type="button" class="adm-textbtn" data-act="' + (F.removed ? 'restore' : 'remove') + '"' + A.el('A-04-B03') + dis + '>' +
             esc(t(F.removed ? 'a04.b03.restore' : 'a04.b03.remove')) + '</button></span>';
      }
      h += '</div></form></div>';
      return h;
    },

    mount: function (root) {
      var form = root.querySelector('form');
      root.addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]');
        if (!b || !root.contains(b) || b.disabled) return;
        var act = b.getAttribute('data-act');
        if (act === 'reload') { view.enter(A.cur.params, A.cur.query); redraw(); }
        else if (act === 'cancel') { A.navigate(A.a03.back()); }
        else if (act === 'pick') { var fi = document.getElementById('a04-file'); if (fi) fi.click(); }
        else if (act === 'noimg') { F.v.image = null; F.imgErr = null; redraw(); }
        else if (act === 'stock') { F.v.inStock = !F.v.inStock; redraw(); var sw = document.querySelector('[data-el="A-04-F07"]'); if (sw) sw.focus(); }
        else if (act === 'remove') {
          var p = A.Cat.product(F.id);
          if (p) A.Modal.open('AM-02', { variant: 'P', from: 'A-04', product: p, dirty: isDirty() });
        } else if (act === 'restore') {
          var r = A.Cat.restore(F.id);
          if (r) { F.removed = false; F.restoreFailed = false; F.v.inStock = false; if (F.init) F.init.inStock = false; }
          else F.restoreFailed = true;
          redraw();
        }
      });
      if (!form) return;
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var res = commit();
        if (res === 'ok') { A.navigate(A.a03.back(), { force: true }); return; }
        redraw();
        focusFirst();
      });
      var fi = root.querySelector('#a04-file');
      if (fi) fi.addEventListener('change', function () { var f = fi.files && fi.files[0]; fi.value = ''; chooseImage(f); });

      var fields = root.querySelectorAll('[data-name]');
      for (var i = 0; i < fields.length; i++) bindText(fields[i]);
      var cat = root.querySelector('#a04-f05');
      if (cat) cat.addEventListener('change', function () {
        F.v.category = cat.value;
        if (F.triedSave) setErr('F05', fieldError('F05'));
      });
      var price = root.querySelector('#a04-f06');
      if (price) {
        price.addEventListener('input', function () { F.v.price = price.value; updatePreview(); });
        price.addEventListener('blur', function () {
          var n = normalisePrice(price.value);
          if (n !== price.value) { price.value = n; F.v.price = n; }
          updatePreview();
          if (F.triedSave) setErr('F06', fieldError('F06'));
        });
      }
    }
  };

  function bindText(el) {
    var name = el.getAttribute('data-name');
    var f = el.closest('[data-field]').getAttribute('data-field');
    var multi = el.tagName === 'TEXTAREA';
    var max = (name === 'nameAr' || name === 'nameEn') ? NAME_MAX : DESC_MAX;
    el.addEventListener('input', function () {
      if (!multi && /[\r\n]/.test(el.value)) el.value = A.oneLine(el.value);   // a pasted line break → a space
      F.v[name] = el.value;
      var c = document.querySelector('[data-counter="' + f + '"]');
      if (c) { var u = len(el.value); c.textContent = u + '/' + max; c.classList.toggle('is-over', u > max); }
    });
    el.addEventListener('blur', function () { if (F && F.triedSave) setErr(f, fieldError(f)); });
  }

  function setErr(f, key) {
    F.errors[f] = key || undefined;
    if (!key) delete F.errors[f];
    var box = document.querySelector('[data-field="' + f + '"]');
    if (!box) return;
    box.classList.toggle('field--error', !!key);
    var p = box.querySelector('[data-err="' + f + '"]');
    if (p) { p.textContent = key ? t(key) : ''; if (key) p.removeAttribute('hidden'); else p.setAttribute('hidden', ''); }
  }

  function updatePreview() {
    var old = document.querySelector('[data-el="A-04-C04"]');
    if (!old) return;
    var wrap = document.createElement('div');
    wrap.innerHTML = previewHtml();
    old.parentNode.replaceChild(wrap.firstChild, old);
  }

  function focusFirst() {
    if (!F || !F.focusField) return;
    var map = { F01: 'a04-f01', F02: 'a04-f02', F03: 'a04-f03', F04: 'a04-f04', F05: 'a04-f05', F06: 'a04-f06' };
    var el = document.getElementById(map[F.focusField]);
    F.focusField = null;
    if (el) el.focus();
  }

  A.views['A-04'] = view;
})();

</script>
<script>
/* admin/js/a05-categories.js */
/* A-05 — الفئات / Categories. spec/admin/screens/A-05.md
   The guest's category bar, written out as rows. Order changes save at
   once; names are committed by the inline row's own Save. Every write goes
   through HotelDB.saveCatalog(). */
(function () {
  'use strict';
  var A = window.Admin;

  I18N.register({
    'a05.c01': { ar: 'الفئات', en: 'Categories' },
    'a05.c02': { ar: '{N} من 20 فئة', en: '{N} of 20 categories' },

                 en: 'The order here is the order of the category bar in the store. A category with no products is not shown to guests.' },

    'a05.col.ar': { ar: 'الاسم بالعربية', en: 'Arabic name' },
